<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<title>المتجر</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--pc:#0f4f49;--pl:#167c73;--tx:#19312e;--tl:#4f6762;--white:#f9fbfa;--sm:0 4px 8px rgba(0,0,0,.08);--lg:0 12px 28px rgba(0,0,0,.18);--tr:all .35s cubic-bezier(.4,0,.2,1)}
html,body{min-height:100%;overflow-x:hidden}
body{font-family:'Tajawal',Tahoma,Arial,sans-serif;color:var(--tx);line-height:1.6;background:#0b1f1d}
#bg{position:fixed;inset:-40px;z-index:-2;background:#0b1f1d center/cover no-repeat;filter:blur(20px) brightness(.62) saturate(1.1);transform:scale(1.06)}
#shade{position:fixed;inset:0;z-index:-1;background:linear-gradient(rgba(0,0,0,.18),rgba(0,0,0,.4))}
.page{max-width:700px;margin:0 auto;padding:70px 14px 40px;min-height:100vh}
.lang{position:fixed;top:16px;inset-inline-end:16px;z-index:900;padding:9px 16px;border:none;border-radius:12px;background:var(--pc);color:#fff;font:700 14px 'Tajawal',sans-serif;cursor:pointer;box-shadow:var(--sm);transition:var(--tr)}
.lang:active{transform:scale(.95)}
.card{background:linear-gradient(180deg,rgba(237,245,242,.95),rgba(230,240,236,.95));border:1px solid rgba(15,79,73,.1);border-radius:22px;box-shadow:var(--lg);padding:26px 18px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
h1.title{text-align:center;color:var(--pc);font-weight:900;font-size:24px;margin-bottom:4px}
.tag{text-align:center;font-size:13px;color:var(--tl);margin-bottom:16px;font-weight:500}
.note{background:rgba(201,168,76,.18);border:1px solid rgba(201,168,76,.55);color:#7a5c10;font-size:12px;font-weight:700;text-align:center;padding:8px 12px;border-radius:12px;margin-bottom:16px}
#grid{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;width:100%}
.n-btn{flex:0 0 calc(33.333% - 7px);min-height:112px;background:linear-gradient(180deg,#dfecea,#d4e4e0);color:var(--pc);border:1.5px solid #b8cfca;border-radius:16px;cursor:pointer;box-shadow:var(--sm);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:10px 6px;position:relative;overflow:hidden;transition:var(--tr);font-family:inherit}
.n-btn:hover{transform:translateY(-2px);border-color:var(--pl);box-shadow:0 10px 18px rgba(15,79,73,.14)}
.n-btn .im{width:54px;height:54px;object-fit:cover;border-radius:12px;margin-bottom:7px;transition:var(--tr);flex:none;background:rgba(15,79,73,.08)}
.n-btn .tw{display:flex;flex-direction:column;align-items:center;width:100%;transition:var(--tr)}
.n-btn .nm{font-size:13px;font-weight:800;line-height:1.25;color:var(--pc)}
.n-btn .ds{font-size:12px;color:rgba(255,255,255,.92);opacity:0;max-height:0;overflow:hidden;transition:var(--tr);font-weight:500;white-space:pre-wrap}
.n-btn .pr{font-size:12px;font-weight:800;color:var(--pl);margin-top:2px}
.n-btn.expanded{flex:0 0 100%;order:-2;min-height:120px;flex-direction:row;background:linear-gradient(135deg,var(--pc),var(--pl));color:var(--white);border:none;box-shadow:0 15px 30px rgba(15,79,73,.25);padding:18px;justify-content:flex-start;text-align:start;border-radius:20px}
.n-btn.expanded .im{width:78px;height:78px;margin-bottom:0;margin-inline-end:16px;border-radius:16px}
.n-btn.expanded .tw{align-items:flex-start;text-align:start}
.n-btn.expanded .nm{font-size:20px;margin-bottom:4px;color:var(--white)}
.n-btn.expanded .ds{opacity:1;max-height:70px}
.n-btn.expanded .pr{color:#ffe9a8;font-size:17px;margin-top:4px}
.n-btn.shrunken{flex:0 0 52px;height:52px;min-height:auto;border-radius:50%;padding:0;background:#cfe0dc;border:1px solid #b8cfca;box-shadow:none;opacity:.85;order:0}
.n-btn.shrunken:hover{opacity:1;transform:scale(1.08)}
.n-btn.shrunken .im{width:100%;height:100%;margin:0;border-radius:50%}
.n-btn.shrunken .tw{display:none}
#fm{flex:0 0 100%;order:-1;max-height:0;opacity:0;overflow:hidden;transition:var(--tr)}
#fm.show{max-height:2600px;opacity:1;margin:6px 0 14px;padding-top:16px;border-top:1px dashed #c5d9d5}
.row{margin-bottom:14px;display:flex;flex-direction:column}
.row label{font-weight:700;font-size:14px;margin-bottom:7px;color:var(--tx)}
.row input{padding:12px 15px;border-radius:12px;border:1px solid #bdd0cb;font:500 14px 'Tajawal',sans-serif;outline:none;background:#dfeae7;color:var(--tx);width:100%;transition:all .25s}
.row input:focus{background:#f0f6f4;border-color:var(--pc);box-shadow:0 0 0 4px rgba(15,79,73,.1)}
.row input[readonly]{opacity:.85}
.qty{display:flex;align-items:center;justify-content:center;gap:20px;margin:4px 0 8px}
.qty button{width:42px;height:42px;border-radius:50%;border:1px solid #b8cfca;background:#dfecea;color:var(--pc);font-size:22px;font-weight:800;cursor:pointer}
.qty b{font-size:22px;min-width:34px;text-align:center}
.tot{text-align:center;font-weight:900;font-size:19px;color:var(--pc);margin-bottom:12px}
.pay{background:#e4efec;border:1px dashed #9bbab4;border-radius:12px;padding:10px 12px;font-size:14px;white-space:pre-wrap;margin-bottom:12px}
#map{width:100%;height:240px;margin:4px 0 14px;border-radius:16px;border:1px solid #bdd0cb;overflow:hidden;z-index:1;background:#dfeae7}
.gps{padding:9px 14px;border-radius:12px;border:1px solid #b8cfca;background:#dfecea;color:var(--pc);font:700 13px 'Tajawal',sans-serif;cursor:pointer;margin-top:8px;align-self:flex-start}
.go{width:100%;padding:15px;border-radius:14px;border:none;background:linear-gradient(135deg,var(--pc),var(--pl));color:#fff;font:800 16px 'Tajawal',sans-serif;cursor:pointer;margin-top:6px;transition:all .3s}
.go:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(15,79,73,.25)}
.go:disabled{opacity:.6;cursor:wait}
.sec{display:block;width:100%;padding:11px;margin-top:8px;border-radius:12px;border:1px solid #b8cfca;background:#e4efec;color:var(--pc);font:700 14px 'Tajawal',sans-serif;cursor:pointer}
.msg{display:none;margin-top:10px;padding:11px 12px;border-radius:10px;font-weight:700;font-size:13px;text-align:center}
.msg.err{display:block;background:#fce4e4;color:#b42323}
.center{text-align:center;padding:50px 10px;color:var(--tl)}
.foot{text-align:center;font-size:11px;color:rgba(255,255,255,.55);margin-top:18px}
#ov{position:fixed;inset:0;z-index:10000;background:rgba(7,24,22,.62);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;padding:12px}
#ov.on{display:flex}
.oc{width:min(100%,420px);background:linear-gradient(180deg,#f4faf8,#e3f0ec);border:1px solid rgba(15,79,73,.18);border-radius:24px;box-shadow:0 24px 60px rgba(0,0,0,.3);padding:24px 22px;text-align:center;animation:pop .28s ease-out both;color:var(--tx)}
@keyframes pop{from{transform:translateY(14px) scale(.96);opacity:0}to{transform:none;opacity:1}}
.oc h3{font-size:20px;font-weight:900;color:var(--pc);margin-bottom:6px}
.oc .sub{font-size:13px;color:var(--tl);margin-bottom:14px}
.otp{width:100%;font:900 28px 'Tajawal',sans-serif;letter-spacing:10px;text-align:center;direction:ltr;padding:12px;border-radius:14px;border:1px solid #bdd0cb;background:#dfeae7;outline:none;color:var(--pc)}
.okk{font-size:54px}
.sum{background:#e4efec;border-radius:14px;padding:10px 12px;margin:12px 0;font-size:14px;font-weight:700}
.leaflet-container{background:#dfeae7!important}
</style>
</head>
<body>
<div id="bg"></div><div id="shade"></div>
<button class="lang" id="lg" onclick="toggleLang()">EN</button>
<div class="page"><div class="card" id="root"><div class="center">…</div></div><button class="sec" id="inst" style="display:none;background:rgba(255,255,255,.16);color:#fff;border-color:rgba(255,255,255,.3);margin-top:14px" onclick="install()"></button><div class="foot" id="ft"></div></div>
<div id="ov"><div class="oc" id="ovc"></div></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const BACK=(new URLSearchParams(location.search).get('b')||'').trim();
const OKURL=/^https:\/\/script\.google\.com\/macros\/s\/[A-Za-z0-9_-]{10,200}\/exec$/.test(BACK);
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>'$'+(Math.round(Number(n)*1000)/1000);
const loc=n=>(ST&&ST.currency&&n!==''&&n!=null)?(Math.round(Number(n)*100)/100).toLocaleString('en-US')+' '+ST.currency:'';
const price=(usd,l)=>money(usd)+(loc(l)?' · '+loc(l):'');
const TX={ar:{pickP:'اختر المنتج',pickS:'اختر الخدمة',pack:'وحدات',sel:'العنصر المحدد',qty:'الكمية',total:'الإجمالي',pay:'💳 الدفع بالتحويل البنكي: بعد إرسال الطلب ستصلك بيانات الحساب مع رمز التحقق على بريدك، حوّل المبلغ بالعملة المحلية ثم ينتظر طلبك مراجعة صاحب المتجر',txn:'',payNow:'بيانات الدفع (حوّل المبلغ ثم انتظر مراجعة صاحب المتجر)',name:'اسم مقدم الطلب',phone:'رقم هاتف التواصل',email:'البريد الإلكتروني (يصلك عليه الرمز وبيانات الدفع وقرار الطلب)',loc:'مكان التنفيذ / التسليم',locPh:'حدد الموقع على الخريطة 📍',gps:'📍 موقعي الحالي',time:'الوقت المفضل (اختياري)',send:'تأكيد الطلب',code:'رمز التحقق',codeSub:'أدخل الرمز المرسل إلى بريدك',verify:'تأكيد',cancel:'إلغاء',done:'تم استلام طلبك ✅',doneSub:'سيراجعه صاحب المتجر ويتواصل معك قريباً',oid:'رقم الطلب',back:'العودة للمتجر',gone:'هذا المتجر غير متاح حالياً',bad:'رابط المتجر غير صحيح',net:'فشل الاتصال — تحقق من الإنترنت',retry:'إعادة المحاولة',by:'مدعوم من لاڤندرز',sending:'جاري الإرسال...',inst:'📲 ثبّت المتجر كتطبيق',instHelp:'من قائمة المتصفح اختر «إضافة إلى الشاشة الرئيسية»'},
 en:{pickP:'Choose a product',pickS:'Choose a service',pack:'units',sel:'Selected item',qty:'Quantity',total:'Total',pay:'💳 Bank transfer: after you send the order, the account details arrive with the verification code in your email — transfer the amount in local currency, then the store owner reviews your order',txn:'',payNow:'Payment details (transfer, then wait for the owner to review)',name:'Your name',phone:'Contact phone',email:'Email (receives the code, payment details and the decision)',loc:'Service / delivery location',locPh:'Pick the location on the map 📍',gps:'📍 My location',time:'Preferred time (optional)',send:'Confirm order',code:'Verification code',codeSub:'Enter the code sent to your email',verify:'Confirm',cancel:'Cancel',done:'Your order was received ✅',doneSub:'The store owner will review it and contact you soon',oid:'Order ID',back:'Back to store',gone:'This store is currently unavailable',bad:'Invalid store link',net:'Connection failed — check your internet',retry:'Retry',by:'Powered by LAVNDR',sending:'Sending...',inst:'📲 Install as app',instHelp:'From the browser menu choose “Add to Home screen”'}};
let LG='ar';try{LG=localStorage.getItem('st_lang')||'ar'}catch(e){}
let ST=null,SEL=-1,QTY=1,SESSION='',MAP=null,MK=null,GT=null;
const t=k=>TX[LG][k];
function toggleLang(){LG=LG==='ar'?'en':'ar';try{localStorage.setItem('st_lang',LG)}catch(e){}applyLang();if(ST)home()}
function applyLang(){document.documentElement.lang=LG;document.documentElement.dir=LG==='ar'?'rtl':'ltr';$('lg').textContent=LG==='ar'?'EN':'عربي';$('ft').textContent=t('by');const b=$('inst');b.textContent=t('inst');b.style.display=(window.matchMedia('(display-mode: standalone)').matches||/LavndrApp|; wv\)/i.test(navigator.userAgent))?'none':'block'}
let cbN=0;
function call(params){return new Promise(res=>{
  const cb='__cb'+(++cbN)+'_'+Date.now(),s=document.createElement('script');let done=false;
  const fin=r=>{if(done)return;done=true;clearTimeout(tm);delete window[cb];s.remove();res(r)};
  window[cb]=fin;const tm=setTimeout(()=>fin({error:t('net')}),25000);
  s.onerror=()=>fin({error:t('net')});
  s.src=BACK+'?'+new URLSearchParams(Object.assign({callback:cb},params)).toString();document.head.appendChild(s);
})}
function setBg(u){if(u){const i=new Image();i.onload=()=>{$('bg').style.backgroundImage='url("'+u+'")'};i.src=u}}
function gone(m){$('root').innerHTML='<div class="center"><div style="font-size:40px">🛍️</div><p style="margin-top:10px;font-weight:700">'+esc(m||t('gone'))+'</p></div>'}
async function init(){
  applyLang();
  if(!OKURL){gone(t('bad'));return}
  const j=await call({action:'config'});
  if(j.error){$('root').innerHTML='<div class="center">'+esc(j.error)+'<button class="sec" onclick="init()">'+t('retry')+'</button></div>';return}
  if(j.status==='locked'){gone(j.message);return}
  ST=j;document.title=j.name;setBg(j.bizImage);home();
}
function killMap(){if(MAP){try{MAP.remove()}catch(e){}MAP=null;MK=null}}
function home(){
  SEL=-1;QTY=1;killMap();
  let h='<h1 class="title">'+esc(ST.name)+'</h1><div class="tag">'+t(ST.kind==='products'?'pickP':'pickS')+'</div>';
  if(ST.trialNote)h+='<div class="note">'+esc(ST.trialNote)+'</div>';
  h+='<div id="grid">'+ST.items.map(it=>'<button class="n-btn" data-i="'+it.idx+'"><img class="im" src="'+esc(it.imageUrl)+'" alt="" onerror="this.style.visibility=\'hidden\'"><div class="tw"><span class="nm">'+esc(it.name)+'</span><span class="pr">'+price(it.value,it.localValue)+'</span><div class="ds">'+esc(it.desc||'')+(it.packLabel?'\n'+esc(it.packLabel)+(it.packQty>1?' ('+esc(it.packQty)+' '+t('pack')+')':''):'')+'</div></div></button>').join('')+'<div id="fm"></div></div>';
  $('root').innerHTML=h;window.scrollTo(0,0);
  document.querySelectorAll('.n-btn').forEach(b=>b.addEventListener('click',e=>{e.stopPropagation();pick(parseInt(b.dataset.i,10))}));
}
function resetBtns(){SEL=-1;killMap();document.querySelectorAll('.n-btn').forEach(b=>b.classList.remove('expanded','shrunken'));const f=$('fm');if(f){f.classList.remove('show');f.innerHTML=''}}
function pick(i){
  if(SEL===i){resetBtns();return}
  resetBtns();SEL=i;QTY=1;const it=ST.items[i];
  document.querySelectorAll('.n-btn').forEach(b=>b.classList.add(parseInt(b.dataset.i,10)===i?'expanded':'shrunken'));
  let h='<div class="row"><label>'+t('sel')+'</label><input readonly value="'+esc(it.name)+'"></div>';
  h+='<div class="qty"><button onclick="chg(-1)">−</button><b id="q">1</b><button onclick="chg(1)">+</button></div><div class="tot">'+t('total')+' <span id="tot">'+price(it.value,it.localValue)+'</span></div>';
  h+='<div class="pay">'+esc(t('pay'))+'</div>';
  h+='<div class="row"><label>'+t('loc')+'</label><input id="cl" maxlength="120" placeholder="'+esc(t('locPh'))+'"><button class="gps" onclick="gps()">'+t('gps')+'</button></div><div id="map"></div>';
  h+='<div class="row"><label>'+t('name')+'</label><input id="cn" maxlength="60" autocomplete="name"></div>';
  h+='<div class="row"><label>'+t('phone')+'</label><input id="cp" type="tel" inputmode="tel" dir="ltr" autocomplete="tel" placeholder="+249…"></div>';
  h+='<div class="row"><label>'+t('email')+'</label><input id="ce" type="email" dir="ltr" autocomplete="email"></div>';
  h+='<div class="row"><label>'+t('time')+'</label><input id="ctm" type="datetime-local"></div>';
  h+='<div class="msg" id="em"></div><button class="go" id="sb" onclick="submitOrder()">'+t('send')+'</button>';
  const f=$('fm');f.innerHTML=h;f.classList.add('show');
  setTimeout(()=>{initMap();document.querySelector('.n-btn.expanded').scrollIntoView({behavior:'smooth',block:'start'})},380);
}
document.addEventListener('click',e=>{if(SEL>=0&&!e.target.closest('.card')&&!e.target.closest('#ov'))resetBtns()});
function chg(d){QTY=Math.min(10,Math.max(1,QTY+d));$('q').textContent=QTY;{const it=ST.items[SEL];$('tot').textContent=price(it.value*QTY,it.localValue===''?'':it.localValue*QTY)}}
let LAT='',LON='';
function initMap(){
  if(!window.L||!$('map'))return;LAT=LON='';
  MAP=L.map('map').setView([15.5,32.55],12);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(MAP);
  MK=L.marker([15.5,32.55],{draggable:true});
  MK.on('dragend',()=>setPin(MK.getLatLng().lat,MK.getLatLng().lng,true));
  MAP.on('click',e=>setPin(e.latlng.lat,e.latlng.lng,true));
  const c=$('cl');if(c)c.addEventListener('input',()=>{clearTimeout(GT);const v=c.value.trim();if(v.length<4)return;GT=setTimeout(()=>geocode(v),1000)});
  setTimeout(()=>MAP&&MAP.invalidateSize(),200);
}
function setPin(a,o,rev){
  LAT=Number(a).toFixed(6);LON=Number(o).toFixed(6);
  if(MAP&&MK){if(!MAP.hasLayer(MK))MK.addTo(MAP);MK.setLatLng([a,o])}
  const c=$('cl');if(c)c.value=LAT+', '+LON;
  if(rev)reverse(a,o);
}
async function reverse(a,o){
  try{const r=await fetch('https://nominatim.openstreetmap.org/reverse?format=jsonv2&accept-language='+LG+'&lat='+a+'&lon='+o);const j=await r.json();
    const c=$('cl');if(j&&j.display_name&&c&&/^-?\d/.test(c.value))c.value=j.display_name.split(',').slice(0,3).join(',').trim()}catch(e){}
}
async function geocode(q){
  try{const r=await fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&accept-language='+LG+'&q='+encodeURIComponent(q));const j=await r.json();
    if(j&&j[0]&&MAP){const a=Number(j[0].lat),o=Number(j[0].lon);LAT=a.toFixed(6);LON=o.toFixed(6);if(!MAP.hasLayer(MK))MK.addTo(MAP);MK.setLatLng([a,o]);MAP.setView([a,o],15)}}catch(e){}
}
function gps(){if(!navigator.geolocation)return;navigator.geolocation.getCurrentPosition(p=>{setPin(p.coords.latitude,p.coords.longitude,true);if(MAP)MAP.setView([p.coords.latitude,p.coords.longitude],15)},()=>{},{timeout:10000})}
function payload(){
  let tm=$('ctm').value;if(tm)tm=tm.replace('T',' ');
  return {idx:SEL,qty:QTY,name:$('cn').value,phone:$('cp').value,email:$('ce').value,location:$('cl').value,time:tm,txnRef:'',lat:LAT,lon:LON}
}
function newSession(){const a=new Uint8Array(18);crypto.getRandomValues(a);return Array.from(a,b=>('0'+b.toString(16)).slice(-2)).join('')}
async function submitOrder(){
  const em=$('em'),sb=$('sb');em.className='msg';sb.disabled=true;sb.textContent=t('sending');SESSION=newSession();
  const j=await call(Object.assign({action:'send',session:SESSION},payload()));
  sb.disabled=false;sb.textContent=t('send');
  if(j.error){em.className='msg err';em.textContent=j.error;return}
  if(j.status==='sent')showOtp(j,$('ce').value);else showDone(j);
}
function showOtp(j,mail){
  $('ovc').innerHTML='<h3>'+t('code')+'</h3><div class="sub">'+esc(t('codeSub'))+'<br><span dir="ltr">'+esc(mail)+'</span></div><div class="sum">'+esc(j.item)+' × '+esc(j.qty)+' — '+money(j.total)+(j.currency?' · '+loc(j.localTotal):'')+'</div><input class="otp" id="co" inputmode="numeric" maxlength="6" autocomplete="one-time-code"><div class="msg" id="oe"></div><button class="go" id="ob" onclick="verify()">'+t('verify')+'</button><button class="sec" onclick="closeOv()">'+t('cancel')+'</button>';
  $('ov').classList.add('on');document.body.style.overflow='hidden';setTimeout(()=>$('co').focus(),60);
}
function closeOv(){$('ov').classList.remove('on');document.body.style.overflow=''}
async function verify(){
  const oe=$('oe');oe.className='msg';$('ob').disabled=true;
  const j=await call({action:'verify',session:SESSION,otp:$('co').value});
  $('ob').disabled=false;
  if(j.error){oe.className='msg err';oe.textContent=j.error;return}
  showDone(j);
}
function showDone(j){
