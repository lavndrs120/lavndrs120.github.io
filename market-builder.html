<script>

const WORKER_URL='https://lavndr.omssolutionorders.workers.dev';
const GSI_CLIENT_ID='776097955989-go2bsq8e7c1umei4vj984jtabve49m32.apps.googleusercontent.com';

const LIMITS={franchise:1,tycoon:20,tycoon_sector:400};

let TOKEN='',EMAIL='';try{TOKEN=sessionStorage.getItem('appb_token')||sessionStorage.getItem('lavndr_token')||'';EMAIL=sessionStorage.getItem('appb_email')||sessionStorage.getItem('lavndr_email')||''}catch(e){}
let S={allowed:0,tiers:[],markets:[],cur:null};

const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function showMsg(id,t,cls){const e=$(id);if(!e)return;e.className='msg '+(cls||'err');e.textContent=t}
function copyTxt(t){
  try{if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(t).catch(()=>{});}}catch(e){}
  try{const a=document.createElement('textarea');a.value=t;a.setAttribute('readonly','');a.style.cssText='position:fixed;top:0;left:0;opacity:0';document.body.appendChild(a);a.focus();a.select();a.setSelectionRange(0,t.length);const ok=document.execCommand('copy');a.remove();return ok}catch(e){return false}
}
function chromeLink(){
  const u='https://lavndrs120.github.io/market-builder.html';

}

async function api(action,params,post){
  try{let r;if(post)r=await fetch(WORKER_URL+'?action='+action,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(Object.assign({},params||{},{action:action,token:TOKEN}))});else r=await fetch(WORKER_URL+'?'+new URLSearchParams(Object.assign({},params||{},{action:action,token:TOKEN})));const j=await r.json();
    if(j&&(j.code===401||j.error==='Invalid token')){logout();return {error:'انتهت الجلسة'}}return j||{error:'رد فارغ'}}
  catch(e){return {error:'فشل الاتصال — تحقق من الإنترنت'}}
}
function logout(){TOKEN='';EMAIL='';try{sessionStorage.removeItem('appb_token');sessionStorage.removeItem('appb_email')}catch(e){}showLogin('سجّل دخولك للمتابعة')}
function showLogin(m){
  $('app').innerHTML='<div class="card" style="text-align:center"><h1>مؤشر سوقك</h1><p class="sub">'+esc(m||'سجّل دخولك بحساب Google')+'</p><div id="gsi"></div></div>';
  if(window.LavndrApp&&typeof window.LavndrApp.signIn==='function'){window.handleCredentialResponse=onCred;$('gsi').innerHTML='<button class="btn" onclick="LavndrApp.signIn()">تسجيل الدخول بحساب Google</button>';return}
  const go=()=>{if(window.google&&google.accounts&&google.accounts.id){google.accounts.id.initialize({client_id:GSI_CLIENT_ID,callback:onCred});google.accounts.id.renderButton($('gsi'),{theme:'filled_black',size:'large',shape:'pill',locale:'ar'})}else setTimeout(go,300)};go();
}
async function onCred(resp){
  $('app').innerHTML='<div class="card sub">جاري التحقق…</div>';
  try{
    const r=await fetch(WORKER_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'login',idToken:resp.credential,scope:'builder'})});
    const j=await r.json();
    if(!j.token){showLogin('فشل تسجيل الدخول — حاول مرة أخرى');return}
    TOKEN=j.token;EMAIL=j.email;try{sessionStorage.setItem('appb_token',TOKEN);sessionStorage.setItem('appb_email',EMAIL)}catch(e){}
    // مشترك فعّال يدخل عبر صفحة البناء ← واجهة «اشتراكاتك» في الداشبورد؛ غير المشترك يبقى في صفحة البناء
    try{
      const r2=await fetch(WORKER_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'login',idToken:resp.credential})});const j2=await r2.json();
      if(j2.token){const sj=await (await fetch(WORKER_URL+'?action=my_subscriptions&token='+encodeURIComponent(j2.token))).json();
        if(sj&&sj.items&&sj.items.some(x=>x.stage==='active')){sessionStorage.setItem('lavndr_token',j2.token);sessionStorage.setItem('lavndr_email',j2.email);sessionStorage.setItem('lavndr_login_chooser','1');sessionStorage.setItem('lavndr_fresh_login',String(Date.now()));try{sessionStorage.removeItem('appb_token');sessionStorage.removeItem('appb_email')}catch(e){}location.href='dashboard.html';return}}
    }catch(e){}
    boot();
  }catch(e){showLogin('فشل الاتصال — حاول مرة أخرى')}
}


let gTok='',gExp=0,gClient=null;
function saveTok(){try{sessionStorage.setItem('lvn_gt',JSON.stringify({t:gTok,x:gExp,e:String(EMAIL).toLowerCase()}))}catch(e){}}
function loadTok(){try{const o=JSON.parse(sessionStorage.getItem('lvn_gt')||'null');if(o&&o.t&&o.e===String(EMAIL).toLowerCase()&&Date.now()<o.x-60000){gTok=o.t;gExp=o.x}}catch(e){}}
function gAuth(){
  return new Promise((res,rej)=>{
    if(!gTok)loadTok();
    if(gTok&&Date.now()<gExp-60000)return res(gTok);
    // داخل تطبيق الأندرويد: Google تمنع الموافقة داخل WebView، فنستعمل النافذة الأصلية عبر الجسر LavndrApp
    if(window.LavndrApp){
      if(typeof window.LavndrApp.authorize!=='function')return rej(new Error('حدّث تطبيق لاڤندرز إلى آخر إصدار لإكمال هذه الخطوة'));
      window.__lvnAuth=function(r){
        try{if(typeof r==='string')r=JSON.parse(r)}catch(e){r={error:'bad'}}
        if(!r||r.error||!r.accessToken)return rej(new Error('لم تتم الموافقة على الصلاحيات ['+String((r&&(r.error||r.message||r.code))||'no_token').slice(0,120)+']'));
        gTok=r.accessToken;gExp=Date.now()+(Number(r.expiresIn)||3000)*1000;saveTok();res(gTok)};
      try{window.LavndrApp.authorize(G_SCOPES)}catch(e){rej(new Error('تعذّر فتح نافذة الموافقة'))}
      setTimeout(()=>rej(new Error('لم تفتح نافذة جوجل داخل التطبيق. انسخ رابط الصفحة بالزر أدناه وافتحه في Chrome وأكمل الموافقة هناك مرة واحدة، ثم ارجع للتطبيق.')),45000);
      return;
    }
    if(!(window.google&&google.accounts&&google.accounts.oauth2))return rej(new Error('تعذّر تحميل خدمة جوجل — حدّث الصفحة'));
    gClient=google.accounts.oauth2.initTokenClient({client_id:GSI_CLIENT_ID,scope:G_SCOPES,hint:EMAIL||undefined,callback:r=>{
      if(r.error)return rej(new Error('لم تتم الموافقة على الصلاحيات ['+r.error+(r.error_description?': '+String(r.error_description).slice(0,80):'')+']'));
      try{localStorage.setItem('lvn_g_ok',EMAIL)}catch(e){}gTok=r.access_token;gExp=Date.now()+(Number(r.expires_in)||3000)*1000;saveTok();res(gTok)},
      error_callback:e=>{var t=(e&&e.type)||'unknown';if(t==='popup_closed'){try{localStorage.setItem('lvn_g_ok',EMAIL)}catch(x){}rej(new Error('أُغلقت نافذة جوجل قبل رجوع النتيجة. إن كنت وافقت للتو فاضغط الزر مرة أخرى الآن، وستمرّ بدون إعادة الموافقة. ['+t+']'))}else rej(new Error('تعذّرت نافذة الموافقة ['+t+']'))}});
    var seen=false;try{seen=localStorage.getItem('lvn_g_ok')===EMAIL&&!!EMAIL}catch(e){}gClient.requestAccessToken({prompt:seen?'':'consent'});
  });
}
async function gf(url,opt,retried){
  const t=await gAuth();opt=Object.assign({},opt||{});opt.headers=Object.assign({},opt.headers||{},{Authorization:'Bearer '+t});
  const r=await fetch(url,opt);let j={};try{j=await r.json()}catch(e){}
  if(r.status===401&&!retried){gTok='';gExp=0;try{sessionStorage.removeItem('lvn_gt')}catch(e){}return gf(url,opt,true)}
  if(!r.ok){
    const m=(j.error&&j.error.message)||('خطأ '+r.status);
    if(/Apps Script API|has not enabled|not been used in project|accessNotConfigured/i.test(m)){const e=new Error('apiOff');e.apiOff=true;e.detail=m;throw e}
    const e=new Error(m);e.status=r.status;throw e;
  }
  return j;
}

async function listMarkets(){
  const q="name contains '"+PREFIX.replace(/'/g,"\\'")+"' and mimeType='application/vnd.google-apps.spreadsheet' and trashed=false";
  const j=await gf('https://www.googleapis.com/drive/v3/files?pageSize=500&fields=files(id,name)&q='+encodeURIComponent(q));
  return (j.files||[]).filter(f=>f.name.indexOf(PREFIX)===0).map(f=>({sheetId:f.id,name:f.name.slice(PREFIX.length)}));
}
async function getVals(sheetId,range){const j=await gf('https://sheets.googleapis.com/v4/spreadsheets/'+sheetId+'/values/'+encodeURIComponent(range));return j.values||[]}
async function putVals(sheetId,range,values){await gf('https://sheets.googleapis.com/v4/spreadsheets/'+sheetId+'/values/'+encodeURIComponent(range)+'?valueInputOption=RAW',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({values:values})})}
async function clearVals(sheetId,range){await gf('https://sheets.googleapis.com/v4/spreadsheets/'+sheetId+'/values/'+encodeURIComponent(range)+':clear',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'})}
function jsonp(url,params,timeout){
  return new Promise((resolve,reject)=>{
    const cb='cb_'+Date.now()+'_'+Math.random().toString(36).slice(2,8),s=document.createElement('script');
    const t=setTimeout(()=>{clean();reject(new Error('timeout'))},timeout||15000);
    function clean(){try{delete window[cb]}catch(e){window[cb]=undefined}if(s.parentNode)s.parentNode.removeChild(s);clearTimeout(t)}
    window[cb]=r=>{clean();resolve(r)};s.onerror=()=>{clean();reject(new Error('load'))};
    s.src=url+(url.indexOf('?')>-1?'&':'?')+new URLSearchParams(Object.assign({},params,{callback:cb}));document.body.appendChild(s);
  });
}
async function callBack(url,params){
  try{const r=await fetch(url+'?'+new URLSearchParams(Object.assign({callback:'cb'},params)),{credentials:'omit'});const t=await r.text(),i=t.indexOf('('),k=t.lastIndexOf(')');if(i<0||k<i)throw 0;return JSON.parse(t.slice(i+1,k))}
  catch(e){return await jsonp(url,params,25000)}
}

function privNote(){return '<div class="card" style="border-color:rgba(143,240,200,.35)"><h2 style="margin-top:0;font-size:16px">مؤشرك لك</h2><div class="small" style="line-height:2">• المؤشر يُنشأ داخل <b>حساب جوجل الخاص بك</b> (شيت وخلفية Apps Script). أنت وحدك تتحكم فيه وتحذفه متى شئت.<br>• هو <b>مؤشر مستقل</b>: لا يرتبط بمؤشر لاڤندرز الرئيسي ولا يرسل إليه شيئاً، ولاڤندرز لا تحتفظ بنسخة منه.<br>• يضم حتى 120 بزنساً وبراند، ولا يعرض الرابط العام أسماءهم ولا بيانات عملائهم.<br>• المؤشر يكشف سلوك المستهلك من الطلبات الحقيقية فقط؛ لا يوجد بيع أو شراء أو تداول لحصص، ولا وعود بعوائد.</div></div>'}
async function boot(){
  S.listed=false;S.markets=[];
  if(!TOKEN){showLogin();return}
  $('app').innerHTML='<div class="card sub">جاري التحقق من عضويتك…</div>';
  const j=await api('my_subscriptions');
  if(j.error){$('app').innerHTML='<div class="card"><div class="msg err">'+esc(j.error)+'</div><button class="btn sec" onclick="boot()">إعادة المحاولة</button></div>';return}
  const act=((j.items)||[]).filter(i=>i.stage==='active'&&LIMITS[i.tier]);
  S.tiers=act.map(i=>i.tier);S.ent=act.length>0;S.trial=!S.ent;S.allowed=S.ent?act.reduce((a,i)=>a+LIMITS[i.tier],0):1;
  renderHome();
}
function saveCount(){try{const k=String(EMAIL).toLowerCase();localStorage.setItem('lavndr_mkt_'+k,JSON.stringify({n:S.markets.length,t:Date.now()}));localStorage.setItem('lavndr_mktl_'+k,JSON.stringify(S.markets.map(m=>({sheetId:m.sheetId,name:m.name}))))}catch(e){}}
function loadCached(){try{const a=JSON.parse(localStorage.getItem('lavndr_mktl_'+String(EMAIL).toLowerCase())||'null');if(Array.isArray(a)){S.markets=a.filter(m=>m&&SHEETRX.test(m.sheetId||''));S.listed=true;return true}}catch(e){}return false}
function homeHead(){return '<h1>مؤشر سوقك</h1><p class="sub">أنشئ نسختك الخاصة من مؤشر LAVNDR120، وأضف إليها بزنساتك وبراندك.</p>'+(S.trial?'<div class="card" style="border-color:rgba(201,168,76,.5)"><div class="small" style="line-height:2">🕐 <b>تجربة فعلية لمدة 24 ساعة:</b> تُنشئ مؤشراً حقيقياً يعمل كاملاً ويمكنك مشاركته. بعد 24 ساعة يتوقف تلقائياً، ويُفتح بالاشتراك في الفرانشايز أو التايكون. مؤشر تجريبي واحد لكل حساب.</div></div>':'')+privNote()}
async function renderHome(){
  const h=homeHead();
  if(!S.listed)loadCached();
  if(!S.listed){$('app').innerHTML=h+'<div class="card"><b>الحد المسموح لعضويتك: '+S.allowed+' مؤشر</b><div class="small" style="margin:8px 0 12px;line-height:1.9">لعرض مؤشراتك الحالية وإنشاء جديدة نحتاج موافقتك على الاتصال بحسابك في جوجل (تُطلب مرة واحدة).</div><button class="btn" onclick="loadMarkets()">الاتصال بحسابي في جوجل</button>'+(window.LavndrApp?'<div class="small" style="margin-top:10px;line-height:1.9">إن لم تفتح نافذة جوجل داخل التطبيق، أكمل الموافقة من Chrome:</div><input id="clink" dir="ltr" readonly value="https://lavndrs120.github.io/market-builder.html" style="display:none;margin-top:6px" onclick="this.select()"><button class="btn sec" style="margin-top:8px" onclick="chromeLink()">نسخ رابط الصفحة</button><button class="btn sec" style="margin-top:8px" onclick="shareLink()">مشاركة الرابط (لفتحه في Chrome)</button>':'')+'<div id="m0" class="msg"></div></div>';return}
  drawHome(h)
}
async function loadMarkets(){
  showMsg('m0','جاري الاتصال… (قد تظهر نافذة موافقة من جوجل)','info');
  try{S.markets=await listMarkets();S.listed=true;saveCount();renderHome();showMsg('m0','تم التحديث: '+S.markets.length+' مؤشر في حسابك','info')}
  catch(e){showMsg('m0',(e.apiOff?'فعّل Apps Script API من script.google.com/home/usersettings ثم أعد المحاولة':(e.message||'تعذّر الاتصال')))}
}
function drawHome(h){
  h+='<div class="card"><b>مؤشراتك الآن: '+S.markets.length+' من '+S.allowed+'</b>';
  if(S.markets.length<S.allowed)h+='<button class="btn" style="margin-top:12px" onclick="renderNew()">+ إنشاء مؤشر جديد</button>';
  else h+='<div class="small" style="margin-top:8px">وصلت إلى الحد المسموح لعضويتك.</div>';
  h+='<div class="small" style="margin-top:8px"><a class="link" href="#" onclick="loadMarkets();return false">تحديث القائمة من جوجل</a></div><div id="m0" class="msg" style="margin-top:8px"></div></div>';
  S.markets.forEach((m,i)=>{h+='<div class="card build" onclick="openMarket('+i+')"><div><b>'+esc(m.name)+'</b></div><span class="small">فتح ›</span></div>'});
  $('app').innerHTML=h;
}
function renderNew(){
  $('app').innerHTML='<h1>مؤشر جديد</h1><p class="sub">اسم المؤشر الذي سيظهر على بطاقته</p><div class="card"><label>اسم المؤشر</label><input id="mname" maxlength="60" placeholder="مثال: سوق المطاعم"><div class="small" style="margin-top:12px">لون المؤشر:</div>'+mkSwatches(S.newAcc,'pickNewAcc')+'<div class="small" style="margin-top:8px">يُنشأ المؤشر في حسابك: '+esc(EMAIL)+'</div><button class="btn" style="margin-top:12px" onclick="createMarket()">إنشاء</button><button class="btn sec" onclick="renderHome()">رجوع</button><div id="m1" class="msg"></div></div>';
}
const MK_COLORS=['#C9A84C','#10B981','#38BDF8','#F472B6','#FB923C','#A78BFA'];
const MKRX=/^#[0-9A-Fa-f]{6}$/;
function mkSwatches(cur,fn){return '<div style="display:flex;gap:10px;margin-top:8px" id="mkSw">'+MK_COLORS.map(c=>'<span data-c="'+c+'" onclick="'+fn+'(\''+c+'\')" style="width:30px;height:30px;border-radius:50%;background:'+c+';cursor:pointer;border:3px solid '+(c.toLowerCase()===String(cur||MK_COLORS[0]).toLowerCase()?'#fff':'transparent')+'"></span>').join('')+'</div>'}
function mkMark(c){document.querySelectorAll('#mkSw span').forEach(x=>x.style.borderColor=x.dataset.c===c?'#fff':'transparent')}
function pickNewAcc(c){S.newAcc=c;mkMark(c)}

async function savePlans(){
  const m=S.cur;if(!m)return;showMsg('m10','جاري الحفظ…','info');
  try{
    const g=id=>String($(id).value||'').replace(/[<>]/g,'').trim();
    const bank={bank:g('pb_bank').slice(0,60),holder:g('pb_holder').slice(0,80),account:g('pb_account').slice(0,60),iban:g('pb_iban').slice(0,60),bban:g('pb_bban').slice(0,60),swift:g('pb_swift').slice(0,30),branch:g('pb_branch').slice(0,80),cur:g('pb_cur').toUpperCase().slice(0,5)};
    const on=(bank.account||bank.iban)?1:0;
    const p={on:on,bank:bank,links:(m.plans&&m.plans.links)||{}};
    await putVals(m.sheetId,'Config!F1',[[JSON.stringify(p)]]);m.plans=p;
    showMsg('m10',on?'تم الحفظ ✓ الباقات ظاهرة في بطاقتك خلال دقائق':'تم الحفظ — أدخل رقم الحساب أو IBAN لتفعيل الباقات','good');
  }catch(e){showMsg('m10',e.message||'تعذّر الحفظ')}
}
async function loadSubs(){
  const m=S.cur;if(!m)return;let rows=[];
  try{const j=await gf('https://sheets.googleapis.com/v4/spreadsheets/'+m.sheetId+'/values/'+encodeURIComponent('Subs!A2:H500')+'?valueRenderOption=UNFORMATTED_VALUE');rows=j.values||[]}catch(e){rows=[]}
  m.subs=rows;const el=$('subs');if(!el||S.cur!==m)return;
  const nm=k=>(PT.filter(x=>x[0]===k)[0]||[k,k])[1],now=Date.now(),pend=[],act=[];
  rows.forEach((r,i)=>{if(!r||!r[0])return;if(r[2]==='pending')pend.push([i,r]);else if(r[2]==='active'&&Number(r[6])>now)act.push([i,r])});
  let h='';
  if(!pend.length)h+='<div class="small">لا طلبات بانتظارك.</div>';
  pend.forEach(([i,r])=>{h+='<div class="ord"><div><b dir="ltr">'+esc(r[0])+'</b> · '+esc(nm(r[1]))+'</div><div class="small">رقم المعاملة: <b dir="ltr">'+esc(r[3]||'')+'</b></div><div style="display:flex;gap:8px;margin-top:6px"><button class="btn sm" onclick="subDecide('+i+',1)">اعتماد</button><button class="btn sec sm" onclick="subDecide('+i+',0)">رفض</button></div></div>'});
  if(act.length){h+='<div class="small" style="margin-top:10px"><b>المشتركون الفعّالون ('+act.length+')</b></div>';act.forEach(([i,r])=>{h+='<div class="ord small"><span dir="ltr">'+esc(r[0])+'</span> · '+esc(nm(r[1]))+' · حتى '+esc(new Date(Number(r[6])).toISOString().slice(0,10))+' <button class="btn sec sm" style="margin-inline-start:6px" onclick="subDecide('+i+',2)">إلغاء</button></div>'})}
  el.innerHTML=h;
}
async function subDecide(i,mode){
  const m=S.cur,r=m&&m.subs&&m.subs[i];if(!r)return;const row=i+2;
  if(mode===1&&!confirm('اعتماد اشتراك '+r[0]+'؟ تأكد أولاً من وصول المبلغ إلى حسابك.'))return;
  if(mode===2&&!confirm('إلغاء اشتراك '+r[0]+'؟'))return;
  try{
    if(mode===1){const d=(PT.filter(x=>x[0]===r[1])[0]||[0,0,30])[2],now=Date.now();await putVals(m.sheetId,'Subs!C'+row+':G'+row,[['active',r[3]||'',r[4]||'',now,now+d*86400000]])}
    else await putVals(m.sheetId,'Subs!C'+row,[[mode===2?'revoked':'rejected']]);
    await loadSubs();
  }catch(e){const el=$('subs');if(el)el.insertAdjacentHTML('afterbegin','<div class="msg err" style="display:block">'+esc(e.message||'تعذّر الحفظ')+'</div>')}
}
async function pickMAcc(c){
  const m=S.cur;if(!m||!MKRX.test(c))return;mkMark(c);showMsg('m9','جاري الحفظ…','info');
  try{await putVals(m.sheetId,'Config!E1',[[c]]);m.acc=c;showMsg('m9','تم حفظ اللون ✓ يظهر في البطاقة خلال دقائق','good');checkHealth()}catch(e){showMsg('m9',e.message||'تعذّر الحفظ')}
}
 const STEPS=['الموافقة على الصلاحيات','إنشاء شيت المؤشر','إنشاء الخلفية في Apps Script','نشر الخلفية','حفظ الإعدادات'];
function stepsUI(n,state,msg,retry){
  let h='<h1>جاري إنشاء مؤشرك</h1><p class="sub">لا تُغلق الصفحة.</p><div class="card">';
  STEPS.forEach((s,i)=>{const c=i<n?'done':(i===n?(state||'run'):'');h+='<div class="step '+c+'"><span class="dot">'+(i<n?'✓':(i===n?(state==='fail'?'✕':'…'):'○'))+'</span>'+esc(s)+'</div>'});
  h+='</div>';if(msg)h+='<div class="msg err" style="display:block">'+esc(msg)+'</div>'+(retry?'<button class="btn" onclick="runCreate()">إعادة المحاولة</button>':'')+'<button class="btn sec" onclick="S.markets=[];S.listed=false;renderHome()">رجوع</button>';
  $('app').innerHTML=h;
}
function rid(){const a=new Uint8Array(6);crypto.getRandomValues(a);return 'm'+Array.from(a).map(x=>x.toString(16).padStart(2,'0')).join('')}
async function createMarket(){
  const name=($('mname').value||'').trim();
  if(name.length<2){showMsg('m1','اكتب اسماً من حرفين على الأقل');return}
  if(S.markets.length>=S.allowed){showMsg('m1','وصلت إلى الحد المسموح');return}
  S.pend={name:name,acc:S.newAcc||'',mid:rid()};runCreate();
}
function resumeMarket(i){const m=S.markets[i];if(!m)return;S.pend={name:m.name,sheetId:m.sheetId,mid:rid()};runCreate()}
async function runCreate(){
  const P=S.pend;if(!P)return renderHome();
  let n=0;
  try{
    stepsUI(0);await gAuth();n=1;stepsUI(1);
    if(!P.sheetId){const s=await gf('https://sheets.googleapis.com/v4/spreadsheets',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({properties:{title:PREFIX+P.name,timeZone:'Africa/Khartoum'},sheets:[{properties:{title:'Businesses'}},{properties:{title:'Totals'}},{properties:{title:'Snapshots'}},{properties:{title:'Config'}}]})});
    P.sheetId=s.spreadsheetId;
    await gf('https://sheets.googleapis.com/v4/spreadsheets/'+P.sheetId+'/values:batchUpdate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({valueInputOption:'RAW',data:[
      {range:'Businesses!A1',values:[['Name','SheetId','Added']]},{range:'Totals!A1',values:[['SheetId','Sum','Count','UpdatedAt','Readable']]},{range:'Snapshots!A1',values:[['Time','NAV']]}]})});}
    const sheetId=P.sheetId,name=P.name;
    n=2;stepsUI(2);
    const [c,m]=await Promise.all([fetch('market-index.gs.txt',{cache:'no-cache'}).then(r=>{if(!r.ok)throw new Error('تعذّر تحميل قالب المؤشر');return r.text()}),fetch('market-appsscript.json',{cache:'no-cache'}).then(r=>{if(!r.ok)throw new Error('تعذّر تحميل إعدادات المؤشر');return r.text()})]);
    const mid=P.mid||(P.mid=rid());let tr=null;
    if(S.trial){const rv=await api('mkt_trial_reserve',{mid:mid},true);if(rv.error)throw new Error(rv.error);if(!rv.entitled)tr=rv}
    const cfg={id:mid,name:name,owner:EMAIL,sheetId:sheetId,orderValue:4.275,max:120};
    if(tr){cfg.trialEnds=tr.trialEnds;cfg.unlockHash=tr.unlockHash}
    const json=JSON.stringify(cfg).split(String.fromCharCode(8232)).join('\\u2028').split(String.fromCharCode(8233)).join('\\u2029');
    if(!P.scriptId){const pr=await gf('https://script.googleapis.com/v1/projects',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({title:PREFIX+name})});P.scriptId=pr.scriptId}
    await gf('https://script.googleapis.com/v1/projects/'+P.scriptId+'/content',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({files:[{name:'Code',type:'SERVER_JS',source:c.split('__MARKET_JSON__').join(json)},{name:'appsscript',type:'JSON',source:m}]})});
    const v=await gf('https://script.googleapis.com/v1/projects/'+P.scriptId+'/versions',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({description:'market '+new Date().toISOString()})});
    n=3;stepsUI(3);
    const d=await gf('https://script.googleapis.com/v1/projects/'+P.scriptId+'/deployments',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({versionNumber:v.versionNumber,manifestFileName:'appsscript',description:'market'})});
    const ep=(d.entryPoints||[]).find(e=>e.entryPointType==='WEB_APP');
    const url=(ep&&ep.webApp&&ep.webApp.url)||('https://script.google.com/macros/s/'+d.deploymentId+'/exec');
    n=4;stepsUI(4);
    await putVals(sheetId,'Config!A1',[[JSON.stringify({name:name,scriptId:P.scriptId,deploymentId:d.deploymentId,url:url,created:new Date().toISOString(),mid:mid,trialEnds:tr?tr.trialEnds:0,unlockHash:tr?tr.unlockHash:''})]]);
    if(MKRX.test(P.acc||''))await putVals(sheetId,'Config!E1',[[P.acc]]);
    S.newAcc='';S.pend=null;S.markets=await listMarkets();S.listed=true;saveCount();
    const i=S.markets.findIndex(x=>x.sheetId===sheetId);openMarket(i<0?0:i);
  }catch(e){
    const msg=e.apiOff?'فعّل Apps Script API من إعدادات حسابك: script.google.com/home/usersettings ثم اضغط «إعادة المحاولة» (لن يُنشأ شيت جديد).':(e.message||'فشل غير متوقع');
    stepsUI(n,'fail',msg,true);
  }
}

const SHEETRX=/^[A-Za-z0-9_-]{20,80}$/;
async function openMarket(i){
  const m=S.markets[i];if(!m){renderHome();return}S.cur=m;
  $('app').innerHTML='<div class="card sub">جاري التحميل…</div>';
  try{
    const cv=await getVals(m.sheetId,'Config!A1:F1'),cr=cv[0]||[];try{m.plans=JSON.parse(cr[5]||'{}')||{}}catch(e){m.plans={}}m.home=/^https:\/\/[a-z0-9-]{1,39}\.github\.io\/[a-z0-9._-]{1,100}\/$/.test(cr[2]||'')?cr[2]:'';m.apkHosted=/^https:\/\/github\.com\/[A-Za-z0-9-]{1,39}\/[A-Za-z0-9._-]{1,100}\/raw\/main\/apk\/[A-Za-z0-9._-]{1,80}\.apk$/.test(cr[3]||'')?cr[3]:'';const cfg=JSON.parse(cr[0]||'null');m.acc=MKRX.test(cr[4]||'')?cr[4]:'';m.img=/^https:\/\/drive\.google\.com\/thumbnail\?id=[A-Za-z0-9_-]{10,80}&sz=w\d{3,4}$/.test(cr[1]||'')?cr[1]:'';
    if(!cfg){$('app').innerHTML='<div class="card"><div class="msg err" style="display:block">إعداد هذا المؤشر لم يكتمل.</div><button class="btn" style="margin-top:10px" onclick="resumeMarket('+i+')">إكمال الإعداد</button><button class="btn sec" onclick="renderHome()">رجوع</button></div>';return}
    m.cfg=cfg;m.biz=(await getVals(m.sheetId,'Businesses!A2:C121'));
    renderMarket();checkHealth();loadMApk();mktTrialUI();loadSubs();
  }catch(e){$('app').innerHTML='<div class="card"><div class="msg err">'+esc(e.message||'تعذّر التحميل')+'</div><button class="btn sec" onclick="renderHome()">رجوع</button></div>'}
}

    await gf('https://sheets.googleapis.com/v4/spreadsheets/'+m.sheetId+':batchUpdate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({requests:[{updateSpreadsheetProperties:{properties:{timeZone:'Africa/Khartoum'},fields:'timeZone'}}]})});

    const v=await gf('https://script.googleapis.com/v1/projects/'+sid+'/versions',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({description:'update '+new Date().toISOString()})});
    await gf('https://script.googleapis.com/v1/projects/'+sid+'/deployments/'+m.cfg.deploymentId,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({deploymentConfig:{versionNumber:v.versionNumber,manifestFileName:'appsscript',description:'market'}})});

let mapkPoll=null;
async function mktId(url){const b=new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(url)));return 'MKT-'+Array.from(b.slice(0,4)).map(x=>x.toString(16).padStart(2,'0')).join('').toUpperCase()}
async function loadMApk(){
  clearTimeout(mapkPoll);const m=S.cur,el=$('mapk');if(!m||!m.cfg||!el)return;
  try{m.apkId=m.apkId||await mktId(m.cfg.url)}catch(e){el.textContent='متصفحك لا يدعم هذه الميزة';return}
  const j=await api('appb_download',{appId:m.apkId});const e2=$('mapk');if(!e2||S.cur!==m)return;

function resizeImg(file,max,cb){
  const fr=new FileReader();fr.onerror=()=>cb(null);
  fr.onload=()=>{const im=new Image();im.onerror=()=>cb(null);im.onload=()=>{
    let w=im.width,h=im.height,sc=Math.min(1,max/Math.max(w,h));w=Math.round(w*sc);h=Math.round(h*sc);
    const c=document.createElement('canvas');let q=.85,out='';
    for(let t=0;t<8;t++){c.width=w;c.height=h;c.getContext('2d').drawImage(im,0,0,w,h);out=c.toDataURL('image/jpeg',q);if(out.length<=600000)break;q-=.1;if(q<.4){q=.7;w=Math.round(w*.8);h=Math.round(h*.8)}}
    cb(out)};im.src=fr.result};
  fr.readAsDataURL(file);
}

async function ghPost(path,body){const r=await fetch(WORKER_URL+path,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body||{})});return r.json()}
function showHtml(id,h,cls){const e=$(id);if(!e)return;e.className='msg '+(cls||'info');e.innerHTML=h}
async function ghAuth(){
  if(GHT)return GHT;
  const d=await ghPost('/gh/device');if(!d.device_code)throw new Error(d.error_description||d.error||'تعذّر بدء الربط بـ GitHub');
  showHtml('m7','افتح <a href="'+esc(d.verification_uri)+'?user_code='+esc(d.user_code)+'" target="_blank" rel="noopener" style="color:#fff;text-decoration:underline">github.com/login/device</a> وأدخل الرمز: <b dir="ltr" style="font-size:18px">'+esc(d.user_code)+'</b> — ثم ارجع هنا.','info');
  let wait=(d.interval||5)*1000;const end=Date.now()+(d.expires_in||900)*1000;
  while(Date.now()<end){
    await new Promise(r=>setTimeout(r,wait));
    const t=await ghPost('/gh/token',{device_code:d.device_code});
    if(t.access_token){GHT=t.access_token;try{sessionStorage.setItem('ghT',GHT)}catch(e){}return GHT}
    if(t.error==='slow_down')wait+=5000;
    else if(t.error&&t.error!=='authorization_pending')throw new Error(t.error_description||t.error);
  }
  throw new Error('انتهت مهلة الربط، حاول مرة أخرى');
}
async function ghApi(path,opt){
  opt=opt||{};opt.headers=Object.assign({Authorization:'Bearer '+GHT,Accept:'application/vnd.github+json'},opt.headers||{});
  const r=await fetch('https://api.github.com'+path,opt);let j={};try{j=await r.json()}catch(e){}
  if(r.status===401){GHT='';try{sessionStorage.removeItem('ghT')}catch(e){}}
  if(!r.ok&&r.status!==404)throw new Error(j.message||('GitHub '+r.status));
  return{status:r.status,json:j}
}

function b64buf(buf){const u=new Uint8Array(buf);let s='';for(let i=0;i<u.length;i+=0x8000)s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(s)}
async function ghPut(user,repo,path,b64,msg){

  const p=await ghApi('/repos/'+user+'/'+repo+'/contents/'+path,{method:'PUT',body:JSON.stringify(body)});

    const c=await callBack(m.cfg.url,{action:'config'});if(S.cur!==m||!$('mtrial'))return;

    if(S.ent){const j=await api('mkt_unlock',{},true);if(j&&j.code){const u=await callBack(m.cfg.url,{action:'unlock',code:j.code});if(u&&u.status==='paid'){el.innerHTML='<div class="msg good" style="display:block">✓ مؤشرك مفتوح بشكل دائم بعضويتك</div>';checkHealth();return}}}
    const left=Math.max(0,Number(c.trialEnds||m.cfg.trialEnds)-Date.now()),hh=Math.floor(left/3600000),mm=Math.floor(left%3600000/60000);
    const sub='<a class="btn sec sm" style="margin-top:8px;display:inline-block" href="index.html?home=1#p/movement">اشترك لفتحه بشكل دائم</a>';
    el.innerHTML=c.status==='locked'
      ?'<div class="card" style="border-color:#ff8aa0"><b>⛔ انتهت تجربة الـ24 ساعة</b><div class="small" style="line-height:1.9;margin-top:6px">المؤشر متوقف الآن. يُفتح بالاشتراك في الفرانشايز أو التايكون، وبعدها تعود إلى هذه الصفحة وتفتحه.</div>'+sub+'</div>'
      :'<div class="card" style="border-color:rgba(201,168,76,.5)"><b>🕐 مؤشر تجريبي — متبقٍ '+hh+' س '+mm+' د</b><div class="small" style="line-height:1.9;margin-top:6px">يعمل فعلياً الآن، ويتوقف تلقائياً بعد انتهاء المهلة ما لم تشترك.</div>'+sub+'</div>';
  }catch(e){}
}
async function checkHealth(){
  const m=S.cur,el=$('hcard');if(!el)return;
  try{
    const r=await callBack(m.cfg.url,{action:'health'});
    if(r&&r.status==='ok'){el.innerHTML='<h2>حالة المؤشر</h2><div class="small" style="color:#8ff0c8">✓ يعمل · بزنسات مقروءة '+r.readable+' من '+r.businesses+' · طلبات مقبولة '+r.orders+'</div><div class="small" style="margin-top:8px;line-height:1.9">إن ظهر بزنس غير مقروء فالسبب غالباً أن شيته لم يُشارك معك بعد.</div><button class="btn" id="rcBtn" style="margin-top:8px" onclick="recalcOrders()">إعادة حساب الطلبات</button><div id="m8" class="msg"></div><button class="btn sec sm" style="margin-top:8px" onclick="window.open(\''+esc(m.cfg.url)+'?action=setup\',\'_blank\')">تفعيل التحديث التلقائي (مرة واحدة)</button>';return}
    if(r&&r.status==='locked'){el.innerHTML='<h2>حالة المؤشر</h2><div class="small" style="color:#ffb3c0">⛔ متوقف — انتهت التجربة المؤقتة</div>';return}
    throw 0;
  }catch(e){
    el.innerHTML='<h2>تفعيل المؤشر</h2><div class="small" style="line-height:1.9">مرة واحدة فقط: اضغط الزر، ثم في صفحة جوجل اختر حسابك ← «متقدم» ← «الانتقال» ← «السماح». بعدها اضغط «تحديث».</div><button class="btn ok sm" style="margin-top:8px" onclick="window.open(\''+esc(m.cfg.url)+'?action=setup\',\'_blank\')">تفعيل</button> <button class="btn sec sm" onclick="checkHealth()">تحديث</button>';
  }
}
async function writeBiz(){
  const m=S.cur,rows=(m.biz||[]).filter(r=>r&&r[1]);
  await clearVals(m.sheetId,'Businesses!A2:C121');
  if(rows.length)await putVals(m.sheetId,'Businesses!A2',rows.map(r=>[r[0]||'',r[1],r[2]||'']));
  m.biz=rows;
}
async function addBiz(){
  const m=S.cur,name=($('bname').value||'').trim(),sid=($('bsid').value||'').trim();
  if(!name){showMsg('m2','اكتب اسم البزنس');return}
  if(!SHEETRX.test(sid)){showMsg('m2','رمز الشيت غير صحيح');return}
  if((m.biz||[]).some(r=>r&&r[1]===sid)){showMsg('m2','هذا الشيت مضاف مسبقاً');return}
  if((m.biz||[]).filter(r=>r&&r[1]).length>=120){showMsg('m2','وصل المؤشر إلى 120 بزنساً');return}
  showMsg('m2','جاري الإضافة…','info');
  try{(m.biz=m.biz||[]).push([name,sid,new Date().toISOString().slice(0,10)]);await writeBiz();renderMarket()}
  catch(e){m.biz.pop();showMsg('m2',e.message||'تعذّرت الإضافة')}
}
async function rmBiz(i){
  const m=S.cur;if(!confirm('حذف هذا البزنس من المؤشر؟'))return;
  m.biz.splice(i,1);try{await writeBiz();renderMarket()}catch(e){alert(e.message||'تعذّر الحذف')}
}


function doLogout(){
  try{['appb_token','appb_email','lavndr_token','lavndr_email','lavndr_role','lavndr_subs','lavndr_sub_intent','lavndr_gate_pending'].forEach(k=>{sessionStorage.removeItem(k);try{localStorage.removeItem(k)}catch(e){}})}catch(e){}
  try{var _e=String(EMAIL).toLowerCase();sessionStorage.removeItem('lvn_gt');localStorage.removeItem('lavndr_mktl_'+_e);localStorage.removeItem('lavndr_mkt_'+_e)}catch(e){}
  TOKEN='';EMAIL='';gTok='';
  try{if(window.google&&google.accounts&&google.accounts.id)google.accounts.id.disableAutoSelect()}catch(e){}
  showLogin('تم تسجيل الخروج')
}
function syncLo(){const e=document.getElementById('lo');if(e)e.style.display=TOKEN?'':'none'}
setInterval(syncLo,500);
boot();
