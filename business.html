<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LAVNDR120 — بورتال البزنس</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
:root {
  --void:       #04040A;
  --glass:      rgba(255,255,255,0.04);
  --glass-border: rgba(255,255,255,0.08);
  --gold:       #C9A84C;
  --gold-dim:   rgba(201,168,76,0.15);
  --emerald-solid: #10B981;
  --emerald-dim: rgba(16,185,129,0.15);
  --amber:      #F59E0B;
  --amber-dim:  rgba(245,158,11,0.15);
  --red:        #F43F5E;
  --text:       rgba(255,255,255,0.9);
  --text-dim:   rgba(255,255,255,0.4);
}
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
body {
  background: var(--void); color: var(--text);
  font-family: 'Inter', system-ui, sans-serif; min-height:100vh;
}
.wrap { max-width:640px; margin:0 auto; padding:0 16px 100px; }
.glass {
  background: var(--glass); border:1px solid var(--glass-border);
  border-radius:16px; backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px);
}
#loginOverlay {
  position:fixed; inset:0; background:var(--void); display:flex; flex-direction:column;
  align-items:center; justify-content:center; z-index:9999; text-align:center; padding:24px;
}
.logo { font-size:28px; font-weight:900; color:var(--gold); letter-spacing:2px; margin-bottom:4px; }
.tag { font-size:11px; color:#555; letter-spacing:3px; margin-bottom:36px; }
#loginMsg { color:#888; font-size:13px; margin-top:16px; max-width:300px; line-height:1.7; }
#gsiButtonWrap { margin-top:20px; display:none; }
header { padding:24px 0 16px; text-align:center; }
h1 { font-size:20px; font-weight:700; color:var(--gold); }
.subtitle { font-size:12px; color:var(--text-dim); margin-top:4px; }
.card { margin:16px 0; padding:18px; }
.biz-name { font-size:16px; font-weight:700; color:var(--gold); }
.biz-ticker { font-size:11px; color:var(--text-dim); letter-spacing:1px; margin-top:2px; }
.stat-row { display:flex; gap:10px; margin:14px 0; }
.stat-box { flex:1; background:rgba(255,255,255,0.03); border-radius:10px; padding:10px; text-align:center; }
.stat-val { font-size:18px; font-weight:700; }
.stat-lbl { font-size:10px; color:var(--text-dim); margin-top:2px; }
.toggle-row { display:flex; justify-content:space-between; align-items:center; padding:12px 0; border-top:1px solid var(--glass-border); margin-top:8px; }
.toggle-label { font-size:12px; color:var(--text-dim); line-height:1.6; max-width:70%; }
.switch { position:relative; width:44px; height:24px; flex-shrink:0; }
.switch input { opacity:0; width:0; height:0; }
.slider { position:absolute; cursor:pointer; inset:0; background:rgba(255,255,255,0.15); border-radius:24px; transition:.2s; }
.slider:before { content:""; position:absolute; height:18px; width:18px; right:3px; bottom:3px; background:white; border-radius:50%; transition:.2s; }
input:checked + .slider { background:var(--emerald-solid); }
input:checked + .slider:before { transform:translateX(-20px); }
.section-title { font-size:12px; color:var(--gold); margin:16px 0 8px; }
.ent-row { padding:12px; border-radius:10px; background:rgba(255,255,255,0.03); margin-bottom:8px; }
.ent-top { display:flex; justify-content:space-between; align-items:center; font-size:12px; }
.ent-amount { font-weight:700; }
.ent-meta { font-size:10px; color:var(--text-dim); margin-top:4px; }
.badge-status { font-size:10px; padding:3px 8px; border-radius:20px; }
.badge-available { background:var(--amber-dim); color:var(--amber); }
.badge-guarantee { background:var(--gold-dim); color:var(--gold); }
.badge-completed { background:var(--emerald-dim); color:var(--emerald-solid); }
.empty { text-align:center; color:var(--text-dim); font-size:13px; padding:24px 0; }
.toast {
  position:fixed; bottom:24px; left:50%; transform:translateX(-50%);
  background:#111; border:1px solid var(--glass-border); padding:10px 18px;
  border-radius:10px; font-size:13px; z-index:10000; opacity:0; transition:opacity .3s;
}
.toast.show { opacity:1; }
</style>
</head>
<body>

<div id="loginOverlay">
  <div class="logo">LAVNDR120</div>
  <div class="tag">بورتال البزنس</div>
  <div style="font-size:36px;margin-bottom:8px;">🏪</div>
  <div id="loginMsg">جاري التحقق من الجلسة...</div>
  <div id="gsiButtonWrap"></div>
</div>

<div class="wrap" id="mainWrap" style="display:none;">
  <header>
    <h1>بورتال البزنس</h1>
    <div class="subtitle" id="userEmailLabel"></div>
    <a href="dashboard.html" onclick="leaveToDashboard()" style="display:inline-block;margin-top:8px;color:var(--gold);font-size:12px;text-decoration:none;">← الداشبورد</a>
    <button onclick="if(confirm('تسجيل الخروج؟')) clearSessionAndReset('تم تسجيل الخروج')"
      style="margin-top:8px;background:none;border:none;color:var(--text-dim);font-size:11px;cursor:pointer;padding:4px 0;text-decoration:underline;">
      تسجيل خروج
    </button>
  </header>
  <a href="agreement.pdf" download="لاڤندرز-لإدارة-البزنسات.pdf" style="display:block;text-align:center;margin:0 0 14px;padding:12px;border:1px solid var(--glass-border);border-radius:12px;color:var(--gold);text-decoration:none;font-size:13px;font-weight:700;">📄 اتفاقية «لاڤندرز لإدارة البزنسات» — حمّلها PDF للتعبئة والتوقيع</a>
  <div id="content"><div class="empty">جاري التحميل...</div></div>
</div>

<div class="toast" id="toast"></div>

<script src="agreement-form.js"></script>
<script>
const WORKER_URL    = 'https://lavndr.omssolutionorders.workers.dev';
const GSI_CLIENT_ID = '776097955989-go2bsq8e7c1umei4vj984jtabve49m32.apps.googleusercontent.com';

let AUTH_TOKEN = sessionStorage.getItem('lavndr_token') || '';
let USER_EMAIL = sessionStorage.getItem('lavndr_email') || '';

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

function esc(str) {
  return String(str ?? '').replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
}

function clearSessionAndReset(message) {
  sessionStorage.removeItem('lavndr_token');
  sessionStorage.removeItem('lavndr_email');
  AUTH_TOKEN = ''; USER_EMAIL = '';
  document.getElementById('mainWrap').style.display = 'none';
  document.getElementById('loginOverlay').style.display = 'flex';
  showLoginUI(message || 'انتهت الجلسة — سجّل الدخول مرة أخرى');
}

function showLoginUI(message) {
  document.getElementById('loginMsg').textContent = message || 'سجّل دخولك بحساب Google اللي مسجّل بيه بزنسك';
  document.getElementById('gsiButtonWrap').style.display = 'block';
}

async function handleCredentialResponse(response) {
  document.getElementById('gsiButtonWrap').style.display = 'none';
  document.getElementById('loginMsg').textContent = 'جاري التحقق...';
  try {
    const res = await fetch(WORKER_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action: 'login', idToken: response.credential })
    });
    const data = await res.json();
    if (data.error || !data.token) {
      document.getElementById('loginMsg').textContent = 'فشل تسجيل الدخول — حاول مرة أخرى';
      document.getElementById('gsiButtonWrap').style.display = 'block';
      return;
    }
    AUTH_TOKEN = data.token; USER_EMAIL = data.email;
    sessionStorage.setItem('lavndr_token', AUTH_TOKEN);
    sessionStorage.setItem('lavndr_email', USER_EMAIL);
    boot();
  } catch(e) {
    document.getElementById('loginMsg').textContent = 'فشل الاتصال — حاول مرة أخرى';
    document.getElementById('gsiButtonWrap').style.display = 'block';
  }
}

// ── حفظ مكان المستخدم (الصفحة + النموذج المفتوح) واستعادته عند العودة
function saveProg(extra) {
  if (!AUTH_TOKEN) return;
  const st = Object.assign({ page: 'business', screen: 'Portal' }, extra || {});
  try { localStorage.setItem('lavndr_prog_' + USER_EMAIL.toLowerCase(), JSON.stringify(st)); } catch (e) {}
  try { fetch(WORKER_URL, { method: 'POST', keepalive: true, headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ action: 'save_progress', token: AUTH_TOKEN, state: st }) }).catch(() => {}); } catch (e) {}
}
function leaveToDashboard() {
  try { sessionStorage.setItem('lavndr_skip_restore', '1'); } catch (e) {}
  saveProg({ page: 'dashboard', screen: 'Market' });
}
async function restoreProgress(businesses) {
  try {
    const r = await fetch(WORKER_URL + '?action=my_progress&token=' + encodeURIComponent(AUTH_TOKEN));
    const j = await r.json(); const st = j && j.state;
    if (st && st.page === 'business' && st.form === 'agreement' && businesses.some(b => b.sheetId === st.sheet)) {
      const b = businesses.find(x => x.sheetId === st.sheet);
      AgreementForm.open({ sheetId: b.sheetId, name: b.name });
    }
  } catch (e) {}
}
if (window.AgreementForm) {
  const _open = AgreementForm.open, _close = AgreementForm.close;
  AgreementForm.open = function (o) { window.__agrSheet = o.sheetId; saveProg({ form: 'agreement', sheet: o.sheetId }); return _open.call(AgreementForm, o); };
  AgreementForm.close = function () { saveProg(); return _close.call(AgreementForm); };
}
document.addEventListener('visibilitychange', function () {
  if (document.visibilityState === 'hidden' && AUTH_TOKEN) { const o = document.getElementById('agrOverlay'); saveProg(o ? { form: 'agreement', sheet: (window.__agrSheet || '') } : {}); }
});

function boot() {
  document.getElementById('loginOverlay').style.display = 'none';
  document.getElementById('mainWrap').style.display = 'block';
  document.getElementById('userEmailLabel').textContent = USER_EMAIL;
  loadPortal();
}

function statusLabel(status) {
  if (status === 'available') return { text: 'متاح — بانتظار تواصل الأدمن', cls: 'badge-available' };
  if (status === 'accepted_awaiting_guarantee') return { text: 'بانتظار استلام شيك الضمان', cls: 'badge-guarantee' };
  if (status === 'completed') return { text: '✓ مكتمل', cls: 'badge-completed' };
  return { text: status, cls: 'badge-available' };
}

async function loadPortal() {
  const el = document.getElementById('content');
  try {
    const res = await fetch(WORKER_URL + '?action=my_business_portal&token=' + encodeURIComponent(AUTH_TOKEN));
    const data = await res.json();
    if (data.code === 401) { clearSessionAndReset(); return; }
    if (data.error) { el.innerHTML = '<div class="empty">' + esc(data.error) + '</div>'; return; }

    if (!data.linked) {
      // حساب غير مربوط ببزنس: نوجّهه لمكانه المسموح (الداشبورد) مع توضيح
      try { sessionStorage.setItem('lavndr_flash', 'حسابك غير مربوط ببزنس بعد — تواصل مع الإدارة لربطه'); } catch (e) {}
      setTimeout(() => location.replace('dashboard.html'), 2500);
      el.innerHTML = `
        <div class="glass card" style="text-align:center;">
          <div style="font-size:32px;margin-bottom:10px;">🔗</div>
          <div style="font-size:14px;color:#ccc;margin-bottom:10px;">حسابك لسه مش مربوط بأي بزنس</div>
          <div style="font-size:12px;color:var(--text-dim);line-height:1.7;">
            تواصل مع الأدمن وأعطه إيميلك (<b style="color:var(--text);direction:ltr;display:inline-block;">${esc(USER_EMAIL)}</b>)
            عشان يربطه بالبزنس بتاعك من لوحة التحكم.
          </div>
        </div>`;
      return;
    }

    el.innerHTML = data.businesses.map(renderBusinessCard).join('');
    if (!window.__restored) { window.__restored = true; restoreProgress(data.businesses); }
  } catch(e) {
    el.innerHTML = '<div class="empty">فشل الاتصال — حاول تاني</div>';
  }
}

function renderStanding(b) {
  const st = b.standing;
  if (!st) return '';
  const AT = { 1: 100, 2: 500, 3: 1000 };
  let mv = '<span style="color:var(--text-dim);">●</span>';
  if (st.isNew) mv = '<span style="color:var(--gold);">جديد</span>';
  else if (st.delta > 0) mv = '<span style="color:#10B981;">▲ ' + st.delta + '</span>';
  else if (st.delta < 0) mv = '<span style="color:var(--red);">▼ ' + Math.abs(st.delta) + '</span>';
  const lines = [1, 2, 3].filter(n => n <= st.stage).map(n => {
    const inTop = (st.stages || []).indexOf(n) !== -1;
    return '<div class="ent-meta" style="color:' + (inTop ? '#10B981' : 'var(--text-dim)') + ';">' + (inTop ? '✅ ضمن أبرز ' + st.cohortSize + ' عند ' + AT[n] + ' طلب — أنت مستحق في هذه المرحلة' : '— لم تكن ضمن أبرز ' + st.cohortSize + ' عند ' + AT[n] + ' طلب') + '</div>';
  }).join('');
  const next = st.stage < 3 ? '<div class="ent-meta">المرحلة القادمة تُفتح حين يصل أبطأ بزنس إلى ' + AT[st.stage + 1] + ' طلب، ويُعاد الترتيب وقتها.</div>' : '';
  return `
      <div class="section-title">موقعك في التراتب</div>
      <div class="ent-row">
        <div class="ent-top"><span class="ent-amount">#${st.rank} <span style="font-size:12px;opacity:.6;">من ${st.of}</span></span><span>${mv}</span></div>
        ${lines || '<div class="ent-meta">لم تُفتح المرحلة الأولى بعد (100 طلب لأبطأ بزنس).</div>'}
        ${next}
        <div class="ent-meta" style="opacity:.7;">التثبيت تمييز «مستحق» فقط؛ الصرف الفعلي يتم عبر الاستحقاقات أدناه وبعد تسليم الضمان.</div>
      </div>`;
}

function renderStageVal(b) {
  const sv = b.stageValuations || [];
  const AT = { 1: 100, 2: 500, 3: 1000 };
  const m = n => '$' + (parseFloat(n) || 0).toLocaleString('en-US', { maximumFractionDigits: 2 });
  if (!sv.length) return '';
  const rows = sv.slice().sort((x, y) => x.stage - y.stage).map(v => {
    const parts = [];
    parts.push('<div class="ent-meta">نقاطك الموزونة: <b>' + (v.points || 0).toLocaleString('en-US') + '</b> نقطة</div>');
    if (v.inCohort) {
      parts.push('<div class="ent-meta" style="color:#10B981;">✅ ضمن أبرز 40 — مستحق شهادتك الذهبية: <b>' + m(v.allocation) + '</b></div>');
      parts.push('<div class="ent-meta">قيمة شهادتك الذهبية المتوقعة: <b>' + m(v.expectedReturn) + '</b></div>');
    } else if (v.stage < 3) {
      parts.push('<div class="ent-meta">لم تكن ضمن أبرز 40 في هذه المرحلة.</div>');
    }
    if (v.stage === 3) parts.push('<div class="ent-meta" style="color:var(--gold);">قيمة شهادتك الذهبية النهائية من الصندوق (' + m(v.fundValue) + '): <b>' + m(v.valuation) + '</b></div>');
    return '<div class="ent-row"><div class="ent-top"><span class="ent-amount">مرحلة ' + AT[v.stage] + ' طلب</span></div>' + parts.join('') + '</div>';
  }).join('');
  return '<div class="section-title">تقييمك وشهادتك الذهبية</div>' + rows +
    '<div class="ent-meta" style="opacity:.7;margin-bottom:10px;">تقييم محسوب وليس تحويلاً؛ الصرف الفعلي يتم عبر الاستحقاقات أدناه وبعد تسليم الضمان وتوثيق الداتا.</div>';
}

function renderBusinessCard(b) {
  const entitlementsHtml = (b.entitlements && b.entitlements.length)
    ? b.entitlements.map(e => {
        const s = statusLabel(e.status);
        const extra = e.status === 'accepted_awaiting_guarantee'
          ? `<div class="ent-meta">ضمان مطلوب: $${e.guaranteeAmount} (36% × ${e.orders} طلب × $4.275)</div>`
          : '';
        return `
          <div class="ent-row">
            <div class="ent-top">
              <span class="ent-amount">$${e.entitlement}</span>
              <span class="badge-status ${s.cls}">${s.text}</span>
            </div>
            <div class="ent-meta">${esc(e.date)} · طلبات وقتها: ${e.orders}</div>
            ${extra}
          </div>`;
      }).join('')
    : '<div class="empty" style="padding:12px 0;">مفيش استحقاقات مسجّلة بعد</div>';

  return `
    <div class="glass card">
      <div class="biz-name">${esc(b.name) || '(بدون اسم)'}</div>
      <div class="biz-ticker">${b.ticker ? esc(b.ticker) : 'SheetID: ' + esc(b.sheetId)} ${b.closed ? '<span style="color:var(--red);">· الحساب مقفول</span>' : ''}</div>

      <div class="stat-row">
        <div class="stat-box">
          <div class="stat-val" style="color:var(--gold);">${b.orders}</div>
          <div class="stat-lbl">إجمالي الطلبات</div>
        </div>
        <div class="stat-box">
          <div class="stat-val">${parseFloat(b.weight).toFixed(2)}%</div>
          <div class="stat-lbl">الوزن بالمؤشر</div>
        </div>
      </div>

      ${renderStanding(b)}
      ${renderStageVal(b)}

      <div class="toggle-row">
        <div class="toggle-label">
          القبول التلقائي للاستحقاقات
          <div style="opacity:0.6;margin-top:2px;">لو مفعّل، أي استحقاق جديد ينتقل تلقائياً لمرحلة "بانتظار شيك الضمان" بدون انتظار تواصل الأدمن</div>
        </div>
        <label class="switch">
          <input type="checkbox" ${b.autoAccept ? 'checked' : ''} onchange="toggleAutoAccept('${esc(b.sheetId)}', this.checked, this)">
          <span class="slider"></span>
        </label>
      </div>

      ${renderRequests(b)}

      <div class="section-title">الاستحقاقات</div>
      ${entitlementsHtml}
    </div>`;
}

const REQ_AR = { submitted: '⏳ قيد المراجعة', received: '✅ تم استلام الاتفاقية', rejected: '❌ غير مقبول', pending: '⏳ بانتظار قرار الإدارة', approved: '✅ مقبول' };
function renderRequests(b) {
  const r = b.requests || {};
  const ag = r.agreement;
  const agHtml = ag
    ? `<div class="ent-meta">الاتفاقية الموقعة: <b>${esc(REQ_AR[ag.status] || ag.status)}</b></div>`
    : '<div class="ent-meta">لم ترفع الاتفاقية الموقعة بعد.</div>';
  const canAg = !ag || ag.status !== 'received';
  const cashHtml = (r.cash || []).map(c => `
    <div class="ent-row"><div class="ent-top"><span class="ent-amount">${c.approvedAmount ? '$' + esc(c.approvedAmount) : 'طلب شهادة ذهبية'}</span>
    <span class="badge-status badge-available">${esc(REQ_AR[c.status] || c.status)}</span></div>
    <div class="ent-meta">${esc(c.requestedAt)} · سداد 36% المطلوب: $${esc(c.due36)}${c.status === 'approved' && !c.approvedAmount ? ' · تظهر قيمة الشهادة بعد استلام اتفاقيتك الموقعة' : ''}</div></div>`).join('');
  const m = r.m || {};
  return `
    <div class="section-title">الاتفاقية والشهادة الذهبية</div>
    <div class="ent-meta" style="line-height:1.8;">بياناتك تُقيَّم بنقاط المؤشر وتتحرك مع إجمالي الطلبات. الطلب الواحد يُقيَّم بـ 4.275$، ويُسيَّل منه 36% من جملة طلباتك نقداً، والباقي بيانات رقمية هي مهر التقييم. حين تطلب إصدار شهادتك الذهبية تُوجَّه قيمتك المحسوبة بوزنك وأدائك في المراحل (100 / 500 / 1000) إلى سبيكة ذهب تُسبك باسم بزنسك وعلامتك، وذلك بعد اكتمال الأطواق الثلاثة: المالي والضماني والمستندي.</div>
    ${agHtml}
    <button onclick="AgreementForm.open({sheetId:'${esc(b.sheetId)}', name:'${esc(b.name)}'})" style="margin:8px 0;padding:10px 14px;border-radius:10px;border:1px solid var(--gold);background:rgba(201,168,76,.12);color:var(--gold);cursor:pointer;font-weight:700;">📝 ${ag && ag.status === 'received' ? 'عرض الاتفاقية' : 'تعبئة وتوقيع الاتفاقية هنا'}</button>
    ${canAg ? `<div class="ent-meta" style="margin-top:6px;">أو ارفع رابط نسخة PDF موقّعة:</div><div style="margin:8px 0;"><input id="agLink-${esc(b.sheetId)}" placeholder="رابط الاتفاقية الموقعة (Drive)" style="width:100%;padding:10px;border-radius:10px;border:1px solid var(--glass-border);background:transparent;color:var(--text);direction:ltr;">
      <button onclick="submitAgreement('${esc(b.sheetId)}')" style="margin-top:6px;padding:8px 14px;border-radius:10px;border:1px solid var(--gold);background:none;color:var(--gold);cursor:pointer;">رفع الرابط</button></div>` : ''}
    <div class="ent-meta" style="margin-top:8px;">سداد 36% الحالي: <b>$${esc(m.due36 ?? 0)}</b> لعدد ${esc(m.orders ?? 0)} طلب</div>
    <button onclick="requestCash('${esc(b.sheetId)}')" style="margin:8px 0;padding:8px 14px;border-radius:10px;border:1px solid var(--gold);background:none;color:var(--gold);cursor:pointer;">🏅 إصدار الشهادة الذهبية</button>
    ${cashHtml}`;
}
async function bizPost(body) {
  const res = await fetch(WORKER_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ ...body, token: AUTH_TOKEN }) });
  return res.json();
}
async function submitAgreement(sheetId) {
  const link = document.getElementById('agLink-' + sheetId).value.trim();
  const d = await bizPost({ action: 'submit_agreement', sheetId, link });
  if (d.error) { showToast(d.error); return; }
  showToast('تم رفع الرابط — بانتظار مراجعة الإدارة'); loadPortal();
}
async function requestCash(sheetId) {
  if (!confirm('تأكيد طلب إصدار الشهادة الذهبية؟ سيُرسل للإدارة للنظر فيه.')) return;
  const d = await bizPost({ action: 'request_cash', sheetId });
  if (d.error) { showToast(d.error); return; }
  showToast('تم إرسال طلب الشهادة الذهبية'); loadPortal();
}

async function toggleAutoAccept(sheetId, enabled, checkbox) {
  checkbox.disabled = true;
  try {
    const res = await fetch(WORKER_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action: 'set_my_auto_accept', sheetId, enabled, token: AUTH_TOKEN })
    });
    const data = await res.json();
    if (data.code === 401 || data.code === 403) { clearSessionAndReset(data.error); return; }
    if (data.error) { showToast('خطأ: ' + data.error); checkbox.checked = !enabled; }
    else showToast(enabled ? 'بقى تلقائي ✓' : 'بقى يدوي');
  } catch(e) {
    showToast('فشل الاتصال'); checkbox.checked = !enabled;
  } finally {
    checkbox.disabled = false;
  }
}

window.addEventListener('load', function() {
  if (typeof google !== 'undefined' && google.accounts) {
    google.accounts.id.initialize({ client_id: GSI_CLIENT_ID, callback: handleCredentialResponse });
    google.accounts.id.renderButton(
      document.getElementById('gsiButtonWrap'),
      { theme: 'filled_black', size: 'large', shape: 'pill', text: 'signin_with', locale: 'ar' }
    );
  }
  if (AUTH_TOKEN && USER_EMAIL) { boot(); } else { showLoginUI(); }
});
</script>
