name: Lavenders AIO agent
on:
  schedule:
    - cron: '0 7 * * 1'
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: aio-agent
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run agent
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          DEVTO_API_KEY: ${{ secrets.DEVTO_API_KEY }}
        run: python aio-agent.py
      - name: Commit
        run: |
          git config user.name "lavenders-aio-agent"
          git config user.email "aio-agent@users.noreply.github.com"
          git add -A insights aio-state.json sitemap.xml
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "AIO agent: new insight"
          git pull --rebase
          git push
