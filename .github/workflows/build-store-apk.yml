name: build-store-apk
# يبني APK (غلاف WebView) لمتجر بزنس واحد، وينشره كـ Release، ثم يبلغ الخلفية بالنتيجة.
# يُشغَّل من Apps Script عبر appb_build_apk. الأسرار المطلوبة: APPB_CB_SECRET.
on:
  workflow_dispatch:
    inputs:
      app_id:
        description: 'APP-XXXXXXXX'
        required: true
      app_name:
        description: 'اسم البزنس'
        required: true
      backend_url:
        description: 'رابط خلفية المتجر (script.google.com/macros/s/.../exec)'
        required: true
permissions:
  contents: write
concurrency:
  group: apk-${{ inputs.app_id }}
  cancel-in-progress: false
env:
  WORKER_URL: https://lavndr.omssolutionorders.workers.dev
  STORE_BASE: https://lavndrs120.github.io/store.html?b=
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_ID: ${{ inputs.app_id }}
      APP_NAME: ${{ inputs.app_name }}
      BACKEND_URL: ${{ inputs.backend_url }}
      APK_URL: ''
    steps:
      - name: التحقق من المعرّف
        run: |
          if ! echo "$APP_ID" | grep -Eq '^APP-[0-9A-F]{8}$'; then echo "bad app id"; exit 1; fi
          if ! echo "$BACKEND_URL" | grep -Eq '^https://script\.google\.com/macros/s/[A-Za-z0-9_-]{10,200}/exec$'; then echo "bad backend url"; exit 1; fi

      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            icon-324.png
          sparse-checkout-cone-mode: false

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: حزم أندرويد
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" >/dev/null
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"

      - name: توليد المشروع
        run: |
          python3 - <<'PY'
          import os, re, shutil, urllib.parse
          from xml.sax.saxutils import escape
          app_id = os.environ['APP_ID']
          name = re.sub(r'[\x00-\x1f<>&"\']', ' ', os.environ.get('APP_NAME', '')).strip()[:30] or 'المتجر'
          pkg = 'com.lavndr.store.a' + app_id.split('-')[1].lower()
          url = os.environ['STORE_BASE'] + urllib.parse.quote(os.environ['BACKEND_URL'], safe='')
          root = os.path.join(os.environ['RUNNER_TEMP'], 'proj')
          def w(path, txt):
              p = os.path.join(root, path); os.makedirs(os.path.dirname(p), exist_ok=True)
              open(p, 'w', encoding='utf-8').write(txt)
          w('settings.gradle', "pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }\ndependencyResolutionManagement { repositories { google(); mavenCentral() } }\nrootProject.name = 'store'\ninclude ':app'\n")
          w('build.gradle', "plugins { id 'com.android.application' version '8.5.2' apply false }\n")
          w('gradle.properties', "org.gradle.jvmargs=-Xmx2g\nandroid.useAndroidX=true\n")
          w('app/build.gradle', """plugins { id 'com.android.application' }
          android {
              namespace '%s'
              compileSdk 34
              defaultConfig { applicationId '%s'; minSdk 24; targetSdk 34; versionCode 1; versionName '1.0' }
              buildTypes { release { minifyEnabled false } }
              compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
          }
          """ % (pkg, pkg))
          w('app/src/main/AndroidManifest.xml', """<?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <application android:label="@string/app_name" android:icon="@mipmap/ic_launcher" android:usesCleartextTraffic="false"
                  android:supportsRtl="true" android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true" android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter>
                  </activity>
              </application>
          </manifest>
          """)
          w('app/src/main/res/values/strings.xml', '<?xml version="1.0" encoding="utf-8"?>\n<resources><string name="app_name">%s</string></resources>\n' % escape(name))
          os.makedirs(os.path.join(root, 'app/src/main/res/mipmap-xxxhdpi'), exist_ok=True)
          shutil.copy('icon-324.png', os.path.join(root, 'app/src/main/res/mipmap-xxxhdpi/ic_launcher.png'))
          w('app/src/main/java/' + pkg.replace('.', '/') + '/MainActivity.java', """package %s;
          import android.app.Activity;
          import android.content.Intent;
          import android.graphics.Color;
          import android.net.Uri;
          import android.os.Bundle;
          import android.webkit.WebResourceError;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          public class MainActivity extends Activity {
              private WebView web;
              private static final String HOME = "%s";
              private static final String HOST = "lavndrs120.github.io";
              @Override protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  getWindow().setStatusBarColor(Color.parseColor("#0a0a10"));
                  web = new WebView(this);
                  setContentView(web);
                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setAllowFileAccess(false);
                  s.setAllowContentAccess(false);
                  web.setBackgroundColor(Color.parseColor("#0a0a10"));
                  web.setWebViewClient(new WebViewClient() {
                      @Override public boolean shouldOverrideUrlLoading(WebView v, WebResourceRequest r) {
                          Uri u = r.getUrl();
                          if ("https".equals(u.getScheme()) && HOST.equals(u.getHost())) return false;
                          try { startActivity(new Intent(Intent.ACTION_VIEW, u)); } catch (Exception e) {}
                          return true;
                      }
                      @Override public void onReceivedError(WebView v, WebResourceRequest r, WebResourceError e) {
                          if (r.isForMainFrame()) v.loadData("<html dir='rtl'><body style='background:#0a0a10;color:#fff;font-family:sans-serif;text-align:center;padding-top:30vh'><h3>لا يوجد اتصال بالإنترنت</h3><p>تحقق من الاتصال ثم أعد فتح التطبيق</p></body></html>", "text/html; charset=utf-8", null);
                      }
                  });
                  if (b == null) web.loadUrl(HOME); else web.restoreState(b);
              }
              @Override protected void onSaveInstanceState(Bundle o) { super.onSaveInstanceState(o); web.saveState(o); }
              @Override public void onBackPressed() { if (web.canGoBack()) web.goBack(); else super.onBackPressed(); }
          }
          """ % (pkg, url))
          PY

      - name: بناء الـAPK
        working-directory: ${{ runner.temp }}/proj
        run: gradle --no-daemon assembleDebug

      - name: نشر الـAPK
        id: pub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="apk-$APP_ID"
          FILE="store-$APP_ID.apk"
          cp "$RUNNER_TEMP/proj/app/build/outputs/apk/debug/app-debug.apk" "$FILE"
          gh release delete "$TAG" --yes --cleanup-tag >/dev/null 2>&1 || true
          gh release create "$TAG" "$FILE" --title "$TAG" --notes "APK for $APP_ID" --latest=false
          echo "url=https://github.com/${{ github.repository }}/releases/download/$TAG/$FILE" >> "$GITHUB_OUTPUT"

      - name: إبلاغ الخلفية
        if: always()
        env:
          CB_SECRET: ${{ secrets.APPB_CB_SECRET }}
          PUB_URL: ${{ steps.pub.outputs.url }}
          JOB_STATUS: ${{ job.status }}
        run: |
          export STATUS=failed; [ "$JOB_STATUS" = "success" ] && STATUS=ok
          python3 - <<'PY' > body.json
          import json, os
          print(json.dumps({"action": "appb_apk_done", "appId": os.environ["APP_ID"], "secret": os.environ["CB_SECRET"],
                            "status": os.environ["STATUS"], "url": os.environ.get("PUB_URL", "")}))
          PY
          curl -fsS --retry 3 --retry-delay 5 -X POST -H 'Content-Type: text/plain;charset=utf-8' --data @body.json "$WORKER_URL?action=appb_apk_done"
