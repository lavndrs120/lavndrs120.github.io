name: build-market-apk
# يبني APK (غلاف WebView) لبطاقة مؤشر سوق (تايكون/فرانشايز)، وينشره كـ Release، ثم يبلغ الخلفية.
# يُشغَّل من Apps Script عبر appb_build_apk بمعرّف MKT-XXXXXXXX. الأسرار المطلوبة: APPB_CB_SECRET.
on:
  workflow_dispatch:
    inputs:
      app_id:
        description: 'MKT-XXXXXXXX'
        required: true
      app_name:
        description: 'اسم المؤشر'
        required: true
      backend_url:
        description: 'رابط خلفية المؤشر (script.google.com/macros/s/.../exec)'
        required: true
      home_url:
        description: 'رابط بطاقة المؤشر في حساب المستخدم (اختياري)'
        required: false
        default: ''
permissions:
  contents: write
concurrency:
  group: apk-${{ inputs.app_id }}
  cancel-in-progress: false
env:
  WORKER_URL: https://lavndr.omssolutionorders.workers.dev
  STORE_BASE: https://lavndrs120.github.io/market.html?b=
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_ID: ${{ inputs.app_id }}
      APP_NAME: ${{ inputs.app_name }}
      BACKEND_URL: ${{ inputs.backend_url }}
      HOME_URL: ${{ inputs.home_url }}
      APK_URL: ''
    steps:
      - name: التحقق من المعرّف
        run: |
          if ! echo "$APP_ID" | grep -Eq '^MKT-[0-9A-F]{8}$'; then echo "bad app id"; exit 1; fi
          if [ -n "$HOME_URL" ] && ! echo "$HOME_URL" | grep -Eq '^https://[a-z0-9-]{1,39}\.github\.io/[a-z0-9._-]{1,100}/$'; then echo "bad home url"; exit 1; fi
          if ! echo "$BACKEND_URL" | grep -Eq '^https://script\.google\.com/macros/s/[A-Za-z0-9_-]{10,200}/exec$'; then echo "bad backend url"; exit 1; fi

      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            icon-324.png
          sparse-checkout-cone-mode: false

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: حزم أندرويد
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" >/dev/null
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"

      - name: مفتاح التوقيع
        env:
          KS_B64: ${{ secrets.APK_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.APK_KEYSTORE_PASS }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.ks"
            ALIAS=$(keytool -list -keystore "$RUNNER_TEMP/release.ks" -storepass "$KS_PASS" 2>/dev/null | grep -E 'PrivateKeyEntry|, [0-9]' | head -1 | cut -d, -f1)
            if [ -z "$ALIAS" ]; then echo "keystore unreadable (check APK_KEYSTORE_B64 / APK_KEYSTORE_PASS): debug signing"; else
              echo "KS_FILE=$RUNNER_TEMP/release.ks" >> "$GITHUB_ENV"; echo "KS_ALIAS=$ALIAS" >> "$GITHUB_ENV"; echo "release signing on (alias: $ALIAS)"; fi
          else echo "no keystore: debug signing"; fi

      - name: Pillow
        run: python3 -c "import PIL" 2>/dev/null || pip install --quiet pillow

      - name: توليد المشروع
        env:
          KS_PASS: ${{ secrets.APK_KEYSTORE_PASS }}
          FB_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
        run: |
          python3 - <<'PY'
          import os, re, shutil, urllib.parse
          from xml.sax.saxutils import escape
          app_id = os.environ['APP_ID']
          name = re.sub(r'[\x00-\x1f<>&"\']', ' ', os.environ.get('APP_NAME', '')).strip()[:30] or 'مؤشري'
          pkg = 'com.lavndr.market.m' + app_id.split('-')[1].lower()
          import time
          vc = int(time.time() // 60)
          open(os.path.join(os.environ['RUNNER_TEMP'], 'vc.txt'), 'w').write(str(vc))
          home = os.environ.get('HOME_URL', '').strip()
          if home:
              url = home + '?app=1&sch=' + pkg + '&v=' + str(vc)
          else:
              url = os.environ['STORE_BASE'] + urllib.parse.quote(os.environ['BACKEND_URL'], safe='') + '&app=1&sch=' + pkg + '&v=' + str(vc)
          host = urllib.parse.urlparse(url).hostname or 'lavndrs120.github.io'
          root = os.path.join(os.environ['RUNNER_TEMP'], 'proj')
          FB_KEY = os.environ.get('FB_API_KEY', '').strip()
          if not re.fullmatch(r'AIza[0-9A-Za-z_-]{30,60}', FB_KEY): raise SystemExit('FIREBASE_API_KEY secret missing or invalid')
          def w(path, txt):
              p = os.path.join(root, path); os.makedirs(os.path.dirname(p), exist_ok=True)
              open(p, 'w', encoding='utf-8').write(txt.replace('__FB_KEY__', FB_KEY))
          w('settings.gradle', "pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }\ndependencyResolutionManagement { repositories { google(); mavenCentral() } }\nrootProject.name = 'store'\ninclude ':app'\n")
          w('build.gradle', "plugins { id 'com.android.application' version '8.5.2' apply false }\n")
          w('gradle.properties', "org.gradle.jvmargs=-Xmx2g\nandroid.useAndroidX=true\nandroid.suppressUnsupportedCompileSdk=35\n")
          ks = os.environ.get('KS_FILE', '')
          if ks and os.path.exists(ks):
              sign_block = "signingConfigs { release { storeFile file('%s'); storePassword System.getenv('KS_PASS'); keyAlias '%s'; keyPassword (System.getenv('KEY_PASS') ?: System.getenv('KS_PASS')) } }" % (ks, os.environ.get('KS_ALIAS', 'upload'))
              sign_ref = "; signingConfig signingConfigs.release"
          else:
              sign_block = ""; sign_ref = ""
          w('app/build.gradle', """plugins { id 'com.android.application' }
          android {
              namespace '%s'
              compileSdk Integer.parseInt((project.findProperty('tsdk') ?: '34').toString())
              defaultConfig { applicationId '%s'; minSdk 24; targetSdk Integer.parseInt((project.findProperty('tsdk') ?: '34').toString()); versionCode %d; versionName '1.0' }
              %s
              buildTypes { release { minifyEnabled false%s } }
              compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
          }
          dependencies { implementation 'com.google.firebase:firebase-messaging:24.1.2'; implementation 'androidx.browser:browser:1.8.0' }
          """ % (pkg, pkg, vc, sign_block, sign_ref))
          w('app/src/main/AndroidManifest.xml', """<?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
              <application android:name=".App" android:label="@string/app_name" android:icon="@mipmap/ic_launcher" android:usesCleartextTraffic="false"
                  android:supportsRtl="true" android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true" android:launchMode="singleTask" android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter>
                      <intent-filter><action android:name="android.intent.action.VIEW"/><category android:name="android.intent.category.DEFAULT"/><category android:name="android.intent.category.BROWSABLE"/><data android:scheme="__PKG__"/></intent-filter>
                  </activity>
                  <service android:name=".PushService" android:exported="false"><intent-filter><action android:name="com.google.firebase.MESSAGING_EVENT"/></intent-filter></service>
              </application>
          </manifest>
          """.replace('__PKG__', pkg))
          w('app/src/main/res/values/strings.xml', '<?xml version="1.0" encoding="utf-8"?>\n<resources><string name="app_name">%s</string></resources>\n' % escape(name))
          os.makedirs(os.path.join(root, 'app/src/main/res/mipmap-xxxhdpi'), exist_ok=True)
          icon_dst = os.path.join(root, 'app/src/main/res/mipmap-xxxhdpi/ic_launcher.png')
          shutil.copy('icon-324.png', icon_dst)
          # أيقونة تطبيق المؤشر ثابتة: أيقونة لاڤندرز120
          w('app/src/main/java/' + pkg.replace('.', '/') + '/App.java', r'''
          package __PKG__;
          import android.app.Application;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.content.Context;
          import android.os.Build;
          import com.google.firebase.FirebaseApp;
          import com.google.firebase.FirebaseOptions;
          public class App extends Application {
              static final String CH = "mkt_alerts_v1";
              @Override public void onCreate() {
                  super.onCreate();
                  initFirebase(this);
                  if (Build.VERSION.SDK_INT >= 26) {
                      try {
                          NotificationManager nm = (NotificationManager) getSystemService(Context.NOTIFICATION_SERVICE);
                          NotificationChannel c = new NotificationChannel(CH, "إشعارات المؤشر", NotificationManager.IMPORTANCE_HIGH);
                          c.enableVibration(true);
                          nm.createNotificationChannel(c);
                      } catch (Exception e) {}
                  }
              }
              static boolean initFirebase(Context ctx) {
                  try {
                      if (!FirebaseApp.getApps(ctx).isEmpty()) return true;
                      FirebaseOptions o = new FirebaseOptions.Builder()
                          .setApplicationId("1:69681499733:android:e3dd242400fa10697e0edc").setApiKey("__FB_KEY__")
                          .setProjectId("lavndr120-35bfd").setGcmSenderId("69681499733").build();
                      FirebaseApp.initializeApp(ctx, o);
                      return true;
                  } catch (Exception e) { return false; }
              }
          }
          '''.replace('__PKG__', pkg))
          w('app/src/main/java/' + pkg.replace('.', '/') + '/PushService.java', r'''
          package __PKG__;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.content.Context;
          import android.content.Intent;
          import androidx.core.app.NotificationCompat;
          import com.google.firebase.messaging.FirebaseMessagingService;
          import com.google.firebase.messaging.RemoteMessage;
          public class PushService extends FirebaseMessagingService {
              @Override public void onNewToken(String token) {
                  getSharedPreferences("mkt_push", Context.MODE_PRIVATE).edit().putString("fcm", token).apply();
              }
              @Override public void onMessageReceived(RemoteMessage msg) {
                  java.util.Map<String, String> d = msg.getData();
                  String title = d.get("title"); String body = d.get("body");
                  if (title == null) title = getString(R.string.app_name);
                  if (body == null) body = "";
                  if (body.isEmpty()) return;
                  Intent open = new Intent(this, MainActivity.class);
                  open.setFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_CLEAR_TOP);
                  PendingIntent pi = PendingIntent.getActivity(this, 0, open, PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);
                  NotificationCompat.Builder b = new NotificationCompat.Builder(this, App.CH)
                      .setSmallIcon(R.mipmap.ic_launcher)
                      .setColor(0xFFC9A84C)
                      .setContentTitle(title).setContentText(body)
                      .setStyle(new NotificationCompat.BigTextStyle().bigText(body))
                      .setPriority(NotificationCompat.PRIORITY_HIGH)
                      .setAutoCancel(true).setContentIntent(pi);
                  try { ((NotificationManager) getSystemService(Context.NOTIFICATION_SERVICE)).notify((int) (System.currentTimeMillis() % Integer.MAX_VALUE), b.build()); } catch (SecurityException e) {}
              }
          }
          '''.replace('__PKG__', pkg))
          w('app/src/main/java/' + pkg.replace('.', '/') + '/MainActivity.java', """package %s;
          import android.app.Activity;
          import android.content.Intent;
          import android.graphics.Color;
          import android.net.Uri;
          import android.os.Bundle;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebResourceError;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          public class MainActivity extends Activity {
              private WebView web;
              private static final String HOME = "%s";
              private static final String HOST = "%s";
              private static final String SCH = "%s";
              @Override protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  getWindow().setStatusBarColor(Color.parseColor("#0a0a10"));
                  if (android.os.Build.VERSION.SDK_INT >= 33 && checkSelfPermission("android.permission.POST_NOTIFICATIONS") != android.content.pm.PackageManager.PERMISSION_GRANTED) requestPermissions(new String[]{"android.permission.POST_NOTIFICATIONS"}, 7);
                  try { if (App.initFirebase(this)) com.google.firebase.messaging.FirebaseMessaging.getInstance().getToken().addOnCompleteListener(new com.google.android.gms.tasks.OnCompleteListener<String>() { @Override public void onComplete(com.google.android.gms.tasks.Task<String> t) { if (t.isSuccessful() && t.getResult() != null) getSharedPreferences("mkt_push", MODE_PRIVATE).edit().putString("fcm", t.getResult()).apply(); } }); } catch (Exception e) {}
                  web = new WebView(this);
                  setContentView(web);
                  web.setOnApplyWindowInsetsListener(new android.view.View.OnApplyWindowInsetsListener() { @Override public android.view.WindowInsets onApplyWindowInsets(android.view.View v, android.view.WindowInsets i) { v.setPadding(0, i.getSystemWindowInsetTop(), 0, i.getSystemWindowInsetBottom()); return i; } });
                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  try { s.setUserAgentString(s.getUserAgentString() + " MktApp/2/__VC__"); } catch (Exception e0) {}
                  s.setAllowFileAccess(false);
                  s.setAllowContentAccess(false);
                  web.setBackgroundColor(Color.parseColor("#0a0a10"));
                  web.addJavascriptInterface(new Object() {
                      @JavascriptInterface public String fcm() { try { return getSharedPreferences("mkt_push", MODE_PRIVATE).getString("fcm", ""); } catch (Exception e) { return ""; } }
                      @JavascriptInterface public void open(String u) {
                          try {
                              final Uri x = Uri.parse(u);
                              if ("https".equals(x.getScheme()) && ok(x.getHost())) runOnUiThread(new Runnable() { public void run() {
                                  try { new androidx.browser.customtabs.CustomTabsIntent.Builder().setShowTitle(true).build().launchUrl(MainActivity.this, x); }
                                  catch (Exception e1) { try { startActivity(new Intent(Intent.ACTION_VIEW, x)); } catch (Exception e2) {} }
                              } });
                          } catch (Exception e) {}
                      }
                  }, "LavndrMkt");
                  web.setWebChromeClient(new android.webkit.WebChromeClient() {
                      @Override public boolean onJsAlert(WebView v, String url, String msg, final android.webkit.JsResult r) {
                          if (isFinishing()) { r.cancel(); return true; }
                          new android.app.AlertDialog.Builder(MainActivity.this, android.R.style.Theme_DeviceDefault_Dialog_Alert).setMessage(msg == null ? "" : msg)
                              .setPositiveButton("حسناً", new android.content.DialogInterface.OnClickListener() { public void onClick(android.content.DialogInterface d, int w) { r.confirm(); } })
                              .setOnCancelListener(new android.content.DialogInterface.OnCancelListener() { public void onCancel(android.content.DialogInterface d) { r.cancel(); } }).show();
                          return true;
                      }
                      @Override public boolean onJsConfirm(WebView v, String url, String msg, final android.webkit.JsResult r) {
                          if (isFinishing()) { r.cancel(); return true; }
                          new android.app.AlertDialog.Builder(MainActivity.this, android.R.style.Theme_DeviceDefault_Dialog_Alert).setMessage(msg == null ? "" : msg)
                              .setPositiveButton("نعم", new android.content.DialogInterface.OnClickListener() { public void onClick(android.content.DialogInterface d, int w) { r.confirm(); } })
                              .setNegativeButton("لا", new android.content.DialogInterface.OnClickListener() { public void onClick(android.content.DialogInterface d, int w) { r.cancel(); } })
                              .setOnCancelListener(new android.content.DialogInterface.OnCancelListener() { public void onCancel(android.content.DialogInterface d) { r.cancel(); } }).show();
                          return true;
                      }
                      @Override public boolean onJsPrompt(WebView v, String url, String msg, String def, final android.webkit.JsPromptResult r) {
                          if (isFinishing()) { r.cancel(); return true; }
                          final android.widget.EditText et = new android.widget.EditText(MainActivity.this); et.setText(def == null ? "" : def);
                          new android.app.AlertDialog.Builder(MainActivity.this, android.R.style.Theme_DeviceDefault_Dialog_Alert).setMessage(msg == null ? "" : msg).setView(et)
                              .setPositiveButton("حسناً", new android.content.DialogInterface.OnClickListener() { public void onClick(android.content.DialogInterface d, int w) { r.confirm(et.getText().toString()); } })
                              .setNegativeButton("إلغاء", new android.content.DialogInterface.OnClickListener() { public void onClick(android.content.DialogInterface d, int w) { r.cancel(); } })
                              .setOnCancelListener(new android.content.DialogInterface.OnCancelListener() { public void onCancel(android.content.DialogInterface d) { r.cancel(); } }).show();
                          return true;
                      }
                  });
                  web.setWebViewClient(new WebViewClient() {
                      @Override public boolean shouldOverrideUrlLoading(WebView v, WebResourceRequest r) {
                          Uri u = r.getUrl();
                          if ("https".equals(u.getScheme()) && ok(u.getHost())) return false;
                          try { startActivity(new Intent(Intent.ACTION_VIEW, u)); } catch (Exception e) {}
                          return true;
                      }
                      @Override public void onReceivedError(WebView v, WebResourceRequest r, WebResourceError e) {
                          if (r.isForMainFrame()) v.loadData("<html dir='rtl'><body style='background:#0a0a10;color:#fff;font-family:sans-serif;text-align:center;padding-top:30vh'><h3>لا يوجد اتصال بالإنترنت</h3><p>تحقق من الاتصال ثم أعد فتح التطبيق</p></body></html>", "text/html; charset=utf-8", null);
                      }
                  });
                  if (b == null) { String d = deepUrl(getIntent()); web.loadUrl(d != null ? d : HOME); } else web.restoreState(b);
              }
              private static boolean ok(String h) { return HOST.equals(h) || "lavndrs120.github.io".equals(h); }
              private String deepUrl(Intent i) {
                  try {
                      Uri d = i == null ? null : i.getData();
                      if (d == null || !SCH.equals(d.getScheme())) return null;
                      String c = d.getQueryParameter("c");
                      if (c == null || !c.matches("[a-f0-9]{12}")) return null;
                      return HOME + (HOME.contains("?") ? "&" : "?") + "hc=" + c;
                  } catch (Exception e) { return null; }
              }
              @Override protected void onNewIntent(Intent i) { super.onNewIntent(i); String d = deepUrl(i); if (d != null) web.loadUrl(d); }
              @Override protected void onSaveInstanceState(Bundle o) { super.onSaveInstanceState(o); web.saveState(o); }
              @Override public void onBackPressed() { if (web.canGoBack()) web.goBack(); else super.onBackPressed(); }
          }
          """.replace('__VC__', str(vc)) % (pkg, url, host, pkg))
          PY

      - name: بناء الـAPK
        working-directory: ${{ runner.temp }}/proj
        env:
          KS_PASS: ${{ secrets.APK_KEYSTORE_PASS }}
          KEY_PASS: ${{ secrets.APK_KEY_PASS }}
        run: |
          if [ -n "$KS_FILE" ]; then gradle --no-daemon assembleRelease; else gradle --no-daemon assembleDebug; fi

      - name: بناء AAB لـGoogle Play (اختياري)
        if: env.KS_FILE != ''
        continue-on-error: true
        working-directory: ${{ runner.temp }}/proj
        env:
          KS_PASS: ${{ secrets.APK_KEYSTORE_PASS }}
          KEY_PASS: ${{ secrets.APK_KEY_PASS }}
        run: gradle --no-daemon -Ptsdk=35 bundleRelease

      - name: نشر الـAPK
        id: pub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="apk-$APP_ID"
          FILE="market-$APP_ID.apk"
          if [ -f "$RUNNER_TEMP/proj/app/build/outputs/apk/release/app-release.apk" ]; then cp "$RUNNER_TEMP/proj/app/build/outputs/apk/release/app-release.apk" "$FILE"; else cp "$RUNNER_TEMP/proj/app/build/outputs/apk/debug/app-debug.apk" "$FILE"; fi
          FILES="$FILE"
          AABSRC="$RUNNER_TEMP/proj/app/build/outputs/bundle/release/app-release.aab"
          if [ -f "$AABSRC" ]; then cp "$AABSRC" "${FILE%.apk}.aab"; FILES="$FILE ${FILE%.apk}.aab"; fi
          gh release delete "$TAG" --yes --cleanup-tag >/dev/null 2>&1 || true
          gh release create "$TAG" $FILES --title "$TAG" --notes "APK for $APP_ID" --latest=false
          echo "url=https://github.com/${{ github.repository }}/releases/download/$TAG/$FILE" >> "$GITHUB_OUTPUT"
          # تنظيف تلقائي: حذف إصدارات apk-* القديمة (آخر تحديث > 90 يوماً) مع وسومها، ولا يمسّ الإصدار الحالي
          CUT=$(date -u -d '90 days ago' +%Y-%m-%dT%H:%M:%SZ)
          gh release list --limit 300 --json tagName,publishedAt -q ".[] | select(.tagName|startswith(\"apk-\")) | select(.tagName != \"$TAG\") | select(.publishedAt < \"$CUT\") | .tagName" 2>/dev/null | while read -r T; do
            [ -n "$T" ] && gh release delete "$T" --yes --cleanup-tag >/dev/null 2>&1 && echo "pruned $T" || true
          done

      - name: إبلاغ الخلفية
        if: always()
        env:
          CB_SECRET: ${{ secrets.APPB_CB_SECRET }}
          PUB_URL: ${{ steps.pub.outputs.url }}
          JOB_STATUS: ${{ job.status }}
        run: |
          export STATUS=failed; [ "$JOB_STATUS" = "success" ] && STATUS=ok
          python3 - <<'PY' > body.json
          import json, os
          print(json.dumps({"action": "appb_apk_done", "appId": os.environ["APP_ID"], "secret": os.environ["CB_SECRET"],
                            "status": os.environ["STATUS"], "url": os.environ.get("PUB_URL", ""),
                            "versionCode": open(os.path.join(os.environ["RUNNER_TEMP"], "vc.txt")).read().strip() if os.path.exists(os.path.join(os.environ["RUNNER_TEMP"], "vc.txt")) else ""}))
          PY
          curl -fsS --retry 3 --retry-delay 5 -X POST -H 'Content-Type: text/plain;charset=utf-8' --data @body.json "$WORKER_URL?action=appb_apk_done"
