name: Lavenders analytics beacon
on:
  schedule:
    - cron: '30 8 * * *'   # daily, picks up new pages written by the content agent
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: aio-agent
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Add beacon
        run: python aio-analytics.py
      - name: Commit
        run: |
          git config user.name "lavenders-analytics"
          git config user.email "analytics@users.noreply.github.com"
          git add -A -- '*.html'
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "Add analytics beacon to new pages"
          git pull --rebase
          git push
