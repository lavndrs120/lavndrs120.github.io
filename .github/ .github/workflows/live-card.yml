name: live-card
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/update_live.py
      - name: commit if changed
        run: |
          if [ -n "$(git status --porcelain index.html dashboard.html)" ]; then
            git config user.name "lavndr-bot"
            git config user.email "bot@users.noreply.github.com"
            git add index.html dashboard.html
            git commit -m "live card update [skip ci]"
            git push
          fi
