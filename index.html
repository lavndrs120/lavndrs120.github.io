<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LAVNDR120</title>
<meta name="description" content="لاڤندرز — منظومة سوق من 120 بزنس وبراند. اختر مسارك وباقتك.">
<style>
:root{--void:#04040A;--gold:#C9A84C;--text:rgba(255,255,255,.9);--dim:rgba(255,255,255,.45);--faint:rgba(255,255,255,.18);--line:rgba(255,255,255,.08)}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:radial-gradient(900px 500px at 50% -10%,rgba(201,168,76,.10),transparent),var(--void);color:var(--text);font-family:system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif;min-height:100vh}
.wrap{max-width:440px;margin:0 auto;padding:18px 18px 48px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:26px}
.login{background:none;border:1px solid var(--gold);color:var(--gold);border-radius:100px;padding:7px 16px;font-size:12px;font-weight:700;cursor:pointer}
.logo{text-align:center;font-size:30px;font-weight:900;letter-spacing:2px;background:linear-gradient(135deg,#C9A84C,#F0D080);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.tag{text-align:center;font-size:11px;color:#666;letter-spacing:3px;margin:4px 0 26px}
.back{background:none;border:none;color:var(--dim);font-size:12.5px;cursor:pointer;margin-bottom:14px}
.lead{font-size:13px;color:#aaa;line-height:1.9;margin-bottom:6px;text-align:center}
.sub{font-size:11px;color:#777;line-height:1.8;margin-bottom:20px;text-align:center}
.tile{cursor:pointer;border-radius:20px;padding:2px;margin-bottom:16px}
.tile>div{border-radius:18px;padding:20px 18px;text-align:right}
.tile .ic{font-size:30px;margin-bottom:6px}
.tile .tt{font-size:19px;font-weight:900;letter-spacing:.5px}
.tile .ss{font-size:12.5px;line-height:1.8;margin-top:6px}
.tile .go{margin-top:12px;font-size:12px;font-weight:700}
.price{font-size:12px;margin-top:8px;font-weight:700}
.btn{width:100%;padding:14px;border:none;border-radius:12px;font-weight:900;font-size:14px;cursor:pointer}
.var{flex:1;min-width:90px;padding:10px 6px;border-radius:12px;cursor:pointer;font-size:12px;font-weight:700;background:transparent}
.note{font-size:10.5px;color:var(--dim);line-height:1.7;margin-top:12px;text-align:center}
.foot{margin-top:30px;text-align:center;font-size:11px;color:#555}
.foot a{color:var(--gold);text-decoration:none}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <button class="login" onclick="goLogin()">تسجيل الدخول</button>
    <span style="font-size:11px;color:#555">LAVENDERS</span>
  </div>
  <div class="logo">LAVNDR120</div>
  <div class="tag">المؤشر الاستهلاكي</div>
  <div id="view"></div>
  <div class="foot">لديك حساب؟ <a href="dashboard.html" onclick="goLogin();return false;">ادخل إلى حسابك</a></div>
</div>

<script>
// ── بيانات المسارات والباقات (نفس نصوص الداشبورد) ──
const GATE_THEMES = {
  gold:    { border:'linear-gradient(135deg,#C9A84C,#6B21A8,#C9A84C)', bg:'linear-gradient(160deg,#1a1230 0%,#0d0a1a 100%)', eyebrow:'#F0D080', title:'#FFF7E0', body:'rgba(255,247,224,0.85)', btnBg:'linear-gradient(135deg,#F0D080,#C9A84C)', btnColor:'#1a1230', glow:'rgba(201,168,76,0.35)' },
  orange:  { border:'linear-gradient(135deg,#F97316,#7C2D12,#F97316)', bg:'linear-gradient(160deg,#2a1408 0%,#170a05 100%)', eyebrow:'#FDBA74', title:'#FFF1E0', body:'rgba(255,241,224,0.85)', btnBg:'linear-gradient(135deg,#FDBA74,#F97316)', btnColor:'#2a1408', glow:'rgba(249,115,22,0.35)' },
  teal:    { border:'linear-gradient(135deg,#2DD4BF,#0F4C5C,#2DD4BF)', bg:'linear-gradient(160deg,#08202a 0%,#050f14 100%)', eyebrow:'#99F6E4', title:'#E6FFFA', body:'rgba(230,255,250,0.85)', btnBg:'linear-gradient(135deg,#99F6E4,#2DD4BF)', btnColor:'#08202a', glow:'rgba(45,212,191,0.3)' },
  plain:   { border:'linear-gradient(135deg,rgba(255,255,255,0.18),rgba(255,255,255,0.06))', bg:'linear-gradient(160deg,#12121c 0%,#0a0a12 100%)', eyebrow:'#C9A84C', title:'#F5F5F5', body:'rgba(255,255,255,0.8)', btnBg:'var(--gold)', btnColor:'#04040A', glow:'rgba(201,168,76,0.25)' },
  emerald: { border:'linear-gradient(135deg,#34D399,#C9A84C,#34D399)', bg:'linear-gradient(160deg,#07241a 0%,#050f0b 100%)', eyebrow:'#6EE7B7', title:'#ECFDF5', body:'rgba(236,253,245,0.85)', btnBg:'linear-gradient(135deg,#6EE7B7,#C9A84C)', btnColor:'#07241a', glow:'rgba(52,211,153,0.35)' }
};

// نصوص العروض (التسويقية الرسمية). path: joinup | movement
const GATE_OFFERS = {
  oms: {
    path: 'movement', theme: 'teal', icon: '📲', title: 'OMS', eyebrow: 'للبزنسات والبراندات فقط',
    short: 'نظام إدارة الطلبات — خليك لاصق في هواتف عملائك بلمسة.',
    body: 'ما الذي يحدث لما تمحو المسافات؟\n• تمحو الفجوة\n• تمحو الزمن\n— بلمسة.\n\nنظام إدارة الطلبات OMS يعمل من الويب وعلى أندرويد لتبقى ملتصقًا في هواتف المستفيدين من خدمتك أو منتجك.',
    variants: [
      { tier: 'oms_services', label: 'براند خدمات', price: '429', period: 'اشتراك' },
      { tier: 'oms_products', label: 'براند منتجات', price: '492', period: 'اشتراك' },
      { tier: 'oms_vip', label: 'OMS VIP', price: '942', period: 'اشتراك',
        note: 'لبراند منتجات أو خدمات. القيمة مقسّمة إلى جزأين: قيمة التطبيق $429 + مقعد المشارك $513.' }
    ],
    cta: 'ابدأ اشتراك OMS'
  },
  lava: {
    path: 'joinup', theme: 'plain', icon: '🌋', title: 'لاڤا', eyebrow: 'داتا السوق',
    short: 'لاڤا هي داتا السوق نفسها — مش لازم تكون من الـ120.',
    body: 'ماذا لو ما بقيت تشوف السوق من الخارج بس؟\nلاڤندرز بدأت بـ120 بزنس وبراند، ولما اجتمعت الطلبات ظهر سوق له حركة ومؤشر استهلاكي وداتا بتتكوّن مع كل حركة. سمّينا الداتا دي لاڤا.\n\nلاڤا مش تقرير بتقرأه، ولا أرقام بتتفرج عليها — لاڤا هي داتا السوق. الـ120 بيكوّنوا السوق، وإنت تقدر تدخل وتستخدم اللاڤا.\n(للمطالعة فقط.)',
    variants: [
      { tier: 'lava', label: 'يوم واحد', price: '1.4', period: '/ يوم' },
      { tier: 'annual', label: 'سنة كاملة', price: '249', period: '/ سنة' }
    ],
    cta: 'اشترك في لاڤا'
  },
  fendex: {
    path: 'joinup', theme: 'gold', icon: '🔮', title: 'ڤندكس', eyebrow: 'LAVENDERS ORACLE — 120 ڤندر فقط',
    short: 'احمِ اللاڤا بالامتلاك، وخذ تقرير الأوراكل التنبؤي.',
    body: 'احمِ اللاڤا بالامتلاك، واحصل على تقرير الأوراكل التنبؤي.\nامتلك داتا تحليل السوق، واكشف سلوك المستهلك بعيدًا عن أيدي 1,000 مشترك.\nاحصل على تنبؤ السوق وسلوك المستهلك قبل أن يصبح ما تعرفه متاحًا للجميع.\n\nامتلك الأمس. افهم اليوم. واحتكر المستقبل.',
    variants: [ { tier: 'fendex', label: 'سنة كاملة', price: '1,287', period: '/ سنة' } ],
    cta: 'إنضم للڤندكس'
  },
  magma: {
    path: 'joinup', theme: 'orange', icon: '🌋', title: 'ماقما', eyebrow: 'عضوية محدودة لـ500 فقط',
    short: 'السوق مش اللي تعرفه — السوق هو اللي تقدر تختاره.',
    body: 'لاڤندرز ما بدأت لتضيف لك متجرًا آخر — بدأت لتجمع لك السوق: 120 بزنس وبراند.\nبدل ما تكون مرتبط بما تعرفه بس، الآن عندك مجال أن تعرف أكثر، وترى أكثر، وتختار أكثر.\n\nبـ100$ في السنة تفتح لنفسك بابًا إلى سوق كامل. المكان محدود، والفرصة ليست للجميع.',
    variants: [ { tier: 'magma', label: 'سنة كاملة', price: '100', period: '/ سنة' } ],
    cta: 'ادخل ماقما'
  },
  reseller: {
    path: 'movement', theme: 'emerald', icon: '🧩', title: 'RESELLER', eyebrow: '38 مقعدًا فقط',
    short: '8 تطبيقات تقدمها لـ8 بزنسات مختلفة.',
    body: 'أنت كـ Reseller ما بتبيع لعميل واحد — عندك 8 تطبيقات تقدر تقدمها لـ8 بزنسات مختلفة.\n\nقيمة التطبيق: $169.35\nقيمة حزمة الـ8 تطبيقات: $1,354.8\n\nتقدر تقدمها للمستهلكين بالقيمة التي تفضلها، بداية من:\n• $440.3 لبراندات الخدمات\n• $503.3 لبراندات المنتجات\n\nالمطلوب منك: تجيب البزنسات المناسبة وتقدم لها الحل. ونحن نوفر لك المنظومة الجاهزة للتشغيل.',
    variants: [ { tier: 'reseller', label: 'عضوية الريسيلر', price: '1,354.8', period: '8 تطبيقات' } ],
    cta: 'ابدأ كـ Reseller'
  },
  franchise: {
    path: 'movement', theme: 'emerald', icon: '🏛️', title: 'FRANCHISE', eyebrow: '19 صاحب امتياز فقط',
    short: 'ابنِ سوقك الخاص من 120 بزنس وبراند.',
    body: 'مع امتياز لاڤندرز بتبني سوقك الخاص من 120 بزنس وبراند، كل بزنس عنده تطبيق طلبات خاص به، والـ120 تطبيق مربوطين داخل مؤشر سوق واحد.\n\nنوفر لك: ✓ منظومة كاملة جاهزة للتشغيل ✓ تدريب عملي ✓ دعم فني وتشغيلي مستمر\n\nقيمة امتلاك المنظومة $2,709 — ولتسهيل بناء سوقك لا تدفعها دفعة واحدة. تبدأ بحجز $90، ثم تكمل بدفعات حسب تقدّم بناء سوقك ($22.58 لكل بزنس وبراند). تقدر تقدمها للمستهلكين بالقيمة التي تفضلها بداية من $452 لبراندات الخدمات و$515 لبراندات المنتجات.',
    variants: [ { tier: 'franchise', label: 'ابدأ بحجز $90', price: '2,709', period: 'إجمالي (دفعات)' } ],
    cta: 'احجز امتيازك'
  },
  tycoon: {
    path: 'movement', theme: 'gold', icon: '👑', title: 'TYCOON', eyebrow: 'تايكون واحد لكل دولة',
    short: 'قُد 20 سوقًا حيًّا في دولتك.',
    body: 'امتلك وكالة لاڤندرز لتقود الرحلة إلى خير الوجود.\nبقيمة $51,480 فقط تسمح لـ2,400 بزنس وبراند أن ينتظموا في سوق موحد — 20 سوقًا، في كل سوق 120 بزنس وبراند — وتشوف حركة السوق قدامك لحظة بلحظة.\n\nتايكون واحد لكل دولة. ومن التأسيس وحتى استقرار النظام السنوي، تحصد ما يصل إلى 10 أضعاف قيمة الوكالة — نعم، حتى $514,800.',
    variants: [ { tier: 'tycoon', label: 'تايكون الدولة', price: '51,480', period: 'وكالة' } ],
    cta: 'كن تايكون دولتك',
    needsCountry: true
  }
};
const GATE_PATHS = {
  joinup: {
    title: 'Join Up LAVENDERS', icon: '🔗', theme: 'plain',
    sub: 'ادخل السوق: بيانات السوق وتقارير الذكاء ودليل الأنشطة.',
    offers: ['lava', 'fendex', 'magma']
  },
  movement: {
    title: 'Join the Economic Movement', icon: '🌍', theme: 'emerald',
    sub: 'شارك في بناء السوق. أنت لا تشتري منتجًا — أنت تنضم إلى حركة تبني سوقًا.',
    offers: ['oms', 'reseller', 'franchise', 'tycoon']
  }
};


const REFUND_DAYS = 21;
const view = document.getElementById('view');

// جلسة قائمة في نفس التبويب → ادخل الداشبورد مباشرة (يستعيد مكانك الأخير)
try { if (sessionStorage.getItem('lavndr_token') && sessionStorage.getItem('lavndr_email') && !/home=1/.test(location.search)) location.replace('dashboard.html'); } catch (e) {}

function priceFrom(o) {
  const vs = o.variants.map(v => parseFloat(String(v.price).replace(/,/g, ''))).filter(n => !isNaN(n));
  const lo = Math.min.apply(null, vs);
  return (o.variants.length > 1 ? 'ابتداءً من $' : '$') + lo.toLocaleString('en-US');
}
function home() {
  const tile = key => {
    const p = GATE_PATHS[key], t = GATE_THEMES[p.theme];
    return `<div class="tile" role="button" tabindex="0" onkeydown="if(event.key==='Enter')this.click()" onclick="go('p','${key}')" style="background:${t.border}">
      <div style="background:${t.bg}"><div class="ic">${p.icon}</div>
      <div class="tt" style="color:${t.title}">${p.title}</div>
      <div class="ss" style="color:${t.body}">${p.sub}</div>
      <div class="go" style="color:${t.eyebrow}">استكشف الباقات ←</div></div></div>`;
  };
  view.innerHTML = `<div class="lead">LAVENDERS منظومة واحدة. اختر كيف تريد أن تكون جزءًا منها:</div>
    <div class="sub"><b style="color:var(--gold)">Join Up</b> = دخول إلى السوق وبياناته وتقاريره &nbsp;·&nbsp; <b style="color:#6EE7B7">البناء والحركة الاقتصادية</b> = المشاركة في بناء السوق</div>
    ${tile('joinup')}${tile('movement')}`;
}
function pathView(key) {
  const path = GATE_PATHS[key]; if (!path) return home();
  const cards = path.offers.map(k => {
    const o = GATE_OFFERS[k], t = GATE_THEMES[o.theme];
    return `<div class="tile" role="button" tabindex="0" onkeydown="if(event.key==='Enter')this.click()" onclick="go('o','${k}')" style="background:${t.border}">
      <div style="background:${t.bg}">
        <div style="font-size:10px;letter-spacing:1.5px;color:${t.eyebrow};margin-bottom:4px">${o.eyebrow}</div>
        <div class="tt" style="color:${t.title}">${o.icon} ${o.title}</div>
        <div class="ss" style="color:${t.body}">${o.short}</div>
        <div class="price" style="color:${t.eyebrow}">${priceFrom(o)}</div>
        <div class="go" style="color:${t.eyebrow}">التفاصيل ←</div></div></div>`;
  }).join('');
  view.innerHTML = `<button class="back" onclick="history.back()">← رجوع</button>
    <div style="font-size:19px;font-weight:900;margin-bottom:6px;text-align:right">${path.icon} ${path.title}</div>
    <div class="sub" style="text-align:right">${path.sub}</div>${cards}`;
}
function offerView(key, tier) {
  const o = GATE_OFFERS[key]; if (!o) return home();
  const t = GATE_THEMES[o.theme];
  const sel = o.variants.find(v => v.tier === tier) || o.variants[0];
  const vbtns = o.variants.length > 1
    ? '<div style="display:flex;gap:8px;margin:14px 0;flex-wrap:wrap">' + o.variants.map(v => `<button class="var" onclick="go('o','${key}','${v.tier}',true)" style="border:1px solid ${v.tier===sel.tier?t.eyebrow:'rgba(255,255,255,.15)'};color:${v.tier===sel.tier?t.title:t.body}">${v.label}<br><span style="font-size:15px">$${v.price}</span></button>`).join('') + '</div>' : '';
  const vip = sel.tier === 'oms_vip' ? `<div style="background:rgba(255,255,255,.06);border-radius:12px;padding:12px;margin:12px 0;font-size:12px;color:${t.body};line-height:1.9"><b>تفصيل قيمة OMS VIP — $942</b><br>• قيمة التطبيق: <b>$429</b><br>• مقعد المشارك: <b>$513</b></div>` : '';
  view.innerHTML = `<button class="back" onclick="history.back()">← ${GATE_PATHS[o.path].title}</button>
    <div style="border-radius:20px;padding:2px;background:${t.border}"><div style="border-radius:18px;padding:20px;background:${t.bg};text-align:right">
      <div style="font-size:10px;letter-spacing:1.5px;color:${t.eyebrow};margin-bottom:4px">${o.eyebrow}</div>
      <div style="display:flex;justify-content:space-between;align-items:flex-start">
        <div style="font-size:21px;font-weight:900;color:${t.title}">${o.icon} ${o.title}</div>
        <div style="text-align:left"><div style="font-size:26px;font-weight:900;color:${t.title}">$${sel.price}</div><div style="font-size:10px;color:${t.eyebrow}">${sel.period}</div></div>
      </div>
      ${vbtns}
      ${sel.note ? `<div style="font-size:11.5px;color:${t.eyebrow};margin:4px 0">${sel.note}</div>` : ''}
      ${vip}
      <div style="font-size:13px;color:${t.body};line-height:2;margin:12px 0 6px;white-space:pre-line">${o.body}</div>
      <div style="margin-top:14px"><button class="btn" onclick="start('${key}','${sel.tier}')" style="background:${t.btnBg};color:${t.btnColor}">${o.cta}</button></div>
      <div class="note">يطلب منك تسجيل الدخول بحساب Google، ثم تكمل من نفس هذه الباقة.<br>↩︎ استرداد نقدي خلال ${REFUND_DAYS} يومًا (3 أسابيع) وفق إجراءات الاسترداد المعتمدة.</div>
    </div></div>`;
}

// ── تنقّل: كل خطوة في سجل المتصفح (زر الرجوع يعمل) ومحفوظة في الرابط (#p/… #o/…)
function render(h) {
  const m = (h || '').replace(/^#/, '').split('/');
  if (m[0] === 'p') pathView(m[1]); else if (m[0] === 'o') offerView(m[1], m[2]); else home();
  window.scrollTo(0, 0);
}
function go(kind, a, b, replace) {
  const h = '#' + kind + '/' + a + (b ? '/' + b : '');
  if (replace) history.replaceState(null, '', h); else history.pushState(null, '', h);
  render(h);
}
window.addEventListener('popstate', () => render(location.hash));

// ── الانتقال للداشبورد: تُحفَظ الباقة المختارة ليكمل منها بعد الدخول
function start(offerKey, variantTier) {
  try { sessionStorage.setItem('lavndr_gate_pending', JSON.stringify({ offerKey: offerKey, variantTier: variantTier })); sessionStorage.setItem('lavndr_login_prompt', '1'); } catch (e) {}
  location.href = 'dashboard.html';
}
function goLogin() {
  try { sessionStorage.setItem('lavndr_login_prompt', '1'); } catch (e) {}
  location.href = 'dashboard.html';
}
render(location.hash);
</script>
</body>
</html>
