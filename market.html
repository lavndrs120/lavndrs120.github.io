<!DOCTYPE html>

<style>

body{background:var(--void);color:#fff;font-family:'Inter',system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:18px}
.card{width:100%;max-width:420px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);border-radius:22px;padding:26px 22px;text-align:center}

<script>
const BACK=(new URLSearchParams(location.search).get('b')||'').trim();
const OK=/^https:\/\/script\.google\.com\/macros\/s\/[A-Za-z0-9_-]{10,200}\/exec$/.test(BACK);
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let n=0;
function jsonp(params){return new Promise((res,rej)=>{const cb='__m'+(++n)+'_'+Date.now(),s=document.createElement('script');const t=setTimeout(()=>{x();rej(1)},30000);function x(){clearTimeout(t);delete window[cb];s.remove()}window[cb]=r=>{x();res(r)};s.onerror=()=>{x();rej(1)};s.src=BACK+'?'+new URLSearchParams(Object.assign({callback:cb},params));document.head.appendChild(s)})}
async function get(pr){
  pr=pr||{};
  try{const r=await fetch(BACK+'?'+new URLSearchParams(Object.assign({callback:'cb'},pr)),{credentials:'omit'});const t=await r.text(),i=t.indexOf('('),k=t.lastIndexOf(')');if(i<0||k<i)throw 0;return JSON.parse(t.slice(i+1,k))}
  catch(e){return await jsonp(pr)}
}
const IMGRX=/^https:\/\/drive\.google\.com\/thumbnail\?id=[A-Za-z0-9_-]{10,80}&sz=w\d{3,4}$/;

  if(d.accent&&/^#[0-9A-Fa-f]{6}$/.test(d.accent)){const h=d.accent,r=parseInt(h.slice(1,3),16),g=parseInt(h.slice(3,5),16),b=parseInt(h.slice(5,7),16),l=v=>Math.round(v+(255-v)*.35);document.documentElement.style.setProperty('--gold',h);document.documentElement.style.setProperty('--gold2','rgb('+l(r)+','+l(g)+','+l(b)+')')}
  if(d.image&&IMGRX.test(d.image)){document.body.style.background="linear-gradient(rgba(4,4,10,.72),rgba(4,4,10,.86)),url('"+d.image+"') center/cover fixed no-repeat #04040A"}
  const x=d.index||{},ch=parseFloat(x.change)||0,c=ch>=0?'pos':'neg',a=ch>=0?'▲':'▼',ts=(d.timestamp||'').slice(0,16).replace('T',' ');

  '<div class="nav '+c+'">$'+esc(x.NAV||'0.00')+'</div><div class="ch '+c+'">'+a+' '+esc(String(x.change||'0.00').replace(/^[+-]/,''))+' ('+esc(String(x.changePercent||'0.00').replace(/^[+-]/,''))+'%)</div>'+
  '<div class="meta"><div>High<b>$'+esc(x.dayHigh||'0.00')+'</b></div><div>Low<b>$'+esc(x.dayLow||'0.00')+'</b></div><div>Volatility<b>'+esc(x.volatility||'0.00')+'%</b></div></div>'+

}

/* ───── باقات مسار البيانات (إن فعّلها صاحب المؤشر) ───── */
let PL=null,SES='',MYS=[],VIEW='';
const ST=(k,v)=>{try{if(v===undefined)return sessionStorage.getItem(k)||'';sessionStorage.setItem(k,v)}catch(e){return ''}};
function fmtD(ms){try{return new Date(ms).toISOString().slice(0,10)}catch(e){return ''}}
async function loadPlans(){
  try{const p=await get({action:'plans'});if(!p||!p.on)return;PL=p;SES=ST('mkt_s_'+p.mid);await refreshSub();renderPlans()}catch(e){}
}
async function refreshSub(){
  MYS=[];if(!SES)return;
  const r=await get({action:'my_sub',s:SES});
  if(r&&r.error){SES='';ST('mkt_s_'+PL.mid,'');return}
  MYS=(r&&r.subs)||[];
}
function mine(tier){const now=Date.now();let a=MYS.filter(x=>x.tier===tier&&x.status==='active'&&x.end>now)[0];if(a)return{k:'active',end:a.end};if(MYS.some(x=>x.tier===tier&&x.status==='pending'))return{k:'pending'};return{k:'none'}}
function has(tiers){return tiers.some(t=>mine(t).k==='active')}
function stepsBar(active){
  const L=['اختر','التفاصيل','الدفع','التأكيد'];
  return '<div style="display:flex;align-items:center;justify-content:center;gap:4px;margin:0 0 18px;flex-wrap:nowrap;transform-origin:center">'+L.map((l,i)=>{const n=i+1,on=n===active,dn=n<active;
    return '<div style="display:flex;align-items:center;gap:5px"><div style="width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;'+(on?'background:var(--gold);color:#04040A':dn?'background:rgba(201,168,76,.25);color:var(--gold)':'background:rgba(255,255,255,.07);opacity:.6')+'">'+(dn?'✓':n)+'</div><span style="font-size:10.5px;'+(on?'font-weight:700':'opacity:.6')+'">'+l+'</span></div>'+(n<4?'<div style="width:14px;height:1px;background:rgba(255,255,255,.12)"></div>':'')}).join('')+'</div>';
}
function bankBox(){
  const b=PL.bank||{};
  const row=(l,v)=>v?'<div class="brw"><div style="min-width:0;text-align:right"><div class="lbl" style="font-size:10px">'+l+'</div><div dir="auto" style="word-break:break-all;font-size:13px">'+esc(v)+'</div></div><button data-copy="'+esc(v)+'" class="cpb">نسخ</button></div>':'';
  if(!(b.bank||b.holder||b.account||b.iban||b.bban||b.swift||b.branch))return '<div class="lbl">لم يضف صاحب المؤشر بيانات الدفع بعد.</div>';
  return '<div class="bkb">'+row('البنك',b.bank)+row('اسم صاحب الحساب',b.holder)+row('رقم الحساب',b.account)+row('IBAN',b.iban)+row('BBAN',b.bban)+row('رمز السويفت — للتحويل الدولي (SWIFT)',b.swift)+row('الفرع',b.branch)+(b.cur?'<div class="lbl" style="padding:8px 0 6px;line-height:1.7">القيمة بالدولار، والتحويل الفعلي بـ('+esc(b.cur)+') بما يعادلها يوم التحويل.</div>':'')+'</div>';
}
function payScreen(t){
  return '<div style="text-align:center">'+stepsBar(3)+'<div style="font-size:15px;font-weight:800;color:var(--gold);margin-bottom:4px">'+esc(t.name)+'</div><div style="font-size:26px;font-weight:900;margin-bottom:14px">$'+esc(t.price)+'</div>'+
  '<div class="lbl" style="margin-bottom:14px;line-height:1.8;text-align:right"><b>١.</b> حوّل المبلغ إلى الحساب أدناه.<br><b>٢.</b> أرسلنا رمز التحقق إلى إيميلك — أدخله مع رقم/مرجع المعاملة من إشعار البنك.</div>'+bankBox()+
  '<input id="so" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="رمز التحقق (من الإيميل)" style="text-align:center;letter-spacing:3px"><input id="rf" maxlength="40" placeholder="رقم/مرجع المعاملة البنكية" autocomplete="off" style="text-align:center"><button data-send="'+esc(t.tier)+'" style="width:100%;padding:13px;border:none;border-radius:10px;background:var(--gold);color:#04040A;font-weight:800;font-size:14px">تأكيد الدفع</button><div id="pm" class="err" style="margin-top:10px"></div></div>';
}

}
/* ───── عروض الباقات: نفس الثيمات والنصوص والبنية في لاڤندرز ───── */
const GT={
  gold:{border:'linear-gradient(135deg,#C9A84C,#6B21A8,#C9A84C)',bg:'linear-gradient(160deg,#1a1230 0%,#0d0a1a 100%)',eyebrow:'#F0D080',title:'#FFF7E0',body:'rgba(255,247,224,0.85)',btnBg:'linear-gradient(135deg,#F0D080,#C9A84C)',btnColor:'#1a1230',glow:'rgba(201,168,76,0.35)'},
  orange:{border:'linear-gradient(135deg,#F97316,#7C2D12,#F97316)',bg:'linear-gradient(160deg,#2a1408 0%,#170a05 100%)',eyebrow:'#FDBA74',title:'#FFF1E0',body:'rgba(255,241,224,0.85)',btnBg:'linear-gradient(135deg,#FDBA74,#F97316)',btnColor:'#2a1408',glow:'rgba(249,115,22,0.35)'},
  plain:{border:'linear-gradient(135deg,rgba(255,255,255,0.18),rgba(255,255,255,0.06))',bg:'linear-gradient(160deg,#12121c 0%,#0a0a12 100%)',eyebrow:'#C9A84C',title:'#F5F5F5',body:'rgba(255,255,255,0.8)',btnBg:'var(--gold)',btnColor:'#04040A',glow:'rgba(201,168,76,0.25)'}
};
const GO={
  lava:{theme:'plain',icon:'🌋',title:'لاڤا',eyebrow:'داتا السوق',body:'ماذا لو ما بقيت تشوف السوق من الخارج بس؟\nلاڤندرز بدأت بـ120 بزنس وبراند، ولما اجتمعت الطلبات ظهر سوق له حركة ومؤشر استهلاكي وداتا بتتكوّن مع كل حركة. سمّينا الداتا دي لاڤا.\n\nلاڤا مش تقرير بتقرأه، ولا أرقام بتتفرج عليها — لاڤا هي داتا السوق. الـ120 بيكوّنوا السوق، وإنت تقدر تدخل وتستخدم اللاڤا.\n(للمطالعة فقط.)',variants:[['lava','يوم واحد','/ يوم'],['annual','سنة كاملة','/ سنة']],cta:'اشترك في لاڤا'},
  fendex:{theme:'gold',icon:'🔮',title:'ڤندكس',eyebrow:'LAVENDERS ORACLE — 120 ڤندر فقط',body:'احمِ اللاڤا بالامتلاك، واحصل على تقرير الأوراكل التنبؤي.\nامتلك داتا تحليل السوق، واكشف سلوك المستهلك بعيدًا عن أيدي 1,000 مشترك.\nاحصل على تنبؤ السوق وسلوك المستهلك قبل أن يصبح ما تعرفه متاحًا للجميع.\n\nامتلك الأمس. افهم اليوم. واحتكر المستقبل.',variants:[['fendex','سنة كاملة','/ سنة']],cta:'إنضم للڤندكس'},
  magma:{theme:'orange',icon:'🌋',title:'ماقما',eyebrow:'عضوية محدودة لـ500 فقط',body:'لاڤندرز ما بدأت لتضيف لك متجرًا آخر — بدأت لتجمع لك السوق: 120 بزنس وبراند.\nبدل ما تكون مرتبط بما تعرفه بس، الآن عندك مجال أن تعرف أكثر، وترى أكثر، وتختار أكثر.\n\nبـ100$ في السنة تفتح لنفسك بابًا إلى سوق كامل. المكان محدود، والفرصة ليست للجميع.',variants:[['magma','سنة كاملة','/ سنة']],cta:'ادخل ماقما'}
};
const OSEL={};let PAYV=null;
const money=n=>Number(n).toLocaleString('en-US');
function offerCard(key){
  const o=GO[key],t=GT[o.theme],vs=o.variants.map(v=>({v:v,t:PL.tiers.filter(x=>x.tier===v[0])[0]})).filter(x=>x.t);

const STEPN=l=>stepsBar(l);

let G={open:false,s:'path',k:'lava'};
function gateShell(inner){
  return '<div style="max-width:420px;margin:0 auto;padding:44px 20px 40px;text-align:center"><div style="font-size:28px;font-weight:900;background:linear-gradient(135deg,#C9A84C,#F0D080);-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:2px;margin-bottom:6px">LAVNDR120</div><div style="font-size:11px;color:#555;letter-spacing:3px;margin-bottom:28px">المؤشر الاستهلاكي</div>'+inner+'<button data-gclose="1" style="width:100%;margin-top:14px;padding:10px;border:1px solid rgba(255,255,255,.1);border-radius:10px;background:transparent;color:rgba(255,255,255,.55);font-size:12px">رجوع</button></div>';
}
const backBtn=(act,l)=>'<div style="text-align:right;margin-bottom:14px"><button data-'+act+'="1" style="background:none;border:none;color:rgba(255,255,255,.55);font-size:13px;cursor:pointer;padding:0;width:auto">← '+l+'</button></div>';
function pathScreen(){
  const cards=['lava','fendex','magma'].map(k=>{
    const o=GO[k],t=GT[o.theme],T=PL.tiers.filter(x=>x.tier===o.variants[0][0])[0];if(!T)return '';
    const pr=k==='lava'?'ابتداءً من '+money(T.price)+'$':'$'+money(T.price);
    const sc=(T.max>0&&T.left>0&&k!=='lava')?'<div style="display:inline-block;margin-top:8px;padding:4px 10px;border-radius:100px;background:rgba(244,63,94,0.18);border:1px solid rgba(244,63,94,0.4);color:#FCA5A5;font-size:10.5px;font-weight:700">🔥 باقي '+money(T.left)+' مكان من '+money(T.max)+'</div>':'';
    return '<div role="button" tabindex="0" data-go="'+k+'" style="cursor:pointer;border-radius:20px;padding:2px;margin-bottom:14px;background:'+t.border+'"><div style="border-radius:18px;padding:18px;background:'+t.bg+';text-align:right"><div style="font-size:10px;letter-spacing:1.5px;color:'+t.eyebrow+';margin-bottom:4px">'+o.eyebrow+'</div><div style="font-size:18px;font-weight:900;color:'+t.title+'">'+o.icon+' '+o.title+'</div><div style="font-size:12.5px;color:'+t.body+';line-height:1.8;margin-top:8px">'+SHORT[k]+'</div><div style="font-size:15px;font-weight:800;color:'+t.eyebrow+';margin-top:8px">'+pr+'</div>'+sc+'<div style="margin-top:12px;font-size:12px;font-weight:700;color:'+t.eyebrow+'">التفاصيل ←</div></div></div>';
  }).join('');
  return STEPN(1)+backBtn('gclose','رجوع')+'<div style="font-size:21px;font-weight:900;color:#F5F5F5;margin-bottom:10px;text-align:right">Join Up LAVENDERS 🔗</div><div style="font-size:12.5px;color:rgba(255,255,255,.6);margin-bottom:18px;line-height:1.8;text-align:right;border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:12px 14px">ادخل السوق: بيانات السوق وتقارير الذكاء ودليل الأنشطة.</div>'+cards;
}
function renderGate(){
  const g=$('gate');if(!G.open){g.style.display='none';return}
  g.style.display='block';
  let inner;
  if(G.s==='path')inner=pathScreen();
  else if(G.s==='offer')inner=STEPN(2)+backBtn('gpath','Join Up LAVENDERS')+offerCard(G.k);
  else if(G.s==='pay')inner=payScreen(G.t);
  else inner=pendScreen();
  g.innerHTML=gateShell(inner);
  g.scrollTop=0;
}
function openGate(s,k){G={open:true,s:s||'path',k:k||G.k};renderGate()}
function renderPlans(){
  const el=$('pl');el.style.display='block';
  let h='<div style="font-size:13px;color:#aaa;margin-bottom:6px;line-height:1.8;text-align:center">LAVENDERS منظومة واحدة. اختر كيف تريد أن تكون جزءًا منها:</div><div style="font-size:11px;color:#777;margin-bottom:16px;line-height:1.7;text-align:center"><b style="color:var(--gold)">Join Up</b> = دخول إلى السوق وبياناته وتقاريره</div><button data-gopen="1" style="width:100%;padding:16px;border:none;border-radius:16px;background:linear-gradient(135deg,#F0D080,#C9A84C);color:#1a1230;font-weight:900;font-size:17px;cursor:pointer;box-shadow:0 4px 20px rgba(201,168,76,.35)">اتجه لمسارك المفضل ←</button>';
  if(SES){
    const b=[];
    if(has(['lava','annual','fendex']))b.push('<button data-v="data">📊 البيانات</button>');
    if(has(['fendex']))b.push('<button data-v="report">📑 التقرير</button>');
    if(has(['magma']))b.push('<button data-v="directory">📇 الدليل</button>');
    if(b.length)h+='<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:16px">'+b.join('')+'</div>';
    h+='<div style="margin-top:10px"><button data-out="1">تسجيل الخروج</button></div>';
  }
  h+='<div id="pv"></div><div class="ft">اشتراك للاطلاع على بيانات فقط — ليس استثماراً ولا حصة في شيء، ولا وعداً بعوائد. الدفع والاسترداد بين المشترك وصاحب المؤشر مباشرة، ولاڤندرز لا تستلم ولا تحتفظ بأي مبلغ.</div>';
  el.innerHTML=h;
  renderGate();
  if(VIEW&&SES)showView(VIEW);
}
function openLogin(){const o=$('lo');o.style.display='flex';loginUI()}
function closeLogin(){$('lo').style.display='none'}
async function onPlClick(ev){
  const b=ev.target.closest&&ev.target.closest('[data-go],[data-gopen],[data-gclose],[data-gpath],button');if(!b)return;
  if(b.dataset.gopen)openGate('path');
  else if(b.dataset.gclose){G.open=false;PAYV=null;renderGate()}
  else if(b.dataset.gpath){G.s='path';renderGate()}
  else if(b.dataset.go){G.s='offer';G.k=b.dataset.go;renderGate()}
  else if(b.dataset.sel){const p=b.dataset.sel.split('|');OSEL[p[0]]=p[1];renderGate()}
  else if(b.dataset.login){openLogin()}
  else if(b.dataset.back){G.s='offer';renderGate()}
  else if(b.dataset.t){
    const t=PL.tiers.filter(x=>x.tier===b.dataset.t)[0];
    b.disabled=true;b.textContent='جارٍ إرسال رمز التحقق إلى بريدك…';
    try{const r=await get({action:'sub_start',s:SES,tier:t.tier});
      if(r&&r.status==='otp_sent'){G.s='pay';G.t=t;renderGate()}
      else{alert((r&&r.error)||'تعذّر البدء');if(r&&r.code===401){SES='';ST('mkt_s_'+PL.mid,'')}renderPlans()}
    }catch(e){alert('تعذّر الاتصال');renderPlans()}
  }else if(b.dataset.send){
    const v=($('rf').value||'').trim(),o=($('so').value||'').trim();if(!o||!v){$('pm').textContent='لازم تدخل الرمز ورقم المعاملة';return}
    b.disabled=true;$('pm').textContent='جاري التأكيد...';
    try{const r=await get({action:'sub_confirm',s:SES,tier:b.dataset.send,otp:o,ref:v});
      if(r&&r.status==='pending'){await refreshSub();G.s='pend';renderPlans()}
      else{$('pm').textContent=(r&&r.error)||'تعذّر الإرسال';b.disabled=false;if(r&&r.code===401){SES='';ST('mkt_s_'+PL.mid,'');G.open=false;renderPlans()}}
    }catch(e){$('pm').textContent='تعذّر الاتصال';b.disabled=false}
  }else if(b.dataset.v){VIEW=b.dataset.v;showView(VIEW)}
  else if(b.dataset.chk){await refreshSub();G.s='path';renderPlans()}
  else if(b.dataset.copy){try{await navigator.clipboard.writeText(b.dataset.copy);b.textContent='تم النسخ ✓'}catch(e){const ta=document.createElement('textarea');ta.value=b.dataset.copy;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');b.textContent='تم النسخ ✓'}catch(_){}ta.remove()}setTimeout(()=>{b.textContent='نسخ'},1400)}
  else if(b.dataset.out){SES='';VIEW='';MYS=[];G.open=false;ST('mkt_s_'+PL.mid,'');renderPlans()}
}
$('pl').addEventListener('click',onPlClick);$('gate').addEventListener('click',onPlClick);
async function showView(a){
  const pv=$('pv');if(!pv)return;pv.innerHTML='<div class="lbl" style="margin-top:12px">جاري التحميل…</div>';
  try{const r=await get({action:a,s:SES});
    if(!r||r.error){pv.innerHTML='<div class="err" style="margin-top:10px">'+esc((r&&r.error)||'تعذّر التحميل')+'</div>';return}
    let h='<div style="margin-top:14px">';
    if(a==='data'){
      const hs=r.history||[];
      if(hs.length>1){const mn=Math.min(...hs.map(x=>x.nav)),mx=Math.max(...hs.map(x=>x.nav)),sp=(mx-mn)||1,pts=hs.map((x,i)=>(i/(hs.length-1)*300).toFixed(1)+','+(60-(x.nav-mn)/sp*56-2).toFixed(1)).join(' ');
        h+='<svg viewBox="0 0 300 60" style="width:100%;height:70px"><polyline fill="none" stroke="var(--gold2)" stroke-width="2" points="'+pts+'"/></svg><div class="lbl">سجل قيمة المؤشر ($'+mn.toFixed(2)+' – $'+mx.toFixed(2)+')</div>'}
      h+='<div class="lbl" style="margin:10px 0 4px">ترتيب البزنسات بعدد الطلبات ('+esc(r.orders)+' طلب)</div>'+(r.ranking||[]).map((x,i)=>'<div class="rw"><span>'+(i+1)+'. '+esc(x.name)+'</span><span>'+esc(x.orders)+' · '+esc(x.weight)+'%</span></div>').join('');
    }else if(a==='report'){
      const c=v=>'<span class="'+(v>=0?'pos':'neg')+'">'+(v>=0?'+':'')+esc(v)+'%</span>';
      h+='<div class="rw"><span>قيمة المؤشر</span><span>$'+esc(r.nav)+'</span></div><div class="rw"><span>تغيّر 24 ساعة</span><span>'+c(r.change24h)+'</span></div><div class="rw"><span>تغيّر 7 أيام</span><span>'+c(r.change7d)+'</span></div><div class="rw"><span>تغيّر 30 يوماً</span><span>'+c(r.change30d)+'</span></div><div class="rw"><span>أعلى / أدنى 30 يوماً</span><span>$'+esc(Number(r.high30d).toFixed(2))+' / $'+esc(Number(r.low30d).toFixed(2))+'</span></div><div class="rw"><span>البزنسات · الطلبات</span><span>'+esc(r.businesses)+' · '+esc(r.orders)+'</span></div><div class="lbl" style="margin:10px 0 4px">أعلى 5 بزنسات وزناً</div>'+(r.top||[]).map((x,i)=>'<div class="rw"><span>'+(i+1)+'. '+esc(x.name)+'</span><span>'+esc(x.weight)+'%</span></div>').join('')+'<div class="lbl" style="margin-top:8px">تقرير وصفي لما حدث فعلاً، لا يتنبأ بشيء ولا يعد بنتيجة.</div>';
    }else{
      h+=(r.list||[]).map(x=>'<div class="rw"><span>'+esc(x.name)+'</span><span>'+(/^https:\/\//.test(x.link||'')?'<a href="'+esc(x.link)+'" target="_blank" rel="noopener noreferrer" style="color:var(--gold2)">فتح</a>':'—')+'</span></div>').join('')||'<div class="lbl">لا أنشطة بعد.</div>';
    }
    pv.innerHTML=h+'</div>';
  }catch(e){pv.innerHTML='<div class="err" style="margin-top:10px">تعذّر الاتصال</div>'}
}
const APP=new URLSearchParams(location.search).get('app')==='1';
function loginUI(){
  const box=$('gb');if(!box)return;
  const old0=$('gl');if(old0)old0.remove();
  if(APP||CODE){
    box.style.display='block';
    box.innerHTML='<div class="lbl" style="margin-bottom:6px">اكتب بريدك لنرسل لك رمز دخول:</div><input id="le" type="email" inputmode="email" autocomplete="email" placeholder="you@example.com"><button data-cs="1" style="width:100%">إرسال الرمز</button><div id="lc"></div><div id="lm" class="lbl" style="margin-top:6px"></div>'+(APP?'':'<div class="lbl" style="margin-top:8px"><a href="#" data-g="1" style="color:var(--gold2)">الدخول بحساب Google</a></div>');
    return;
  }
  box.style.display='flex';box.innerHTML='';const old=$('gl');if(old)old.remove();
  showGsi();
  box.insertAdjacentHTML('afterend','<div id="gl" class="lbl" style="margin-top:14px;text-align:center"><a href="#" data-c="1" style="color:var(--gold2)">لا يعمل زر Google؟ ادخل برمز على بريدك</a></div>');
}
let CODE=false;
document.addEventListener('click',async ev=>{
  const a=ev.target.closest&&ev.target.closest('[data-c],[data-g],[data-cs],[data-cv]');if(!a||!PL)return;
  if(a.dataset.c){ev.preventDefault();CODE=true;loginUI()}
  else if(a.dataset.g){ev.preventDefault();CODE=false;loginUI()}
  else if(a.dataset.cs){
    const em=($('le').value||'').trim();a.disabled=true;$('lm').textContent='جارٍ الإرسال…';
    try{const r=await get({action:'code_send',email:em});
      if(r&&r.status==='sent'){$('lm').textContent='أرسلنا رمزاً إلى بريدك (تحقق من البريد المزعج أيضاً).';$('lc').innerHTML='<input id="lk" inputmode="numeric" maxlength="6" placeholder="الرمز المكوّن من 6 أرقام"><button data-cv="1" style="width:100%">دخول</button>'}
      else $('lm').textContent=(r&&r.error)||'تعذّر الإرسال';a.disabled=false}catch(e){$('lm').textContent='تعذّر الاتصال';a.disabled=false}
  }else if(a.dataset.cv){
    a.disabled=true;
    try{const r=await get({action:'code_verify',email:($('le').value||'').trim(),code:($('lk').value||'').trim()});
      if(r&&r.session){SES=r.session;ST('mkt_s_'+PL.mid,SES);await refreshSub();closeLogin();renderPlans()}else{$('lm').textContent=(r&&r.error)||'تعذّر الدخول';a.disabled=false}}catch(e){$('lm').textContent='تعذّر الاتصال';a.disabled=false}
  }
});
function showGsi(){
  const go=()=>{
    if(!window.google||!google.accounts||!$('gb'))return false;
    google.accounts.id.initialize({client_id:PL.clientId,nonce:'lvnmkt-'+PL.mid,callback:async cr=>{
      try{const r=await get({action:'mkt_login',idToken:cr.credential});
        if(r&&r.session){SES=r.session;ST('mkt_s_'+PL.mid,SES);await refreshSub();closeLogin();renderPlans()}else alert((r&&r.error)||'تعذّر الدخول')}catch(e){alert('تعذّر الاتصال')}}});
    google.accounts.id.renderButton($('gb'),{theme:'filled_black',size:'large',shape:'pill',text:'signin_with',locale:'ar'});return true;
  };
  if(go())return;
  if(!document.getElementById('gsi')){const s=document.createElement('script');s.id='gsi';s.src='https://accounts.google.com/gsi/client';s.async=true;s.onload=()=>go();document.head.appendChild(s)}
  else setTimeout(go,800);
}
async function load(){
  if(!OK){$('c').innerHTML='<div class="err">الرابط غير صحيح.</div>';return}
  try{const d=await get();if(d&&d.index){draw(d);if(d.plans&&!PL)loadPlans()}else $('c').innerHTML='<div class="err">'+esc((d&&d.error)||'المؤشر غير متاح الآن')+'</div>'}
  catch(e){$('c').innerHTML='<div class="err">تعذّر الاتصال. أعد المحاولة بعد قليل.</div>'}
}
load();setInterval(load,120000);
</script>
