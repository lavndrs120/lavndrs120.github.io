<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8">

<style>
:root{--void:#04040A;--glass:rgba(255,255,255,.04);--gb:rgba(255,255,255,.09);--gold:#C9A84C;--gold2:#F0D080;--em:#10B981;--red:#F43F5E;--text:rgba(255,255,255,.92);--dim:rgba(255,255,255,.5);--faint:rgba(255,255,255,.18)}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--void);color:var(--text);font-family:'Inter',system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif;min-height:100vh;overflow-x:hidden;line-height:1.6}
body::after{content:'';position:fixed;inset:0;z-index:-1;background:linear-gradient(rgba(6,6,12,.88),rgba(6,6,12,.7) 40%,rgba(6,6,12,.85)),url(bg-m.jpg) center/cover no-repeat}
@media(min-width:900px){body::after{background:linear-gradient(rgba(6,6,12,.8),rgba(6,6,12,.72)),url(bg-d.jpg) center/cover no-repeat}}
.wrap{max-width:560px;margin:0 auto;padding:16px 16px 90px}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.logo{font-size:20px;font-weight:900;background:linear-gradient(135deg,#C9A84C,#F0D080);-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:1px}
a.back{color:var(--dim);font-size:13px;text-decoration:none}
h1{font-size:22px;margin-bottom:4px}h2{font-size:16px;margin-bottom:10px;color:var(--gold2)}
.sub{color:var(--dim);font-size:13px;margin-bottom:16px}
.card{background:var(--glass);border:1px solid var(--gb);border-radius:16px;padding:16px;margin-bottom:14px}
label{display:block;font-size:12px;color:var(--dim);margin:10px 0 4px}
input,textarea,select{width:100%;background:rgba(255,255,255,.05);border:1px solid var(--gb);border-radius:10px;color:#fff;font:inherit;font-size:14px;padding:10px 12px;outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--gold)}
textarea{resize:vertical;min-height:60px}select option{background:#12121c}
.row{display:flex;gap:8px}.row>*{flex:1;min-width:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:none;border-radius:12px;padding:11px 16px;font:inherit;font-size:14px;font-weight:600;cursor:pointer;background:linear-gradient(135deg,#C9A84C,#E6C46A);color:#1a1405;width:100%;margin-top:12px;text-decoration:none}
.btn.sec{background:var(--glass);border:1px solid var(--gb);color:var(--text)}
.btn.ok{background:var(--em);color:#04150e}.btn.bad{background:rgba(244,63,94,.16);border:1px solid rgba(244,63,94,.4);color:#ffb3c0}
.btn.sm{width:auto;padding:7px 12px;font-size:12px;margin-top:0}.btn:disabled{opacity:.5;cursor:not-allowed}
.msg{font-size:13px;margin-top:10px;padding:9px 12px;border-radius:10px;display:none;line-height:1.7}
.msg.err{display:block;background:rgba(244,63,94,.12);color:#ffb3c0;border:1px solid rgba(244,63,94,.3)}
.msg.good{display:block;background:rgba(16,185,129,.12);color:#8ff0c8;border:1px solid rgba(16,185,129,.3)}
.msg.info{display:block;background:rgba(201,168,76,.1);color:var(--gold2);border:1px solid rgba(201,168,76,.28)}
.pill{display:inline-block;font-size:11px;padding:2px 10px;border-radius:99px;border:1px solid var(--gb);color:var(--dim)}
.pill.trial{color:var(--gold2);border-color:rgba(201,168,76,.5)}.pill.paid{color:#8ff0c8;border-color:rgba(16,185,129,.5)}.pill.expired{color:#ffb3c0;border-color:rgba(244,63,94,.5)}
.item{border:1px solid var(--gb);border-radius:14px;padding:12px;margin-bottom:10px;background:rgba(255,255,255,.02)}
.item-h{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--gold2);margin-bottom:4px}
.val{font-size:12px;margin-top:6px;color:var(--dim)}.val.low{color:#ffb3c0}.val.good{color:#8ff0c8}
.thumb{width:64px;height:64px;border-radius:12px;object-fit:cover;background:rgba(255,255,255,.06);border:1px solid var(--gb);flex:none}
.imgrow{display:flex;gap:10px;align-items:center;margin-top:10px}
.imgrow .fbtn{font-size:12px;color:var(--gold2);cursor:pointer;border:1px dashed rgba(201,168,76,.5);padding:8px 12px;border-radius:10px}
.imgrow input{display:none}
.build{cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:10px}
.small{font-size:12px;color:var(--dim)}
.link{color:var(--gold2);word-break:break-all;direction:ltr;display:block;font-size:13px}
.ord{border-bottom:1px solid var(--gb);padding:10px 0}.ord:last-child{border:none}
.step{display:flex;gap:10px;align-items:center;padding:7px 0;font-size:14px;color:var(--dim)}
.step.run{color:var(--gold2)}.step.done{color:#8ff0c8}.step.fail{color:#ffb3c0}
.dot{width:18px;text-align:center}
#gsi{display:flex;justify-content:center;margin-top:16px}
</style>

<body>
<div class="wrap">
  <div class="top"><div class="logo">LAVNDR120</div><a class="back" href="dashboard.html">← لوحتي</a></div>
  <div id="app"></div>
</div>
<script>
const WORKER_URL='https://lavndr.omssolutionorders.workers.dev';
const GSI_CLIENT_ID='776097955989-go2bsq8e7c1umei4vj984jtabve49m32.apps.googleusercontent.com';
const STORE_PAGE='https://lavndrs120.github.io/store.html';
const G_SCOPES='https://www.googleapis.com/auth/script.projects https://www.googleapis.com/auth/script.deployments https://www.googleapis.com/auth/spreadsheets https://www.googleapis.com/auth/drive.file';
let TOKEN='',EMAIL='';try{TOKEN=sessionStorage.getItem('lavndr_token')||'';EMAIL=sessionStorage.getItem('lavndr_email')||''}catch(e){}
let S={rules:{minValue:4.275,maxItems:9},ents:[],builds:[],cur:null,tick:null,active:{}};
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const round3=n=>Math.round(n*1000)/1000;
const money=n=>'$'+(Math.round(Number(n)*1000)/1000);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function showMsg(id,t,cls){const e=$(id);if(!e)return;e.className='msg '+(cls||'err');e.textContent=t}
function copyTxt(t){try{navigator.clipboard.writeText(t)}catch(e){}}

// ───── لاڤندرز: الأهلية والرمز فقط ─────
async function api(action,params,post){
  try{
    let r;
    if(post){r=await fetch(WORKER_URL+'?action='+action,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(Object.assign({},params||{},{action:action,token:TOKEN}))})}
    else{r=await fetch(WORKER_URL+'?'+new URLSearchParams(Object.assign({},params||{},{action:action,token:TOKEN})))}
    const j=await r.json();
    if(j&&(j.code===401||j.error==='Invalid token')){logout();return {error:'انتهت الجلسة'}}
    return j||{error:'رد فارغ'};
  }catch(e){return {error:'فشل الاتصال — تحقق من الإنترنت'}}
}
function logout(){TOKEN='';EMAIL='';try{sessionStorage.removeItem('lavndr_token');sessionStorage.removeItem('lavndr_email')}catch(e){}showLogin('سجّل دخولك للمتابعة')}
function showLogin(m){
  $('app').innerHTML='<div class="card" style="text-align:center"><h1>بناء تطبيقك</h1><p class="sub">'+esc(m||'سجّل دخولك بحساب Google')+'</p><div id="gsi"></div></div>';
  if(window.LavndrApp&&typeof window.LavndrApp.signIn==='function'){window.handleCredentialResponse=onCred;$('gsi').innerHTML='<button class="btn" onclick="LavndrApp.signIn()">تسجيل الدخول بحساب Google</button>';return}
  const go=()=>{if(window.google&&google.accounts&&google.accounts.id){google.accounts.id.initialize({client_id:GSI_CLIENT_ID,callback:onCred});google.accounts.id.renderButton($('gsi'),{theme:'filled_black',size:'large',shape:'pill',locale:'ar'})}else setTimeout(go,300)};go();
}
async function onCred(resp){
  $('app').innerHTML='<div class="card sub">جاري التحقق…</div>';
  try{
    const r=await fetch(WORKER_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'login',idToken:resp.credential})});
    const j=await r.json();
    if(!j.token){showLogin('فشل تسجيل الدخول — حاول مرة أخرى');return}
    TOKEN=j.token;EMAIL=j.email;try{sessionStorage.setItem('lavndr_token',TOKEN);sessionStorage.setItem('lavndr_email',EMAIL)}catch(e){}
    boot();
  }catch(e){showLogin('فشل الاتصال — حاول مرة أخرى')}
}

// ───── جوجل: حساب المستخدم نفسه ─────
let gTok='',gExp=0,gClient=null;
function gAuth(){
  return new Promise((res,rej)=>{
    if(gTok&&Date.now()<gExp-60000)return res(gTok);
    // داخل تطبيق الأندرويد: Google تمنع الموافقة داخل WebView، فنستعمل النافذة الأصلية عبر الجسر LavndrApp
    if(window.LavndrApp){
      if(typeof window.LavndrApp.authorize!=='function')return rej(new Error('حدّث تطبيق لاڤندرز إلى آخر إصدار لإكمال هذه الخطوة'));
      window.__lvnAuth=function(r){
        try{if(typeof r==='string')r=JSON.parse(r)}catch(e){r={error:'bad'}}
        if(!r||r.error||!r.accessToken)return rej(new Error('لم تتم الموافقة على الصلاحيات'));
        gTok=r.accessToken;gExp=Date.now()+(Number(r.expiresIn)||3000)*1000;res(gTok)};
      try{window.LavndrApp.authorize(G_SCOPES)}catch(e){rej(new Error('تعذّر فتح نافذة الموافقة'))}
      return;
    }
    if(!(window.google&&google.accounts&&google.accounts.oauth2))return rej(new Error('تعذّر تحميل خدمة جوجل — حدّث الصفحة'));
    gClient=google.accounts.oauth2.initTokenClient({client_id:GSI_CLIENT_ID,scope:G_SCOPES,hint:EMAIL||undefined,callback:r=>{
      if(r.error)return rej(new Error('لم تتم الموافقة على الصلاحيات'));
      try{localStorage.setItem('lvn_g_ok',EMAIL)}catch(e){}gTok=r.access_token;gExp=Date.now()+(Number(r.expires_in)||3000)*1000;res(gTok)},
      error_callback:e=>rej(new Error('أُغلقت نافذة الموافقة'))});
    var seen=false;try{seen=localStorage.getItem('lvn_g_ok')===EMAIL&&!!EMAIL}catch(e){}gClient.requestAccessToken({prompt:seen?'':'consent'});
  });
}
async function gf(url,opt){
  const t=await gAuth();opt=opt||{};opt.headers=Object.assign({Authorization:'Bearer '+t},opt.headers||{});
  const r=await fetch(url,opt);let j={};try{j=await r.json()}catch(e){}
  if(!r.ok){
    const m=(j.error&&j.error.message)||('خطأ '+r.status);
    if(/Apps Script API|has not enabled|not been used in project|accessNotConfigured/i.test(m)){const e=new Error('apiOff');e.apiOff=true;e.detail=m;throw e}
    const e=new Error(m);e.status=r.status;throw e;
  }
  return j;
}
async function driveUpload(dataUrl,name){
  const b64=dataUrl.split(',')[1],bd='lvn'+Math.random().toString(36).slice(2);
  const body='--'+bd+'\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n'+JSON.stringify({name:name,mimeType:'image/jpeg'})+'\r\n--'+bd+'\r\nContent-Type: image/jpeg\r\nContent-Transfer-Encoding: base64\r\n\r\n'+b64+'\r\n--'+bd+'--';
  const f=await gf('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id',{method:'POST',headers:{'Content-Type':'multipart/related; boundary='+bd},body:body});
  await gf('https://www.googleapis.com/drive/v3/files/'+f.id+'/permissions',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({role:'reader',type:'anyone'})});
  return 'https://drive.google.com/thumbnail?id='+f.id+'&sz=w900';
}
const REQ_HEADERS=['OrderID','Timestamp','Item','Qty','Unit','Total','Customer','Phone','Email','Location','ReqTime','Lat','Lon','TxnRef','Verified','Status','DecidedAt','SheetRow'];
const ORD_HEADERS=['Timestamp','Product','Qty','Price','Total','Customer','Type','AP_Code','Location'];
async function createSheet(title){
  const s=await gf('https://sheets.googleapis.com/v4/spreadsheets',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({properties:{title:title},sheets:[{properties:{title:'Requests'}},{properties:{title:'Orders'}},{properties:{title:'Config'}}]})});
  await gf('https://sheets.googleapis.com/v4/spreadsheets/'+s.spreadsheetId+'/values:batchUpdate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({valueInputOption:'RAW',data:[{range:'Requests!A1',values:[REQ_HEADERS]},{range:'Orders!A1',values:[ORD_HEADERS]}]})});
  return s.spreadsheetId;
}
async function saveConfigCell(sheetId,cfg){
  await gf('https://sheets.googleapis.com/v4/spreadsheets/'+sheetId+'/values/Config!A1?valueInputOption=RAW',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({values:[[JSON.stringify(cfg)]]})});
}
async function loadConfigCell(sheetId){
  const j=await gf('https://sheets.googleapis.com/v4/spreadsheets/'+sheetId+'/values/Config!A1');
  return JSON.parse((j.values&&j.values[0]&&j.values[0][0])||'null');
}
let TEMPLATE=null;
async function loadTemplate(){
  if(TEMPLATE)return TEMPLATE;
  const [c,m]=await Promise.all([fetch('user-backend.gs.txt',{cache:'no-cache'}).then(r=>{if(!r.ok)throw new Error('تعذّر تحميل قالب الخلفية');return r.text()}),fetch('appsscript.json',{cache:'no-cache'}).then(r=>{if(!r.ok)throw new Error('تعذّر تحميل إعدادات الخلفية');return r.text()})]);
  TEMPLATE={code:c,manifest:m};return TEMPLATE;
}
function bakeCode(tpl,app){
  const json=JSON.stringify(app).split(String.fromCharCode(8232)).join('\\u2028').split(String.fromCharCode(8233)).join('\\u2029');
  return tpl.code.split('__APP_JSON__').join(json);
}
async function pushScript(scriptId,tpl,app){
  await gf('https://script.googleapis.com/v1/projects/'+scriptId+'/content',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({files:[{name:'Code',type:'SERVER_JS',source:bakeCode(tpl,app)},{name:'appsscript',type:'JSON',source:tpl.manifest}]})});
  const v=await gf('https://script.googleapis.com/v1/projects/'+scriptId+'/versions',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({description:'store '+new Date().toISOString()})});
  return v.versionNumber;
}
function jsonp(url,params,timeout){
  return new Promise((resolve,reject)=>{
    const cb='cb_'+Date.now()+'_'+Math.random().toString(36).slice(2,8),s=document.createElement('script');
    const t=setTimeout(()=>{clean();reject(new Error('timeout'))},timeout||12000);
    function clean(){try{delete window[cb]}catch(e){window[cb]=undefined}if(s.parentNode)s.parentNode.removeChild(s);clearTimeout(t)}
    window[cb]=r=>{clean();resolve(r)};
    s.onerror=()=>{clean();reject(new Error('load'))};
    s.src=url+(url.indexOf('?')>-1?'&':'?')+new URLSearchParams(Object.assign({},params,{callback:cb}));
    document.body.appendChild(s);
  });
}
async function probe(url){try{const r=await jsonp(url,{action:'ping'},8000);return !!(r&&r.status==='ok')}catch(e){return false}}

// ───── القائمة ─────
async function boot(){
  if(!TOKEN){showLogin();return}
  $('app').innerHTML='<div class="card sub">جاري التحميل…</div>';
  const j=await api('appb_my_builds');
  if(j.error){$('app').innerHTML='<div class="card"><div class="msg err">'+esc(j.error)+'</div><button class="btn sec" onclick="boot()">إعادة المحاولة</button></div>';return}
  S.rules=j.rules||S.rules;S.ents=j.entitlements||[];S.builds=j.builds||[];renderList();
}
function statusPill(b){const m={draft:'قيد الإنشاء',trial:'تجربة',paid:'قابل للنشر',expired:'انتهت التجربة'};return '<span class="pill '+esc(b.status)+'">'+(m[b.status]||esc(b.status))+'</span>'}
function renderList(){
  clearInterval(S.tick);
  let h='<h1>بناء تطبيقك</h1><p class="sub">متجر طلبات وتطبيق أندرويد باسم بزنسك، يعمل من حسابك أنت.</p>';
  if(!S.ents.length&&!S.builds.length){
    h+='<div class="card"><div class="msg info">بناء التطبيقات متاح لأعضاء OMS والريسلر والفرانشايز الفعّالين.</div><a class="btn sec" href="packages.html">عرض الباقات</a></div>';
    $('app').innerHTML=h;return;
  }
  S.builds.forEach(b=>{h+='<div class="card build" onclick="openBuild(\''+esc(b.appId)+'\')"><div><b>'+esc(b.name)+'</b><div class="small">'+(b.kind==='products'?'منتجات':'خدمات')+'</div></div>'+statusPill(b)+'</div>'});
  if(S.ents.some(e=>e.used<e.capacity))h+='<button class="btn" onclick="newBuild()">+ تطبيق جديد</button>';
  else if(S.ents.length)h+='<div class="msg info">استهلكت كل التطبيقات المتاحة في عضويتك.</div>';
  $('app').innerHTML=h;
}
function openBuild(id){const b=S.builds.find(x=>x.appId===id);if(!b)return;S.cur=b;renderDash()}
function newBuild(){
  const e=S.ents.filter(x=>x.used<x.capacity)[0];
  S.cur={appId:'',slot:e.slot,kind:e.kind||'',name:'',payInfo:'',bizImage:'',items:[{name:'',desc:'',price:'',packQty:1,packLabel:'',imageUrl:''}],_new:true};
  renderEditor();
}

// ───── المحرر ─────
function renderEditor(){
  clearInterval(S.tick);
  const b=S.cur,slotKind=((S.ents.find(e=>e.slot===b.slot)||{}).kind)||'';
  let h='<h1>'+(b.appId?'تعديل المتجر':'تطبيق جديد')+'</h1><p class="sub">بيانات البزنس والأصناف</p><div class="card">';
  if(!slotKind&&!b.appId)h+='<label>نوع البزنس</label><select id="f_kind"><option value="services"'+(b.kind==='services'?' selected':'')+'>خدمات</option><option value="products"'+(b.kind==='products'?' selected':'')+'>منتجات</option></select>';
  h+='<label>اسم البزنس أو البراند</label><input id="f_name" maxlength="60" value="'+esc(b.name)+'">';
  h+='<label>طريقة الدفع التي يراها الزبون (رقم حساب، محفظة…)</label><textarea id="f_pay" maxlength="400">'+esc(b.payInfo)+'</textarea>';
  h+='<div class="imgrow"><img class="thumb" id="bizThumb" src="'+esc(b.pendingBiz||b.bizImage||'')+'" onerror="this.style.visibility=\'hidden\'"><label class="fbtn" style="margin:0">صورة البزنس (تظهر كخلفية)<input type="file" accept="image/*" onchange="pickImg(this,\'biz\')"></label></div></div>';
  h+='<h2>الأصناف (حتى '+S.rules.maxItems+')</h2><div id="items"></div><button class="btn sec" id="addBtn" onclick="addItem()">+ إضافة صنف</button>';
  h+='<div id="m1" class="msg"></div><button class="btn" id="saveBtn" onclick="startSave()">'+(b.appId?'حفظ وتحديث المتجر':'إنشاء المتجر')+'</button><button class="btn sec" onclick="'+(b.appId?'renderDash()':'boot()')+'">رجوع</button>';
  $('app').innerHTML=h;renderItems();
}
function readForm(){
  const b=S.cur;if(!$('f_name'))return;b.name=$('f_name').value||'';b.payInfo=($('f_pay')||{}).value||'';if($('f_kind'))b.kind=$('f_kind').value;
  b.items.forEach((it,i)=>{const g=k=>$('i'+i+k);if(!g('n'))return;it.name=g('n').value;it.desc=g('d').value;it.price=g('p').value;it.packQty=parseInt(g('q').value,10)||1;it.packLabel=g('l').value});
}
function renderItems(){
  const b=S.cur;let h='';
  b.items.forEach((it,i)=>{
    h+='<div class="item"><div class="item-h"><span>صنف '+(i+1)+'</span>'+(b.items.length>1?'<a style="color:var(--red);cursor:pointer;font-size:12px" onclick="delItem('+i+')">حذف</a>':'')+'</div>';
    h+='<label>اسم الصنف</label><input id="i'+i+'n" maxlength="40" value="'+esc(it.name)+'">';
    h+='<label>وصف قصير (اختياري)</label><textarea id="i'+i+'d" maxlength="300">'+esc(it.desc)+'</textarea>';
    h+='<div class="row"><div><label>السعر ($)</label><input id="i'+i+'p" inputmode="decimal" value="'+esc(it.price)+'" oninput="valHint('+i+')"></div><div><label>عدد الوحدات في الباقة</label><input id="i'+i+'q" type="number" min="1" max="1000" value="'+esc(it.packQty)+'" oninput="valHint('+i+')"></div></div>';
    h+='<label>اسم الباقة (إن لزم)</label><input id="i'+i+'l" maxlength="40" placeholder="مثال: اشتراك 3 جلسات" value="'+esc(it.packLabel)+'"><div class="val" id="v'+i+'"></div>';
    h+='<div class="imgrow"><img class="thumb" src="'+esc(it.pendingImg||it.imageUrl||'')+'" onerror="this.style.visibility=\'hidden\'"><label class="fbtn" style="margin:0">صورة الصنف<input type="file" accept="image/*" onchange="pickImg(this,'+i+')"></label></div></div>';
  });
  $('items').innerHTML=h;b.items.forEach((_,i)=>valHint(i));$('addBtn').style.display=b.items.length>=S.rules.maxItems?'none':'';
}
function valHint(i){
  const min=S.rules.minValue,p=parseFloat(String(($('i'+i+'p')||{}).value).replace(',','.')),q=parseInt(($('i'+i+'q')||{}).value,10)||1,el=$('v'+i);if(!el)return;
  if(!(p>0)){el.className='val';el.textContent='القيمة الدنيا لكل صنف '+money(min)+' (السعر × عدد الوحدات).';return}
  const v=round3(p*q);
  if(v+1e-9<min){const sg=Math.ceil(min/p-1e-9);el.className='val low';el.innerHTML='قيمة الصنف '+money(v)+' أقل من '+money(min)+'. صمّم باقة اشتراك: <a style="color:var(--gold2);cursor:pointer;text-decoration:underline" onclick="setPack('+i+','+sg+')">اجعلها '+sg+' وحدات ('+money(round3(p*sg))+')</a>'}
  else{el.className='val good';el.textContent='قيمة الصنف '+money(v)+' ✓'}
}
function setPack(i,q){$('i'+i+'q').value=q;valHint(i)}
function addItem(){readForm();if(S.cur.items.length>=S.rules.maxItems)return;S.cur.items.push({name:'',desc:'',price:'',packQty:1,packLabel:'',imageUrl:''});renderItems()}
function delItem(i){readForm();S.cur.items.splice(i,1);renderItems()}
function resizeImg(file,max,cb){
  const fr=new FileReader();fr.onerror=()=>cb(null);
  fr.onload=()=>{const im=new Image();im.onerror=()=>cb(null);im.onload=()=>{
    let w=im.width,h=im.height,sc=Math.min(1,max/Math.max(w,h));w=Math.round(w*sc);h=Math.round(h*sc);
    const c=document.createElement('canvas');let q=.85,out='';
    for(let t=0;t<8;t++){c.width=w;c.height=h;c.getContext('2d').drawImage(im,0,0,w,h);out=c.toDataURL('image/jpeg',q);if(out.length<=600000)break;q-=.1;if(q<.4){q=.7;w=Math.round(w*.8);h=Math.round(h*.8)}}
    cb(out)};im.src=fr.result};
  fr.readAsDataURL(file);
}
function pickImg(inp,target){
  const f=inp.files&&inp.files[0];if(!f)return;readForm();
  resizeImg(f,1000,d=>{
    if(!d){showMsg('m1','تعذّر تجهيز الصورة — جرّب صورة أخرى','err');return}
    if(target==='biz'){S.cur.pendingBiz=d;$('bizThumb').src=d;$('bizThumb').style.visibility='visible'}
    else{S.cur.items[target].pendingImg=d;renderItems()}
  });
}
function validateForm(){
  const b=S.cur,min=S.rules.minValue,errs=[];
  if(!b.kind)errs.push('اختر نوع البزنس');
  if(b.name.trim().length<2)errs.push('اكتب اسم البزنس');
  if(!b.bizImage&&!b.pendingBiz)errs.push('ارفع صورة البزنس');
  if(!b.items.length)errs.push('أضف صنفاً واحداً على الأقل');
  b.items.forEach((it,i)=>{
    const p=parseFloat(String(it.price).replace(',','.')),n='صنف '+(i+1)+': ';
    if(!it.name.trim())errs.push(n+'اسم الصنف مطلوب');
    else if(!(p>0))errs.push(n+'السعر غير صحيح');
    else if(round3(p*it.packQty)+1e-9<min)errs.push(n+'القيمة أقل من '+money(min)+' — اجعله باقة '+Math.ceil(min/p-1e-9)+' وحدات');
    if(!it.imageUrl&&!it.pendingImg)errs.push(n+'ارفع صورة الصنف');
  });
  return errs;
}

// ───── الإنشاء / التحديث التلقائي ─────
const STEPS=['الموافقة على الصلاحيات','حجز المتجر','رفع الصور إلى حسابك','إنشاء شيت الطلبات','إنشاء الخلفية في Apps Script','نشر الخلفية','تسجيل المتجر'];
function stepsUI(n,state,msg){
  let h='<h1>جاري إنشاء متجرك</h1><p class="sub">لا تُغلق الصفحة.</p><div class="card">';
  STEPS.forEach((s,i)=>{const c=i<n?'done':(i===n?(state||'run'):'');h+='<div class="step '+c+'"><span class="dot">'+(i<n?'✓':(i===n?(state==='fail'?'✕':'…'):'○'))+'</span>'+esc(s)+'</div>'});
  h+='</div>';if(msg)h+='<div class="msg err" style="display:block">'+msg+'</div><button class="btn" onclick="startSave()">إعادة المحاولة</button><button class="btn sec" onclick="renderEditor()">رجوع للتعديل</button>';
  $('app').innerHTML=h;
}
function provKey(id){return 'lvn_prov_'+(id||'new')}
function getProv(){try{return JSON.parse(localStorage.getItem(provKey(S.cur.appId||S.cur._rid))||'{}')}catch(e){return {}}}
function setProv(p){try{localStorage.setItem(provKey(S.cur.appId||S.cur._rid),JSON.stringify(p))}catch(e){}}
function clearProv(){try{localStorage.removeItem(provKey(S.cur.appId||S.cur._rid))}catch(e){}}
async function sha256hex(s){const d=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return Array.from(new Uint8Array(d)).map(b=>b.toString(16).padStart(2,'0')).join('')}

async function startSave(){
  readForm();const b=S.cur,errs=validateForm();
  if(errs.length){showMsg('m1',errs.join(' | '),'err');return}
  const creating=!b.appId;
  let n=0;
  try{
    stepsUI(0);await gAuth();n=1;
    // حجز المتجر عند لاڤندرز (أهلية + موعد انتهاء التجربة + بصمة رمز الفتح)
    stepsUI(1);
    let meta=b._meta;
    if(!meta){
      if(b.appId){meta={appId:b.appId,trialEnds:b.trialEnds,unlockHash:b.unlockHash,notifyKey:b.notifyKey,scriptId:b.scriptId,deploymentId:b.deploymentId,sheetId:b.sheetId,backendUrl:b.backendUrl}}
      else{
        const rv=await api('appb_reserve',{slot:b.slot,kind:b.kind,name:b.name},true);
        if(rv.error)throw new Error(rv.message||rv.error);
        meta={appId:rv.appId,trialEnds:rv.trialEnds,unlockHash:rv.unlockHash,notifyKey:rv.notifyKey};
      }
      b._meta=meta;
    }
    b._rid=meta.appId;const P=getProv();
    // الصور
    n=2;stepsUI(2);
    if(b.pendingBiz){P.bizImage=await driveUpload(b.pendingBiz,'biz-'+meta.appId+'.jpg');b.bizImage=P.bizImage;b.pendingBiz=null;setProv(P)}
    for(let i=0;i<b.items.length;i++){const it=b.items[i];if(it.pendingImg){it.imageUrl=await driveUpload(it.pendingImg,'item-'+meta.appId+'-'+i+'.jpg');it.pendingImg=null;setProv(P)}}
    // الشيت
    n=3;stepsUI(3);
    let sheetId=meta.sheetId||P.sheetId;
    if(!sheetId){sheetId=await createSheet(b.name+' — طلبات المتجر');P.sheetId=sheetId;setProv(P)}
    // الخلفية
    n=4;stepsUI(4);
    const tpl=await loadTemplate();
    let scriptId=meta.scriptId||P.scriptId;
    if(!scriptId){const pr=await gf('https://script.googleapis.com/v1/projects',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({title:b.name+' — خلفية المتجر'})});scriptId=pr.scriptId;P.scriptId=scriptId;setProv(P)}
    const app={id:meta.appId,name:b.name.trim(),kind:b.kind,bizImage:b.bizImage,payInfo:b.payInfo.trim(),owner:EMAIL,sheetId:sheetId,trialEnds:Number(meta.trialEnds),unlockHash:meta.unlockHash,notifyKey:meta.notifyKey||'',notifyUrl:WORKER_URL+'?action=appb_notify',
      items:b.items.map(it=>({name:it.name.trim(),desc:(it.desc||'').trim(),price:round3(parseFloat(String(it.price).replace(',','.'))),packQty:it.packQty,packLabel:(it.packLabel||'').trim(),imageUrl:it.imageUrl}))};
    await saveConfigCell(sheetId,app);
    const ver=await pushScript(scriptId,tpl,app);
    // النشر
    n=5;stepsUI(5);
    let depId=meta.deploymentId||P.deploymentId,url=meta.backendUrl||P.backendUrl;
    if(!depId){
      const d=await gf('https://script.googleapis.com/v1/projects/'+scriptId+'/deployments',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({versionNumber:ver,manifestFileName:'appsscript',description:'store'})});
      depId=d.deploymentId;const ep=(d.entryPoints||[]).find(e=>e.entryPointType==='WEB_APP');
      url=(ep&&ep.webApp&&ep.webApp.url)||('https://script.google.com/macros/s/'+depId+'/exec');
      P.deploymentId=depId;P.backendUrl=url;setProv(P);
    }else{
      await gf('https://script.googleapis.com/v1/projects/'+scriptId+'/deployments/'+depId,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({deploymentConfig:{scriptId:scriptId,versionNumber:ver,manifestFileName:'appsscript',description:'store'}})});
    }
    // التسجيل
    n=6;stepsUI(6);
    const rg=await api('appb_register',{appId:meta.appId,name:b.name.trim(),kind:b.kind,backendUrl:url,scriptId:scriptId,deploymentId:depId,sheetId:sheetId},true);
    if(rg.error)throw new Error(rg.message||rg.error);
    clearProv();
    const j=await api('appb_my_builds');if(j.builds){S.builds=j.builds;S.ents=j.entitlements||S.ents}
    S.cur=S.builds.find(x=>x.appId===meta.appId)||S.cur;renderDash(creating?'تم إنشاء متجرك. بقيت خطوة تفعيل الخلفية.':'تم تحديث متجرك.');
  }catch(err){
    if(err.apiOff){stepsUI(n,'fail','فعّل Apps Script API في حسابك مرة واحدة: افتح <a class="link" style="display:inline" href="https://script.google.com/home/usersettings" target="_blank" rel="noopener">script.google.com/home/usersettings</a> وشغّل خيار «Google Apps Script API»، ثم عُد واضغط إعادة المحاولة.');return}
    stepsUI(n,'fail',esc(err.message||'حدث خطأ'));
  }
}

// ───── لوحة المتجر ─────
function storeLink(b){return STORE_PAGE+'?b='+encodeURIComponent(b.backendUrl)}
function fmtLeft(s){const h=Math.floor(s/3600),m=Math.floor(s%3600/60);return h+' س '+m+' د'}
function renderDash(banner){
  clearInterval(S.tick);const b=S.cur;
  let h='<h1>'+esc(b.name)+'</h1><p class="sub">'+statusPill(b)+'</p>';
  if(banner)h+='<div class="msg good" style="display:block">'+esc(banner)+'</div>';
  if(b.status==='trial')h+='<div class="msg info" style="display:block"><span id="left"></span><br>'+esc(b.note)+'</div>';
  if(b.status==='expired')h+='<div class="msg err" style="display:block">'+esc(b.note)+'</div>';
  if(b.status==='trial'||b.status==='expired')h+='<button class="btn ok" id="unlBtn" onclick="unlock()">فتح النسخة القابلة للنشر</button><div id="m4" class="msg"></div>';
  if(b.backendUrl&&b.status!=='draft'){
    h+='<div class="card" id="actv"><h2>تفعيل الخلفية</h2><div class="small">جاري الفحص…</div></div>';
    h+='<div class="card"><h2>رابط المتجر</h2><a class="link" href="'+esc(storeLink(b))+'" target="_blank" rel="noopener">'+esc(storeLink(b))+'</a><button class="btn sec sm" style="margin-top:10px" onclick="copyTxt(\''+esc(storeLink(b))+'\')">نسخ الرابط</button></div>';
    if(b.status==='trial'||b.status==='paid')h+='<div class="card"><h2>تطبيق الأندرويد</h2><div id="apk" class="small">…</div></div>';
    h+='<div class="card"><h2>الطلبات</h2><div id="ords" class="small">جاري التحميل…</div></div>';
    h+='<div class="card"><h2>شيت الطلبات</h2><a class="link" href="https://docs.google.com/spreadsheets/d/'+esc(b.sheetId)+'" target="_blank" rel="noopener">فتح الشيت في حسابك</a></div>';
  }
  h+='<button class="btn sec" onclick="editBuild()">تعديل الأصناف والصور</button><button class="btn sec" onclick="boot()">رجوع للقائمة</button>';
  $('app').innerHTML=h;
  if(b.status==='trial'){let s=b.secondsLeft;const t=()=>{const e=$('left');if(e)e.textContent='المتبقي من التجربة: '+fmtLeft(Math.max(0,s));if(s<=0){clearInterval(S.tick);boot();return}s--};t();S.tick=setInterval(t,1000)}
  if(b.backendUrl&&b.status!=='draft'){checkActive();if(b.status==='trial'||b.status==='paid')loadApk();loadOrders()}
}
async function checkActive(){
  const b=S.cur,el=$('actv');if(!el)return;
  if(await probe(b.backendUrl)){S.active[b.appId]=1;el.innerHTML='<h2>الخلفية</h2><div class="small" style="color:#8ff0c8">✓ تعمل</div>';syncPaid(b);return}
  el.innerHTML='<h2>تفعيل الخلفية</h2><div class="small" style="line-height:1.9">مرة واحدة فقط: اضغط الزر، ثم في صفحة جوجل اختر حسابك، ثم «متقدم» ثم «الانتقال إلى المتجر (غير آمن)» ثم «السماح». وهذا طبيعي لأن الخلفية تعمل من حسابك أنت.</div><a class="btn" href="'+esc(b.backendUrl+'?action=ping&authuser='+encodeURIComponent(EMAIL))+'" target="_blank" rel="noopener">فتح صفحة التفعيل</a><div class="small" style="margin-top:8px">لازم تفتحها بنفس الحساب الذي سجّلت به هنا ('+esc(EMAIL)+'). لو ظهرت رسالة «unable to open the file» فأنت مسجّل بحساب جوجل آخر في المتصفح: افتح الرابط في نافذة خفية (Incognito) وسجّل بهذا الحساب فقط.</div><button class="btn sec" onclick="checkActive()">تحقق من التفعيل</button>';
}
// إذا كان المتجر «قابلاً للنشر» عند لاڤندرز لكن سكربت المالك لم يُفتح بعد (فشل الفتح سابقاً)، نعيد إرسال الرمز تلقائياً
async function syncPaid(b){
  try{
    if(b.status!=='paid')return;
    const c=await jsonp(b.backendUrl,{action:'config'},12000);
    if(!c||c.status!=='trial')return;
    const j=await api('appb_unlock',{appId:b.appId},true);
    if(j&&j.code){await jsonp(b.backendUrl,{action:'unlock',code:j.code},12000)}
  }catch(e){}
}
async function editBuild(){
  const b=S.cur;
  if(!b.backendUrl||!b.scriptId){S.cur={appId:'',slot:b.slot,kind:b.kind||'',name:b.name||'',payInfo:'',bizImage:'',items:[{name:'',desc:'',price:'',packQty:1,packLabel:'',imageUrl:''}],_new:true};renderEditor();return}
  $('app').innerHTML='<div class="card sub">جاري تحميل بيانات متجرك…</div>';
  try{
    await gAuth();const cfg=await loadConfigCell(b.sheetId);
    if(!cfg)throw new Error('لم أجد إعدادات المتجر في الشيت');
    b.payInfo=cfg.payInfo||'';b.bizImage=cfg.bizImage||'';b.items=cfg.items.map(it=>({name:it.name,desc:it.desc,price:it.price,packQty:it.packQty,packLabel:it.packLabel,imageUrl:it.imageUrl}));b.pendingBiz=null;
    delete b._meta;renderEditor();
  }catch(err){S.cur=b;renderDash();alert(err.apiOff?'فعّل Apps Script API ثم أعد المحاولة':(/parse range/i.test(err.message||'')?'شيت هذا المتجر لا يحتوي إعداداته — أنشئ المتجر من جديد':(err.message||'تعذّر التحميل')))}
}
async function unlock(){
  const b=S.cur;$('unlBtn').disabled=true;showMsg('m4','جاري الفتح…','info');
  const j=await api('appb_unlock',{appId:b.appId},true);
  if(j.error){$('unlBtn').disabled=false;showMsg('m4',j.message||j.error,'err');return}
  try{const r=await jsonp(b.backendUrl,{action:'unlock',code:j.code},15000);if(!(r&&r.status==='paid'))throw new Error((r&&r.error)||'فشل')}
  catch(err){$('unlBtn').disabled=false;showMsg('m4','تم الدفع لكن تعذّر فتح الخلفية: '+(err.message==='load'||err.message==='timeout'?'فعّل الخلفية أولاً ثم أعد المحاولة':err.message),'err');return}
  const j2=await api('appb_my_builds');if(j2.builds){S.builds=j2.builds;S.cur=S.builds.find(x=>x.appId===b.appId)||b}
  renderDash('تم فتح النسخة القابلة للنشر.');
}
let apkPoll=null;
async function loadApk(){
  clearTimeout(apkPoll);const j=await api('appb_download',{appId:S.cur.appId});const el=$('apk');if(!el)return;
  if(j.error){el.textContent=j.message||j.error;return}
  if(j.status==='ready'){el.innerHTML='<a class="btn ok" href="'+esc(j.url)+'">تنزيل APK</a>'+(j.note?'<div class="small" style="margin-top:8px">'+esc(j.note)+'</div>':'');return}
  if(j.status==='building'){el.textContent='جاري بناء التطبيق… يستغرق عدة دقائق وتتحدث الصفحة تلقائياً.';apkPoll=setTimeout(loadApk,15000);return}
  el.innerHTML=(j.status==='failed'?'<div class="small" style="color:#ffb3c0;margin-bottom:6px">فشلت المحاولة السابقة.</div>':'')+'<button class="btn" id="apkBtn" onclick="buildApk()">بناء تطبيق الأندرويد</button><div id="m5" class="msg"></div>';
}
async function buildApk(){
  $('apkBtn').disabled=true;const j=await api('appb_build_apk',{appId:S.cur.appId},true);
  if(j.error){$('apkBtn').disabled=false;showMsg('m5',j.message||j.error,'err');return}
  loadApk();
}

// ───── الطلبات (من شيتك مباشرة) ─────
async function loadOrders(){
  const b=S.cur,el=$('ords');if(!el)return;
  try{
    await gAuth();
    const j=await gf('https://sheets.googleapis.com/v4/spreadsheets/'+b.sheetId+'/values/Requests!A2:R');
    const rows=(j.values||[]).map((v,i)=>({row:i+2,v:v})).filter(o=>o.v[15]==='pending').reverse();
    S.pend=rows;
    if(!rows.length){el.textContent='لا توجد طلبات بانتظار المراجعة.';return}
    el.innerHTML=rows.map(o=>{const v=o.v;return '<div class="ord"><b>'+esc(v[2])+' ×'+esc(v[3])+'</b> — '+money(v[5])+'<div class="small">'+esc(v[6])+' · <span dir="ltr">'+esc(v[7])+'</span><br>'+esc(v[9])+(v[10]?' · '+esc(v[10]):'')+(v[13]?'<br>مرجع الدفع: <span dir="ltr">'+esc(v[13])+'</span>':'')+(v[14]==='yes'?'<br>✓ تحقق من البريد':'')+'</div><div class="row" style="margin-top:8px"><button class="btn ok sm" onclick="decide('+o.row+',\'accept\',this)">قبول</button><button class="btn bad sm" onclick="decide('+o.row+',\'reject\',this)">رفض</button></div></div>'}).join('');
  }catch(err){el.innerHTML='<button class="btn sec sm" onclick="loadOrders()">عرض الطلبات (يتطلب موافقة جوجل)</button>'+(err.apiOff?'':'<div class="small" style="margin-top:6px">'+esc(err.message||'')+'</div>')}
}
async function decide(row,d,btn){
  btn.disabled=true;const b=S.cur,o=S.pend.find(x=>x.row===row);if(!o){return}
  try{
    const v=o.v,base='https://sheets.googleapis.com/v4/spreadsheets/'+b.sheetId;
    const chk=await gf(base+'/values/Requests!P'+row);
    if(!(chk.values&&chk.values[0]&&chk.values[0][0]==='pending')){alert('الطلب مُعالَج مسبقاً');loadOrders();return}
    let sheetRow='';
    if(d==='accept'){
      const ap=await gf(base+'/values/Orders!A1:append?valueInputOption=RAW&insertDataOption=INSERT_ROWS',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({values:[[new Date().toISOString(),v[2],Number(v[3]),Number(v[4]),Number(v[5]),v[6],'BUY','',v[9]]]})});
      const m=/(\d+)$/.exec((ap.updates&&ap.updates.updatedRange)||'');sheetRow=m?Number(m[1]):'';
    }
    await gf(base+'/values/Requests!P'+row+':R'+row+'?valueInputOption=RAW',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({values:[[d==='accept'?'accepted':'rejected',new Date().toISOString(),sheetRow]]})});
    loadOrders();
  }catch(err){alert(err.message||'تعذّر الحفظ');btn.disabled=false}
}
boot();
