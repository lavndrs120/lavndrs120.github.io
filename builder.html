<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>بناء تطبيقك — لاڤندرز</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
:root{--void:#04040A;--glass:rgba(255,255,255,.04);--gb:rgba(255,255,255,.09);--gold:#C9A84C;--gold2:#F0D080;--em:#10B981;--red:#F43F5E;--blue:#3B82F6;--text:rgba(255,255,255,.92);--dim:rgba(255,255,255,.5);--faint:rgba(255,255,255,.18)}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--void);color:var(--text);font-family:'Inter',system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif;min-height:100vh;overflow-x:hidden;line-height:1.6}
body::after{content:'';position:fixed;inset:0;z-index:-1;background:linear-gradient(rgba(6,6,12,.88),rgba(6,6,12,.7) 40%,rgba(6,6,12,.85)),url(bg-m.jpg) center/cover no-repeat}
@media(min-width:900px){body::after{background:linear-gradient(rgba(6,6,12,.8),rgba(6,6,12,.72)),url(bg-d.jpg) center/cover no-repeat}}
.wrap{max-width:560px;margin:0 auto;padding:16px 16px 90px}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.logo{font-size:20px;font-weight:900;background:linear-gradient(135deg,#C9A84C,#F0D080);-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:1px}
a.back{color:var(--dim);font-size:13px;text-decoration:none}
h1{font-size:22px;margin-bottom:4px}h2{font-size:16px;margin-bottom:10px;color:var(--gold2)}
.sub{color:var(--dim);font-size:13px;margin-bottom:16px}
.card{background:var(--glass);border:1px solid var(--gb);border-radius:16px;padding:16px;margin-bottom:14px}
label{display:block;font-size:12px;color:var(--dim);margin:10px 0 4px}
input,textarea,select{width:100%;background:rgba(255,255,255,.05);border:1px solid var(--gb);border-radius:10px;color:#fff;font:inherit;font-size:14px;padding:10px 12px;outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--gold)}
textarea{resize:vertical;min-height:60px}
select option{background:#12121c}
.row{display:flex;gap:8px}.row>*{flex:1;min-width:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:none;border-radius:12px;padding:11px 16px;font:inherit;font-size:14px;font-weight:600;cursor:pointer;background:linear-gradient(135deg,#C9A84C,#E6C46A);color:#1a1405;width:100%;margin-top:12px}
.btn.sec{background:var(--glass);border:1px solid var(--gb);color:var(--text)}
.btn.ok{background:var(--em);color:#04150e}.btn.bad{background:rgba(244,63,94,.16);border:1px solid rgba(244,63,94,.4);color:#ffb3c0}
.btn.sm{width:auto;padding:7px 12px;font-size:12px;margin-top:0}
.btn:disabled{opacity:.5;cursor:not-allowed}
.msg{font-size:13px;margin-top:10px;padding:9px 12px;border-radius:10px;display:none}
.msg.err{display:block;background:rgba(244,63,94,.12);color:#ffb3c0;border:1px solid rgba(244,63,94,.3)}
.msg.good{display:block;background:rgba(16,185,129,.12);color:#8ff0c8;border:1px solid rgba(16,185,129,.3)}
.msg.info{display:block;background:rgba(201,168,76,.1);color:var(--gold2);border:1px solid rgba(201,168,76,.28)}
.pill{display:inline-block;font-size:11px;padding:2px 10px;border-radius:99px;border:1px solid var(--gb);color:var(--dim)}
.pill.trial{color:var(--gold2);border-color:rgba(201,168,76,.5)}.pill.paid{color:#8ff0c8;border-color:rgba(16,185,129,.5)}.pill.expired{color:#ffb3c0;border-color:rgba(244,63,94,.5)}
.item{border:1px solid var(--gb);border-radius:14px;padding:12px;margin-bottom:10px;background:rgba(255,255,255,.02)}
.item-h{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--gold2);margin-bottom:4px}
.val{font-size:12px;margin-top:6px;color:var(--dim)}.val.low{color:#ffb3c0}.val.good{color:#8ff0c8}
.thumb{width:64px;height:64px;border-radius:12px;object-fit:cover;background:rgba(255,255,255,.06);border:1px solid var(--gb);flex:none}
.imgrow{display:flex;gap:10px;align-items:center;margin-top:10px}
.imgrow .fbtn{font-size:12px;color:var(--gold2);cursor:pointer;border:1px dashed rgba(201,168,76,.5);padding:8px 12px;border-radius:10px}
.imgrow input{display:none}
.tokbox{font-family:ui-monospace,Menlo,monospace;font-size:20px;letter-spacing:2px;text-align:center;padding:14px;border:1px dashed var(--gold);border-radius:12px;color:var(--gold2);direction:ltr;user-select:all;margin:8px 0}
.build{cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:10px}
.small{font-size:12px;color:var(--dim)}
.ord{border-bottom:1px solid var(--gb);padding:10px 0}.ord:last-child{border:none}
.steps{display:flex;gap:6px;margin-bottom:14px}.steps i{flex:1;height:4px;border-radius:4px;background:var(--faint)}.steps i.on{background:var(--gold)}
.hide{display:none!important}
.link{color:var(--gold2);word-break:break-all;direction:ltr;display:block;font-size:13px}
#gsi{display:flex;justify-content:center;margin-top:16px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><div class="logo">LAVNDR120</div><a class="back" href="dashboard.html">← لوحتي</a></div>
  <div id="app"></div>
</div>
<script>
const WORKER_URL='https://lavndr.omssolutionorders.workers.dev';
const GSI_CLIENT_ID='776097955989-go2bsq8e7c1umei4vj984jtabve49m32.apps.googleusercontent.com';
let TOKEN='',EMAIL='';try{TOKEN=sessionStorage.getItem('lavndr_token')||'';EMAIL=sessionStorage.getItem('lavndr_email')||''}catch(e){}
let S={rules:{minValue:4.275,maxItems:9},ents:[],builds:[],cur:null,tick:null};
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const round3=n=>Math.round(n*1000)/1000;
const money=n=>'$'+(Math.round(n*1000)/1000).toString();

// ───── شبكة ─────
async function api(action,params,post){
  try{
    let r;
    if(post){
      const body=Object.assign({},params||{},{action:action,token:TOKEN});
      r=await fetch(WORKER_URL+'?action='+action,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body)});
    }else{
      const q=new URLSearchParams(Object.assign({},params||{},{action:action,token:TOKEN}));
      r=await fetch(WORKER_URL+'?'+q.toString());
    }
    const j=await r.json();
    if(j&&(j.code===401||j.error==='Invalid token')){logout();return {error:'انتهت الجلسة'}}
    return j||{error:'رد فارغ'};
  }catch(e){return {error:'فشل الاتصال — تحقق من الإنترنت'}}
}
function logout(){TOKEN='';EMAIL='';try{sessionStorage.removeItem('lavndr_token');sessionStorage.removeItem('lavndr_email')}catch(e){}showLogin('سجّل دخولك للمتابعة')}

// ───── الدخول ─────
function showLogin(m){
  $('app').innerHTML='<div class="card" style="text-align:center"><h1>بناء تطبيقك</h1><p class="sub">'+esc(m||'سجّل دخولك بحساب Google')+'</p><div id="gsi"></div></div>';
  const go=()=>{if(window.google&&google.accounts){google.accounts.id.initialize({client_id:GSI_CLIENT_ID,callback:onCred});google.accounts.id.renderButton($('gsi'),{theme:'filled_black',size:'large',shape:'pill',locale:'ar'})}else setTimeout(go,300)};go();
}
async function onCred(resp){
  $('app').innerHTML='<div class="card sub">جاري التحقق…</div>';
  try{
    const r=await fetch(WORKER_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'login',idToken:resp.credential})});
    const j=await r.json();
    if(!j.token){showLogin('فشل تسجيل الدخول — حاول مرة أخرى');return}
    TOKEN=j.token;EMAIL=j.email;try{sessionStorage.setItem('lavndr_token',TOKEN);sessionStorage.setItem('lavndr_email',EMAIL)}catch(e){}
    boot();
  }catch(e){showLogin('فشل الاتصال — حاول مرة أخرى')}
}

// ───── القائمة ─────
async function boot(){
  if(!TOKEN){showLogin();return}
  $('app').innerHTML='<div class="card sub">جاري التحميل…</div>';
  const j=await api('appb_my_builds');
  if(j.error){$('app').innerHTML='<div class="card"><div class="msg err">'+esc(j.error)+'</div><button class="btn sec" onclick="boot()">إعادة المحاولة</button></div>';return}
  S.rules=j.rules||S.rules;S.ents=j.entitlements||[];S.builds=j.builds||[];renderList();
}
function statusPill(b){const m={draft:'مسودة',trial:'تجربة',paid:'قابل للنشر',expired:'انتهت التجربة'};return '<span class="pill '+esc(b.status)+'">'+(m[b.status]||esc(b.status))+'</span>'}
function renderList(){
  clearInterval(S.tick);
  let h='<h1>بناء تطبيقك</h1><p class="sub">نظام طلبات للويب والأندرويد باسم بزنسك.</p>';
  if(!S.ents.length&&!S.builds.length){
    h+='<div class="card"><div class="msg info">بناء التطبيقات متاح لأعضاء OMS والريسلر والفرانشايز الفعّالين.</div><a class="btn sec" style="text-decoration:none" href="packages.html">عرض الباقات</a></div>';
    $('app').innerHTML=h;return;
  }
  S.builds.forEach(b=>{h+='<div class="card build" onclick="openBuild(\''+esc(b.appId)+'\')"><div><b>'+esc(b.name)+'</b><div class="small">'+(b.kind==='products'?'منتجات':'خدمات')+' · '+b.items.length+' أصناف</div></div>'+statusPill(b)+'</div>'});
  const free=S.ents.filter(e=>e.used<e.capacity);
  if(free.length)h+='<button class="btn" onclick="newBuild()">+ تطبيق جديد</button>';
  else if(S.ents.length)h+='<div class="msg info">استهلكت كل التطبيقات المتاحة في عضويتك.</div>';
  $('app').innerHTML=h;
}
function openBuild(id){const b=S.builds.find(x=>x.appId===id);if(!b)return;S.cur=b;renderBuild()}
function newBuild(){
  const free=S.ents.filter(e=>e.used<e.capacity);
  const slotNames={admin:'الإدارة',oms_services:'OMS خدمات',oms_products:'OMS منتجات',reseller:'ريسلر',franchise:'فرانشايز'};
  const e=free[0];
  S.cur={appId:'',status:'draft',slot:e.slot,kind:e.kind||'',name:'',payInfo:'',items:[{name:'',desc:'',price:'',packQty:1,packLabel:'',imageUrl:'',imageId:''}],bizImageUrl:'',bizImageId:'',_free:free,_slotNames:slotNames};
  renderEditor();
}

// ───── المحرر ─────
function renderBuild(){
  const b=S.cur;
  if(b.status==='draft'&&!b.sheetLinked){
    const miss=!b.bizImageId||(b.items||[]).some(it=>!it.imageId);
    if(miss)renderEditor();else renderLink();return}
  renderDash();
}
function stepsBar(n){return '<div class="steps">'+[1,2,3].map(i=>'<i class="'+(i<=n?'on':'')+'"></i>').join('')+'</div>'}
function renderEditor(){
  clearInterval(S.tick);
  const b=S.cur,min=S.rules.minValue;
  let h=stepsBar(1)+'<h1>'+(b.appId?'تعديل التطبيق':'تطبيق جديد')+'</h1><p class="sub">الخطوة 1 من 3: بيانات البزنس والأصناف</p><div class="card">';
  if(!b.appId&&b._free&&b._free.length>1){h+='<label>العضوية</label><select id="f_slot" onchange="S.cur.slot=this.value;onSlot()">'+b._free.map(e=>'<option value="'+esc(e.slot)+'"'+(e.slot===b.slot?' selected':'')+'>'+esc(b._slotNames[e.slot]||e.slot)+' (متبقٍ '+(e.capacity-e.used)+')</option>').join('')+'</select>'}
  const slotKind=((S.ents.find(e=>e.slot===b.slot)||{}).kind)||'';
  if(!slotKind){h+='<label>نوع البزنس</label><select id="f_kind"><option value="services"'+(b.kind==='services'?' selected':'')+'>خدمات</option><option value="products"'+(b.kind==='products'?' selected':'')+'>منتجات</option></select>'}
  h+='<label>اسم البزنس أو البراند</label><input id="f_name" maxlength="60" value="'+esc(b.name)+'">';
  h+='<label>طريقة الدفع التي يراها الزبون (رقم حساب، محفظة…)</label><textarea id="f_pay" maxlength="400">'+esc(b.payInfo)+'</textarea>';
  h+='<div class="imgrow"><img class="thumb" id="bizThumb" src="'+esc(b.bizImageUrl||'')+'" onerror="this.style.visibility=\'hidden\'"><label class="fbtn" style="margin:0">صورة البزنس (تظهر كخلفية)<input type="file" accept="image/*" onchange="pickImg(this,\'biz\')"></label></div></div>';
  h+='<h2>الأصناف (حتى '+S.rules.maxItems+')</h2><div id="items"></div>';
  h+='<button class="btn sec" id="addBtn" onclick="addItem()">+ إضافة صنف</button>';
  h+='<div id="m1" class="msg"></div><button class="btn" id="saveBtn" onclick="saveBuild()">حفظ ومتابعة</button><button class="btn sec" onclick="boot()">رجوع</button>';
  $('app').innerHTML=h;renderItems();
}
function onSlot(){renderEditor()}
function readForm(){
  const b=S.cur;b.name=($('f_name')||{}).value||'';b.payInfo=($('f_pay')||{}).value||'';
  if($('f_kind'))b.kind=$('f_kind').value;
  b.items.forEach((it,i)=>{const g=k=>$('i'+i+k);if(!g('n'))return;it.name=g('n').value;it.desc=g('d').value;it.price=g('p').value;it.packQty=parseInt(g('q').value,10)||1;it.packLabel=g('l').value});
}
function renderItems(){
  const b=S.cur,min=S.rules.minValue;let h='';
  b.items.forEach((it,i)=>{
    h+='<div class="item"><div class="item-h"><span>صنف '+(i+1)+'</span>'+(b.items.length>1?'<a style="color:var(--red);cursor:pointer;font-size:12px" onclick="delItem('+i+')">حذف</a>':'')+'</div>';
    h+='<label>اسم الصنف</label><input id="i'+i+'n" maxlength="40" value="'+esc(it.name)+'">';
    h+='<label>وصف قصير (اختياري)</label><textarea id="i'+i+'d" maxlength="300">'+esc(it.desc)+'</textarea>';
    h+='<div class="row"><div><label>السعر ($)</label><input id="i'+i+'p" inputmode="decimal" value="'+esc(it.price)+'" oninput="valHint('+i+')"></div><div><label>عدد الوحدات في الباقة</label><input id="i'+i+'q" type="number" min="1" max="1000" value="'+esc(it.packQty)+'" oninput="valHint('+i+')"></div></div>';
    h+='<label>اسم الباقة (إن لزم)</label><input id="i'+i+'l" maxlength="40" placeholder="مثال: اشتراك 3 جلسات" value="'+esc(it.packLabel)+'">';
    h+='<div class="val" id="v'+i+'"></div>';
    h+='<div class="imgrow"><img class="thumb" src="'+esc(it.pendingImg||it.imageUrl||'')+'" onerror="this.style.visibility=\'hidden\'"><label class="fbtn" style="margin:0">صورة الصنف<input type="file" accept="image/*" onchange="pickImg(this,'+i+')"></label></div></div>';
  });
  $('items').innerHTML=h;b.items.forEach((_,i)=>valHint(i));
  $('addBtn').style.display=b.items.length>=S.rules.maxItems?'none':'';
}
function valHint(i){
  const min=S.rules.minValue,p=parseFloat(String(($('i'+i+'p')||{}).value).replace(',','.')),q=parseInt(($('i'+i+'q')||{}).value,10)||1,el=$('v'+i);if(!el)return;
  if(!(p>0)){el.className='val';el.textContent='القيمة الدنيا لكل صنف '+money(min)+' (السعر × عدد الوحدات).';return}
  const v=round3(p*q);
  if(v+1e-9<min){const sg=Math.ceil(min/p-1e-9);el.className='val low';el.innerHTML='قيمة الصنف '+money(v)+' أقل من '+money(min)+'. صمّم باقة اشتراك: <a style="color:var(--gold2);cursor:pointer;text-decoration:underline" onclick="setPack('+i+','+sg+')">اجعلها '+sg+' وحدات ('+money(round3(p*sg))+')</a>'}
  else{el.className='val good';el.textContent='قيمة الصنف '+money(v)+' ✓'}
}
function setPack(i,q){$('i'+i+'q').value=q;valHint(i)}
function addItem(){readForm();if(S.cur.items.length>=S.rules.maxItems)return;S.cur.items.push({name:'',desc:'',price:'',packQty:1,packLabel:'',imageUrl:'',imageId:''});renderItems()}
function delItem(i){readForm();S.cur.items.splice(i,1);renderItems()}

// ───── الصور ─────
function resizeImg(file,max,cb){
  const fr=new FileReader();fr.onerror=()=>cb(null);
  fr.onload=()=>{const im=new Image();im.onerror=()=>cb(null);im.onload=()=>{
    let w=im.width,h=im.height,sc=Math.min(1,max/Math.max(w,h));w=Math.round(w*sc);h=Math.round(h*sc);
    const c=document.createElement('canvas');
    let q=.85,out='';
    for(let t=0;t<8;t++){c.width=w;c.height=h;const x=c.getContext('2d');x.drawImage(im,0,0,w,h);out=c.toDataURL('image/jpeg',q);if(out.length<=250000)break;q-=.1;if(q<.4){q=.7;w=Math.round(w*.8);h=Math.round(h*.8)}}
    cb(out.length<=255000?out:null)};im.src=fr.result};
  fr.readAsDataURL(file);
}
function pickImg(inp,target){
  const f=inp.files&&inp.files[0];if(!f)return;readForm();
  resizeImg(f,900,d=>{
    if(!d){showMsg('m1','تعذّر تجهيز الصورة — جرّب صورة أخرى','err');return}
    if(target==='biz'){S.cur.pendingBiz=d;$('bizThumb').src=d;$('bizThumb').style.visibility='visible'}
    else{S.cur.items[target].pendingImg=d;renderItems()}
  });
}
function showMsg(id,t,cls){const e=$(id);if(!e)return;e.className='msg '+(cls||'err');e.textContent=t}

// ───── الحفظ ─────
async function saveBuild(){
  readForm();const b=S.cur;$('saveBtn').disabled=true;showMsg('m1','جاري الحفظ…','info');
  const payload={appId:b.appId||undefined,slot:b.slot,kind:b.kind,name:b.name,payInfo:b.payInfo,
    items:b.items.map(it=>({name:it.name,desc:it.desc,price:parseFloat(String(it.price).replace(',','.')),packQty:it.packQty,packLabel:it.packLabel,imageId:it.imageId||''}))};
  const j=await api('appb_save',payload,true);
  if(j.error){
    $('saveBtn').disabled=false;
    if(j.error==='invalid_items'&&j.errors){
      const mp={name:'اسم الصنف مطلوب',price:'السعر غير صحيح',count:'عدد الأصناف يجب أن يكون من 1 إلى '+S.rules.maxItems};
      showMsg('m1',j.errors.map(e=>(e.idx!=null?'صنف '+(e.idx+1)+': ':'')+(e.code==='min_value'?'القيمة '+money(e.value)+' أقل من '+money(e.min)+' — اجعل الباقة '+e.suggestedPackQty+' وحدات':(mp[e.code]||e.code))).join(' | '),'err');
    }else showMsg('m1',j.message||j.error,'err');
    return;
  }
  b.appId=j.appId;
  // رفع الصور المعلّقة (الصنف يُحفَظ أولاً ثم تُرفع صورته)
  const jobs=[];if(b.pendingBiz)jobs.push(['biz',b.pendingBiz]);b.items.forEach((it,i)=>{if(it.pendingImg)jobs.push([String(i),it.pendingImg])});
  for(let k=0;k<jobs.length;k++){
    showMsg('m1','رفع الصور '+(k+1)+' من '+jobs.length+'…','info');
    const r=await api('appb_upload_image',{appId:b.appId,target:jobs[k][0],dataUrl:jobs[k][1]},true);
    if(r.error){$('saveBtn').disabled=false;showMsg('m1','الصورة '+(k+1)+': '+(r.message||r.error)+' — البيانات محفوظة، أعد المحاولة.','err');await refreshCur();return}
  }
  const j2=await api('appb_my_builds');
  if(j2.builds){S.builds=j2.builds;S.ents=j2.entitlements||S.ents}
  S.cur=S.builds.find(x=>x.appId===b.appId)||b;
  const miss=[];if(!S.cur.bizImageId)miss.push('صورة البزنس');(S.cur.items||[]).forEach((it,i)=>{if(!it.imageId)miss.push('صورة الصنف '+(i+1))});
  if(miss.length){S.cur._free=null;renderEditor();showMsg('m1','تم الحفظ. بقي: '+miss.join('، '),'info');return}
  if(S.cur.sheetLinked){renderDash();return}
  renderLink();
}
async function refreshCur(){const j=await api('appb_my_builds');if(j.builds){S.builds=j.builds;const n=j.builds.find(x=>x.appId===S.cur.appId);if(n){n._free=null;S.cur=n}}}

// ───── ربط الشيت ─────
function renderLink(){
  const b=S.cur;let h=stepsBar(2)+'<h1>ربط الشيت</h1><p class="sub">الخطوة 2 من 3: ألصق رابط شيت بزنسك أو معرّفه.</p><div class="card">';
  h+='<div class="small">يجب أن يكون حسابك مالك الشيت أو محرّراً فيه.</div><label>رابط الشيت أو معرّفه</label><input id="sid" dir="ltr" placeholder="https://docs.google.com/spreadsheets/d/…">';
  h+='<div id="m2" class="msg"></div><button class="btn" id="lnkBtn" onclick="linkSheet()">احصل على التوكن</button></div>';
  if(b.pendingToken)h+='<div class="card"><div class="small">لديك توكن سابق لشيت قيد الربط:</div><button class="btn sec" onclick="renderToken(\''+esc(b.pendingToken)+'\')">متابعة إدخال التوكن</button></div>';
  h+='<button class="btn sec" onclick="renderEditor()">رجوع للتعديل</button>';
  $('app').innerHTML=h;
}
async function linkSheet(){
  $('lnkBtn').disabled=true;showMsg('m2','جاري التحقق من الشيت…','info');
  const j=await api('appb_link_sheet',{appId:S.cur.appId,sheetId:$('sid').value},true);
  $('lnkBtn').disabled=false;
  if(j.error){showMsg('m2',j.message||j.error,'err');return}
  renderToken(j.token,j.sheetTitle);
}
function renderToken(tok,title){
  let h=stepsBar(3)+'<h1>التوكن</h1><p class="sub">الخطوة 3 من 3: أدخل التوكن لإكمال الربط.</p><div class="card">';
  if(title)h+='<div class="small">الشيت: '+esc(title)+'</div>';
  h+='<div class="tokbox" id="tokv">'+esc(tok)+'</div><button class="btn sec sm" onclick="copyTxt(\''+esc(tok)+'\')">نسخ التوكن</button>';
  h+='<label>أدخل التوكن هنا</label><input id="tokin" dir="ltr" placeholder="LVN-XXXX-XXXX-XXXX"><div id="m3" class="msg"></div><button class="btn" id="cfBtn" onclick="confirmTok()">تأكيد الربط وبدء التجربة</button></div>';
  $('app').innerHTML=h;
}
function copyTxt(t){try{navigator.clipboard.writeText(t)}catch(e){}}
async function confirmTok(){
  $('cfBtn').disabled=true;showMsg('m3','جاري التأكيد…','info');
  const j=await api('appb_confirm_token',{appId:S.cur.appId,sheetToken:$('tokin').value},true);
  $('cfBtn').disabled=false;
  if(j.error){showMsg('m3',j.message||j.error,'err');return}
  await refreshCur();renderDash(j.trialStarted?j.note:'');
}

// ───── لوحة التطبيق ─────
function fmtLeft(s){const h=Math.floor(s/3600),m=Math.floor(s%3600/60);return h+' س '+m+' د'}
function renderDash(banner){
  clearInterval(S.tick);clearTimeout(apkPoll);const b=S.cur;
  let h='<h1>'+esc(b.name)+'</h1><p class="sub">'+statusPill(b)+'</p>';
  if(banner)h+='<div class="msg good" style="display:block">تم ربط الشيت. '+esc(banner)+'</div>';
  if(b.status==='trial')h+='<div class="msg info" style="display:block"><span id="left"></span><br>'+esc(b.note)+'</div>';
  if(b.status==='expired')h+='<div class="msg err" style="display:block">'+esc(b.note)+'</div>';
  if(b.status==='trial'||b.status==='expired')h+='<button class="btn ok" id="unlBtn" onclick="unlock()">فتح النسخة القابلة للنشر</button><div id="m4" class="msg"></div>';
  if(b.status==='trial'||b.status==='paid'){
    h+='<div class="card"><h2>رابط المتجر</h2><a class="link" href="'+esc(b.webUrl)+'" target="_blank" rel="noopener">'+esc(b.webUrl)+'</a><button class="btn sec sm" style="margin-top:10px" onclick="copyTxt(\''+esc(b.webUrl)+'\')">نسخ الرابط</button></div>';
    h+='<div class="card"><h2>تطبيق الأندرويد</h2><div id="apk" class="small">…</div></div>';
    h+='<div class="card"><h2>الطلبات</h2><div id="ords" class="small">جاري التحميل…</div></div>';
  }
  h+='<button class="btn sec" onclick="S.cur._free=null;renderEditor()">تعديل الأصناف والصور</button><button class="btn sec" onclick="boot()">رجوع للقائمة</button>';
  $('app').innerHTML=h;
  if(b.status==='trial'){let s=b.secondsLeft;const t=()=>{const e=$('left');if(e)e.textContent='المتبقي من التجربة: '+fmtLeft(Math.max(0,s));if(s<=0){clearInterval(S.tick);boot();return}s--};t();S.tick=setInterval(t,1000)}
  if(b.status==='trial'||b.status==='paid'){loadApk();loadOrders()}
}
async function unlock(){
  $('unlBtn').disabled=true;const j=await api('appb_unlock',{appId:S.cur.appId},true);$('unlBtn').disabled=false;
  if(j.error){showMsg('m4',j.message||j.error,'err');return}
  await refreshCur();renderDash();
}
let apkPoll=null;
async function loadApk(){
  clearTimeout(apkPoll);
  const j=await api('appb_download',{appId:S.cur.appId});const el=$('apk');if(!el)return;
  if(j.error){el.textContent=j.message||j.error;return}
  if(j.status==='ready'){el.innerHTML='<a class="btn ok" style="text-decoration:none" href="'+esc(j.url)+'">تنزيل APK</a>'+(j.note?'<div class="small" style="margin-top:8px">'+esc(j.note)+'</div>':'');return}
  if(j.status==='building'){el.textContent='جاري بناء التطبيق… يستغرق عدة دقائق وتتحدث الصفحة تلقائياً.';apkPoll=setTimeout(loadApk,15000);return}
  el.innerHTML=(j.status==='failed'?'<div class="small" style="color:#ffb3c0;margin-bottom:6px">فشلت المحاولة السابقة.</div>':'')+'<button class="btn" id="apkBtn" onclick="buildApk()">بناء تطبيق الأندرويد</button><div id="m5" class="msg"></div>';
}
async function buildApk(){
  $('apkBtn').disabled=true;const j=await api('appb_build_apk',{appId:S.cur.appId},true);
  if(j.error){$('apkBtn').disabled=false;showMsg('m5',j.message||j.error,'err');return}
  loadApk();
}
async function loadOrders(){
  const j=await api('appb_orders',{appId:S.cur.appId,status:'pending'});const el=$('ords');if(!el)return;
  if(j.error){el.textContent=j.error;return}
  const L=j.orders||[];if(!L.length){el.textContent='لا توجد طلبات بانتظار المراجعة.';return}
  el.innerHTML=L.map(o=>'<div class="ord"><b>'+esc(o.item)+' ×'+esc(o.qty)+'</b> — '+money(o.total)+'<div class="small">'+esc(o.customer)+' · <span dir="ltr">'+esc(o.phone)+'</span>'+(o.city?' · '+esc(o.city):'')+(o.txnRef?'<br>مرجع الدفع: <span dir="ltr">'+esc(o.txnRef)+'</span>':'')+'</div><div class="row" style="margin-top:8px"><button class="btn ok sm" onclick="decide(\''+esc(o.orderId)+'\',\'accept\',this)">قبول</button><button class="btn bad sm" onclick="decide(\''+esc(o.orderId)+'\',\'reject\',this)">رفض</button></div></div>').join('');
}
async function decide(id,d,btn){
  btn.disabled=true;const j=await api('appb_decide_order',{appId:S.cur.appId,orderId:id,decision:d},true);
  if(j.error){alert(j.message||j.error);btn.disabled=false;return}
  if(j.message)alert(j.message);loadOrders();
}
boot();
</script>
</body>
</html>
